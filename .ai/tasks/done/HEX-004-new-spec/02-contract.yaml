goal: |
    Turn A-2 plan tasks 1 to 4 into Rust code inside crates/hexcell and one new crate crates/hexcell-canal-simulado. The hexcell binary stops being the A-1 skeleton: it reads its configuration from environment variables and fails before binding anything if a mandatory one is missing or unparseable, serves GET /health/live (real) and GET /health/ready (documented skeleton owned by HEX-006) on a loopback-by-default internal address, and runs a Tokio loop that consumes EventoEntrante, dispatches to a minimal echo processor and emits the reply via send(conversacion, MensajeSaliente::RespuestaLibre), matching all five ResultadoEnvio variants plus the Err case without ever assuming Aceptado. The new simulated adapter imitates the Meta Cloud API's restrictive semantics - deterministic event injection, captured sends, a 24 h service window that expires against an injectable test clock rather than the wall clock, and all four FR-12 rejections forceable and distinguishable. Two decisions the human settled on 2026-07-29 also land here: Cargo.lock starts being versioned (its .gitignore line goes away and the generated lock is committed), and the event-delivery convention gets its own ADR, numbered 0016 because docs/adr/README.md is the source of truth and already reserves 0001 through 0015 - including 0003 for the persistencia dual that HEX-006 will write. No persistence, no real channel, no contract battery, no SIGTERM handling, and hexcell-core is not touched at all.
