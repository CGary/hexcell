    covers: ["AC-10"]
  - statement: "docs/cotejo-puerto-de-canal-cloud-api.md maps the four failure variants and the
      five fields of the canonical incoming event against the official Cloud API error-code
      page, cites that URL, resolves the 131047 discrepancy, and records 132000/132001/132015/
