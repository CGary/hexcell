test_scenarios:
  - statement: "`cargo build --workspace` completes with no errors from a clean clone on
      stable Rust 1.92 with no rust-toolchain.toml present."
    covers: ["AC-1"]
  - statement: "`cargo test --workspace` completes with no errors and no test failures."
    covers: ["AC-2"]
  - statement: "`cargo fmt --check` and `cargo clippy --workspace -- -D warnings` terminate
      with no findings under default configuration, with no rustfmt.toml and no clippy.toml."
    covers: ["AC-3"]
  - statement: The root Cargo.toml declares a workspace with resolver 3 whose members are
      exactly the five crates, each of which compiles as a skeleton.
    covers: ["AC-4"]
  - statement: "crates/hexcell-meta/src/lib.rs contains no occurrence of the `pub` keyword as
      a whole word, so it declares no public type, trait, function or module, and its `//!`
      doc comment states its shape waits for adr-0013."
    covers: ["AC-5"]
  - statement: "The [dependencies] table of crates/hexcell-core/Cargo.toml is empty - no
      storage, HTTP, transport or async-runtime crate, and no path dependency on any other
      workspace crate."
    covers: ["AC-6"]
  - statement: "The ChannelAdapter trait and its canonical types compile in hexcell-core and
      cover the seven FR-12 elements, with no `impl ChannelAdapter for` anywhere in crates/."
    covers: ["AC-7"]
  - statement: "The external test crate crates/hexcell-core/tests/exhaustividad_resultado_envio.rs
      matches all five ResultadoEnvio variants and all four Acuse variants with no `_` arm and
      no `..` rest pattern."
    covers: ["AC-8"]
  - statement: "Adding a variant to ResultadoEnvio breaks compilation of that external test
      with E0004 non-exhaustive patterns, and removing one breaks it with E0599; both were
      reproduced on rustc 1.92.0 during blueprinting and the experiment is recorded in the
      cotejo document."
    covers: ["AC-8"]
  - statement: "No non-comment line under crates/*/src matches wa_id, msisdn, phone_number or
      the whole word jid, while doc-comment prose mentioning them is tolerated by the check."
    covers: ["AC-9"]
  - statement: "The guardian test crates/hexcell-core/tests/guardian_identidad_conversacion.rs
      proves the mapping is stable and injective from a test-local adapter stand-in, and that
      the Debug rendering of IdConversacion contains no transport substring."
    covers: ["AC-10"]
  - statement: "Introducing the leak deliberately - adding a public transport-named field to a
