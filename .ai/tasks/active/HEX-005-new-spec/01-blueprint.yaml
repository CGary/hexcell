summary: Reusable ChannelAdapter contract battery crate, engine policy deferring replies on
    FueraDeVentana, thread continuity across re-pairing, in-memory dedup with a documented window,
    and the 8081 test fix.
symbols:
    - BancoDeCanal
    - BancoConRelojControlable
    - verificar_contrato_del_puerto
    - RegistroDeDeduplicacion
    - VENTANA_DE_RETENCION_DEDUPLICACION_POR_DEFECTO
    - HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS
    - Configuracion::ventana_deduplicacion
    - VeredictoDeDeduplicacion
    - EstadoDeConversaciones
    - Motor::ejecutar
    - Motor::nuevo
    - AdaptadorSimulado::inyectar_desde_contacto
    - AdaptadorSimulado::re_emparejar
    - el_binario_no_vincula_nada_si_la_configuracion_es_invalida
task_id: HEX-005
test_scenarios:
    - covers:
        - AC-1
      statement: The battery is invoked from crates/hexcell-canal-simulado/tests/contrato_del_puerto.rs
        - that is, from OUTSIDE the crate that defines it - against a bench wrapping AdaptadorSimulado
        in restrictive mode, and every scenario passes; the battery crate itself names no concrete
        adapter type anywhere in its sources.
    - covers:
        - AC-1
      statement: 'crates/hexcell-canal-contrato compiles with hexcell-core as its only dependency and
        no tokio, proving the battery imposes no runtime on a future consumer, and it is a member of
        the workspace so `cargo test --workspace` runs it.'
    - covers:
        - AC-2
      statement: The battery forces FueraDeVentana, PlantillaRequerida, LimiteDeTasa and
        DestinatarioInvalido on four distinct conversations, observes each one distinctly through a
        match with no wildcard arm, and asserts the four values are pairwise distinct.
    - covers:
        - AC-2
      statement: 'With the bench clock controllable, a RespuestaLibre inside the window returns
        Aceptado with estado_ventana Abierta; after advancing past DURACION_VENTANA_SERVICIO the same
        send returns FueraDeVentana with estado_ventana Cerrada. The sequence completes in well under
        a second of wall time and repeats identically, proving it does not read SystemTime::now().'
    - covers:
        - AC-2
      statement: A forced rejection queued for one call applies to that call only - the next send on
        the same conversation with an open window returns Aceptado - so the four cases stay
        separable instead of blurring into a sticky global mode.
    - covers:
        - AC-3
      statement: 'The Motor sending a RespuestaLibre to a conversation whose window is closed does
        not merely log: the reply is enqueued in the conversation state as a deferred reply, which is
        observable, and the engine continues consuming without panicking and without stopping the
        loop.'
    - covers:
        - AC-4
      statement: 'After the deferral, the same contact writes again; the engine re-sends the deferred
        reply BEFORE the new events own reply, and the adapters captured sends show that order.
        FueraDeVentana therefore drives a documented policy rather than an unspecified path.'
    - covers:
        - AC-3
      statement: The FueraDeVentana arm remains one arm of a match that still names all five
        ResultadoEnvio variants plus Err with no wildcard arm, so adding a variant to the closed enum
        still breaks compilation of motor.rs.
    - covers:
        - AC-5
      statement: A contact writes and builds history; re_emparejar assigns a new device identifier;
        the same contact writes again and the engine assigns the event to the same IdConversacion,
        with the earlier history intact and continued in that same thread.
    - covers:
        - AC-5
      statement: At the adapter level the same contact resolves to the same IdConversacion before and
        after re-pairing, and two different contacts resolve to two different IdConversacion values,
        so the mapping is anchored to the contact and never to the device.
    - covers:
        - AC-6
      statement: 'No file under crates/hexcell/src/ constructs an IdConversacion: IdConversacion::nuevo
        appears nowhere in that directory, the engine only receives the value through the port and
        uses it as an opaque map key, and nothing parses, splits or reverses it.'
    - covers:
        - AC-7
      statement: The same IdDeduplicacion delivered twice inside the retention window causes exactly
        one dispatch to the processor and exactly one captured outbound send; the second delivery is
        discarded with its own log line.
    - covers:
        - AC-8
      statement: VENTANA_DE_RETENCION_DEDUPLICACION_POR_DEFECTO is declared as a Duration constant of
        one hour with a justification comment at its declaration that reasons about the channel's
        expected redelivery horizon and records that the definitive value is still an open product
        decision, and the registry also carries a documented hard cap on retained entries.
    - covers:
        - AC-8
      statement: 'The registry takes its retention window as a constructor parameter rather than
        reading a constant, and Configuracion exposes ventana_deduplicacion: with
        HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS absent from the environment the value is the
        one-hour default, and with it set to an explicit number that number is used instead.'
    - covers:
        - AC-8
      statement: HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS set to a value that is not a positive integer
        makes Configuracion::desde_entorno return ValorInvalido naming that variable and its expected
        format, exactly like the pre-existing HEXCELL_CAPACIDAD_COLA, and the binary still exits
        non-zero before binding anything.
    - covers:
        - AC-8
      statement: The one-hour default is declared exactly once, in crates/hexcell/src/deduplicacion.rs,
        and crates/hexcell/src/configuracion.rs references that constant instead of restating the
        number, so the default cannot drift away from the justification that documents it.
    - covers:
        - AC-9
      statement: A redelivery whose entry has already been pruned - the event stream advanced beyond
        the retention window - is processed again as a new event, deliberately and with a log line,
        with no panic and no unspecified path; the test pins that documented degraded behaviour.
    - covers:
        - AC-9
      statement: Every deduplication assertion is made with explicit SystemTime values supplied by
        the test, so the registry needs no clock, the suite never sleeps, and the verdicts are
        identical on every run.
    - covers:
        - AC-10
      statement: 'el_binario_no_vincula_nada_si_la_configuracion_es_invalida obtains a free port by
        binding 127.0.0.1:0 and dropping the listener, passes it to the child via
        HEXCELL_DIRECCION_SALUD, and asserts the child exits non-zero and nothing is listening there;
        the literal 8081 no longer appears in crates/hexcell/tests/configuracion.rs.'
    - covers:
        - AC-11
      statement: '`cargo fmt --check`, `cargo clippy --workspace --all-targets -- -D warnings` and
        `cargo test --workspace` all terminate with no errors and no findings on the resulting tree,
