    - covers:
        - AC-13
      statement: docs/STATUS.md gains exactly two Definido entries dated 2026-07-30 attributed to
        HEX-005, no existing bullet is rewritten, and no wording anywhere in the file marks etapa A-2
        as closed, finished or cerrada.
    - covers:
        - AC-8
        - AC-13
      statement: docs/STATUS.md also gains one Pendiente entry dated 2026-07-30 recording that the
        definitive deduplication retention window is an open product decision and naming
        HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS, so the shipped one hour is readable as a documented
