task_id: HEX-011
summary: >-
  Add sidecar/internal/outbox: SQLite durable outbox (modernc pure-Go driver, WAL + synchronous=FULL)
  with fsync-first persist, id_deduplicacion-keyed confirm, ordered redelivery and retention purge.

affected_files:
  - sidecar/internal/outbox/outbox.go
  - sidecar/internal/outbox/outbox_test.go
  - sidecar/go.mod
  - sidecar/go.sum
  - .github/workflows/ci.yml

symbols:
  - outbox.Outbox
  - outbox.Opciones
  - outbox.Entrada
  - outbox.Abrir
  - outbox.Outbox.Persistir
  - outbox.Outbox.Pendientes
  - outbox.Outbox.Confirmar
  - outbox.Outbox.Purgar
  - outbox.Outbox.Cerrar
  - outbox.RetencionPorOmision
  - outbox.RutaPorOmision
  - outbox.ErrOutboxCerrado
  - outbox.EventoPersistido
  - outbox.EventoConfirmado
  - outbox.EventoPurgado

