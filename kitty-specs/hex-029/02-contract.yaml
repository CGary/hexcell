task_id: HEX-029
summary: Add a `hexcell respaldar --directorio <ruta>` operator mode that drives the existing four-store backup under a pause-first
  discipline, plus its tests, docs and lab script.
goal: crates/hexcell/src/respaldo.rs implements and tests the complete four-store backup (respaldar_celula_con_ronda over
  sessions.db, knowledge_live.db and adapter_identity.db, plus ordenar_respaldo_sqlstore driving the sidecar over IPC with
  round-id acuse correlation, HEX-021), but nothing calls it outside its own integration tests - the third built-but-not-wired
  finding (LES-037). Wire it behind a new short-lived CLI mode in the same binary, following the HEX-024 emparejar precedent
  exactly (std::env::args parsing only, Spanish output, binary exit codes), so the e2e restore rehearsal (task 18 of stage
  A-3) has a backup to restore from. The mode runs with the cell's NUCLEO STOPPED and the SIDECAR RUNNING; that discipline
  is a design decision closed in 01-blueprint.yaml step 1 (the IPC socket accepts one active connection, most-recent-wins,
  and the nucleo reconnects after ~500 ms, so a concurrent backup process loses the race for its own acuse) and it must be
  stated in the mode's own output, in the runbook and in the lab script.
