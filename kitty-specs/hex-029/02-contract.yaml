  behaviors:
  - Do NOT touch any Go file (sidecar/**), sidecar/go.mod or sidecar/go.sum. The sidecar side of the backup is complete and
    wired (main.go:67 opens dbRespaldo, :106 injects it as Dependencias.DBRespaldo, servidor/manejo.go:171-176 dispatches
    TipoOrdenRespaldoSqlstore, and canal/respaldo.go already deletes an unverified copy on failure). If a genuine Go gap surfaces,
    record it as a risk in the implementation notes; do not silently fix it. Consequently do NOT add a `go test -race` command
    to verify.commands.
  - Do NOT change any function signature, function body, control flow or logic in crates/hexcell/src/respaldo.rs. That file
    is limited to MODULE DOC COMMENT edits correcting the now-false "# Sin disparador de producción" block (lines 21-31).
    The four-store machinery, its fail-closed semantics and its round-id threading are reused as-is, never reimplemented,
    never wrapped in a second copy inside the new module.
  - Do NOT add any third-party dependency, and do NOT add a CLI argument library (clap, structopt, pico-args or any other).
    Argument parsing is a manual `while i < argumentos.len()` loop supporting `--directorio X` and `--directorio=X`, copied
    in shape from emparejar.rs:161-196. Cargo.toml and Cargo.lock must not change.
  - Do NOT read the destination directory from an environment variable, and do NOT add any constant, field or parsing branch
    to crates/hexcell/src/configuracion.rs. The destination comes only from a REQUIRED --directorio argument, which must be
    an ABSOLUTE path (the sidecar resolves that same path in its own process, and under stage A-6 in its own container). HEXCELL_RUTA_RESPALDOS
    belongs to the lab shell script only; the binary never reads it.
  - Do NOT invent per-store exit codes. Exit status is binary, ExitCode::SUCCESS only on complete four-store success and ExitCode::FAILURE
    otherwise, exactly like emparejar; the Spanish MESSAGE names which store failed.
  - 'Do NOT change the IPC protocol in any way: no new message type, no new field, no wire-version change. docs/protocolo-ipc-nucleo-sidecar.md
    stays at v1.3 / wire 4 with its 11 closed message types, and the existing orden_respaldo_sqlstore / acuse_respaldo_sqlstore
    round-id semantics are used exactly as they are.'
  - Do NOT reverse the orchestration order. The sqlstore order over IPC runs FIRST and the three local copies second, after
    a pre-check of ALL FOUR destinations via hexcell_storage::verificar_destino_disponible. This is what makes a discipline
    violation leave an EMPTY destination instead of a three-of-four directory that looks complete. Do not delete already-verified
    copies as a cleanup step, and do not add a completion-manifest file.
  - Do NOT re-verify the sqlstore copy from the Rust side (no reopening the copied file, no integrity_check, no size probe
    beyond what the acuse reports). The sidecar verifies its own copy and removes it when unverified; the acuse is the verification.
  - Do NOT add any probe, port check or process scan that tries to detect whether the cell's nucleo is running. The discipline
    is enforced by fail-closed behavior and stated in the output and docs, not by a runtime guard.
  - 'Do NOT alter the behavior of the normal cell mode or the emparejar mode. The main.rs change is the new dispatch arm plus
    a module doc paragraph; the new arm sits BEFORE Configuracion::desde_entorno so a backup run never demands the full cell
    configuration. Do not touch emparejar.rs: reuse its existing pub esperar_conexion_activa rather than editing or duplicating
    it.'
  - 'Do NOT refactor the test harness. Define the FakeSidecar inside the new crates/hexcell/tests/respaldo_cli.rs, following
    the existing per-file duplication precedent; do not move it into tests/comun/mod.rs and do not edit tests/respaldo_sqlstore_ipc.rs
    or tests/emparejamiento_ipc.rs. Do not use comun::lanzar_binario_con_variables for the real-binary case: it blocks waiting
    for a `salud_vinculada` line that a short-lived respaldar run never emits.'
  - 'Do NOT delete, weaken or silently reinterpret any existing test. Tests must DISCRIMINATE (LES-036): the real-binary case
    must fail if the main.rs dispatch arm is removed, and the fail-closed case must fail if the sqlstore-first ordering or
    the four-destination pre-check is removed. Do not fabricate a green test claiming a backup against a real channel succeeded;
    the e2e rehearsal runs live with the human after this merges.'
  - Do NOT rewrite, renumber or supersede any ADR, and do NOT create a new one. adr-0020-respaldo-y-restauracion-por-celula.md
    keeps its text verbatim even though its "ningún disparador de producción" scope note (lines 61-66, 97-99) is now partially
    stale; the staleness is recorded in docs/STATUS.md and flagged for the human. docs/adr/README.md numbering is a source
    of truth and stays untouched.
  - Do NOT delete or rewrite any existing docs/STATUS.md entry. Update the "Disparador de producción del respaldo por célula"
    Pendiente entry (lines 406-410) IN PLACE with the established "; actualizado el 2026-08-19 por HEX-029" convention (the
    precedent is line 500), and append exactly one new Definido entry dated 2026-08-19 traced to task 18 of stage A-3, mirroring
    the HEX-024 entry's shape at line 375.
  - 'Do NOT edit or renumber any existing bitácora entry. Append D-22 and D-23 after D-21 in the file''s existing four-field
    format, add their rows to the index table, and update the "Última actualización" header line. Neither entry may state
    or imply that D-20 is reopened: D-20 discarded a PERIODIC SCHEDULER inside the cell process, and this task adds no scheduler
    and no timer.'
  - 'Do NOT weaken or restructure the existing restore procedure in docs/runbook-restauracion-de-celula.md. The change is
    additive: a backup-production section with the exact invocation, the pause-first discipline, the requirement that the
    sidecar keeps running, and the fresh-directory rule.'
  - Do NOT write any user-visible content (Rust doc comments, printed lines, error text, shell script comments, docs prose,
    commit message) in English; keep it in Spanish. Only this contract's and the blueprint's own YAML prose stays in English.
    Use absolute dates (2026-08-19), never relative ones.
  - Do NOT print or log any phone number, JID or other transport identifier, and do NOT put one in a backup file name or a
    directory name (adr-0010). Do NOT introduce mass-sending-provider vocabulary (jitter, calentamiento/warm-up, proxies,
    VPN, IP rotation), and never write or imply that Fase B replaces, retires or closes the sidecar channel.
  - Do NOT commit any .db, .db-wal or .db-shm file, any .env file, or any backup directory produced while testing by hand.
