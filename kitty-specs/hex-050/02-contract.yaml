      max_diff_lines: 180
    - glob: "crates/hexcell-core/src/lib.rs"
      max_diff_lines: 15
    - glob: "crates/hexcell-core/tests/fragmentacion.rs"
      max_diff_lines: 420

execution:
  mode: worktree_edit
  branch: ai/HEX-050

retry_policy:
  max_attempts: 2
  escalate_after: 2
