task_id: HEX-019-a
summary: >-
  Outbound discipline gate in sidecar/internal/outbox: latency floor, attention window, volume
  ramp, composing indicator, and the drain-interval config debt (adr-0015 measures 1, 2, 7).
goal: >-
  Implement the outbound gate inside sidecar/internal/outbox, consulted in intentarUno
  immediately before Transmitir: a minimum-latency floor measured from
  marca_temporal_origen_ms, an attention-window schedule with an anti-24/7 startup rejection, a
  volume ramp with a persisted daily counter, and a best-effort composing indicator emitted only
  when the sole deferral reason is the latency floor. Also absorbs the previously hardcoded
  intervaloDrenajeSalida in main.go into a configured, bounded parameter. Every parameter is
  per-cell configurable through sidecar/internal/configuracion, ships the human-ratified
  defaults, and none is expressible as disabled. No IPC wire change.

