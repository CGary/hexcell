forbid:
  files:
    - crates/hexcell-canal-contrato/src/banco.rs
    - crates/hexcell-canal-contrato/src/bateria.rs
    - crates/hexcell-core/src/canal.rs
    - crates/hexcell-canal-simulado/src/adaptador.rs
    - crates/hexcell-storage/src/respaldo.rs
    - crates/hexcell-storage/migraciones/identidad/0001-esquema-inicial.sql
    - Cargo.toml
    - Cargo.lock
    - sidecar/go.mod
    - sidecar/go.sum
    - sidecar/internal/ipc/mensajes.go
    - sidecar/internal/outbox/transmisor.go
    - sidecar/internal/outbox/portero.go
    - sidecar/internal/outbox/portero_test.go
    - sidecar/internal/outbox/centinela_rutas_de_envio_test.go
    - sidecar/internal/identidad/identidad.go
    - sidecar/internal/identidad/baja.go
    - sidecar/internal/identidad/cortacircuitos.go
    - sidecar/internal/identidad/presentacion.go
    - sidecar/internal/canal/canal.go
    - sidecar/internal/canal/disciplina.go
    - sidecar/internal/canal/traduccion.go
    - docs/STATUS.md
  behaviors:
    - "Do NOT make disabling any of this child's measures (latency floor, attention window, volume ramp, drain interval) expressible in configuration. Disciplina and its nested VentanaDeAtencion and RampaDeVolumen contain no field of boolean kind, verified by a reflection test. Every numeric or window parameter is validated against a documented bounded range excluding both degenerate ends: zero, negative or empty is rejected on the low side, and an explicit ceiling (including the anti-24/7 rule: a window whose closing minus opening exceeds 16 hours) is rejected on the high side. A parameter that only checks the lower bound is an incomplete implementation of this rule, not a style nit."
    - "Do NOT invent, alter, or re-mark as pending any of the human-ratified default values. Latency floor is 3000 ms, drain interval is 2000 ms, the attention window is 09:00-19:00 on ISO weekdays 1-5 in zone America/Argentina/Buenos_Aires, and the ramp is 20 messages/day initial, +20/day per week, for 4 weeks, then a permanent ceiling. These were ratified by the human on 2026-08-11 (see .ai/tasks/active/HEX-019-new-spec/07-trace.json, topics defaults_numericos and anti_24x7) and are inherited as given; ship each as the declared default with a PENDIENTE DE CALIBRACIÓN comment in the existing retroceso/TTL style, since the numeric literal is settled but field calibration may still move it later. Do not write 'PENDING RATIFICATION' anywhere for these five values."
    - "Do NOT bump the IPC protocol version, the wire version, or the closed set of eleven message types. Nothing in this task crosses the wire: the composing indicator is a whatsmeow side effect with no IPC carrier, and the discipline gate only changes when an already-queued row is allowed to transmit. Only section 2 of docs/protocolo-ipc-nucleo-sidecar.md changes, to document the nine new environment variables. If you conclude a wire change is genuinely unavoidable, STOP and report it as a human-blocking question instead of designing it."
    - "Do NOT let a discipline deferral consume a retry. A row held back by the latency floor, the closed attention window, or the exhausted daily ramp must return from intentarUno without calling registrarFallo, so its attempt counter does not move. Counting a deferral as a failed attempt would exhaust and destroy a message after three drain ticks; this is the single most likely subtle bug in this task and must have its own test."
    - "Do NOT exempt held rows from the TTL and do NOT add a second queue, a quarantine table, or a deferred-delivery schedule. The absolute TTL keeps winning: a row held past it is hard-discarded by the existing descartarExpiradas with its existing outbox.salida_expirada event. This is deliberate damage limitation and matches discard D-13 (status 'a determinar', not reopened by this task). Document it; do not fix it."
    - "Do NOT introduce randomness anywhere. Discard log entry D-08 is marked 'no reabrir' and explicitly fences off jitter and warm-up protocols. The latency floor is a deterministic fixed minimum, never a randomized delay. The volume ramp is a plain daily ceiling that grows on a fixed weekly step, never a warm-up schedule."
    - "Do NOT introduce mass-sending vocabulary in code, comments, identifiers, environment variable names, log event names, tests, or documentation. No jitter, no calentamiento or warm-up, no proxy, no VPN, no IP rotation, no throughput, no traffic shaping. 'Rampa de volumen' is the plan's own term and is framed strictly as damage limitation per adr-0015, never as evasion or throughput management."
    - "Do NOT keep the daily send counter or the latency/window/ramp configuration state in memory across a restart. RegistrarEnvioDelDia's exactly-claimed-once property rests on an atomic UPSERT decided by RowsAffected, exactly as MarcarEnviado and ReclamarConfirmacionDeBaja already do. A mutex, a cache, a package-level map, or a read-then-write check loses the guarantee across a restart and is an automatic reject. The one deliberate exception, which must be justified in a code comment, is the per-row 'composing already announced' in-memory marker: presence is best-effort and unverifiable, so re-announcing after a restart is harmless."
    - "Do NOT change the schema of an existing table and do NOT write an imperative migration. The one new table (volumen_diario, in the outbox esquema constant) is added with CREATE TABLE IF NOT EXISTS so an existing outbox.db gains it on open with its rows untouched. Do NOT add or alter a column in outbox or cola_salida."
    - "Do NOT hardcode any discipline value outside sidecar/internal/configuracion. A literal latency, hour, weekday, zone, or ramp number anywhere in outbox or main is a contract violation even when a configuration path also exists. The one permitted pattern is the existing one: outbox may re-export a configuracion constant by reference (as outbox.TtlPorOmision already does), never by repeating the literal."
    - "Do NOT document the composing indicator as a defense. It carries the adr-0015 mark [precautorio] and the verbatim caveat that emitting it is documented zero-cost hygiene and not a defense, together with its limitations: delivery is unobservable, a nil return proves only that the node was written, and chat presence depends on the client having a push name and an announced availability. The latency floor and attention window are [causa documentada]; the composing indicator and the volume ramp are [precautorio]. Match adr-0015's own classification exactly."
    - "Do NOT weaken, disable, skip, delete, or otherwise touch the send-path sentinel in sidecar/internal/outbox/centinela_rutas_de_envio_test.go. SendChatPresence is already a watched name and internal/outbox is already exempted from its directory walk, so this child's presence emitter needs no sentinel change; the group/broadcast/status extension is child HEX-019-c's scope. If your implementation seems to need a sentinel change, STOP: that is a sign the presence emitter is not living inside internal/outbox as designed."
    - "Do NOT add a third-party dependency to the Go module, and do NOT touch anything under crates/. The only new import beyond the standard library is the standard library's own time/tzdata, imported for its side effect so time.LoadLocation resolves inside a minimal container image."
    - "Do NOT leave dead wiring. DisciplinaDeSalida and EmisorDePresencia must be constructed and injected in main.go with real non-test callers, and the configured drain interval must replace the hardcoded intervaloDrenajeSalida constant. Scaffolding without an engine, an interface with no implementation, and placeholder assignments of the form _ = variable all fail review."
    - "Do NOT forget the pre-existing consumer migration. NuevaColaDeSalida has existing call sites across salida_test.go and main.go; a test whose name enumerates its collaborator count must be renamed rather than left stale if the discipline gate is added as a new constructor parameter. Leaving any call site stale is a build failure, not a style issue."
    - "Do NOT implement the portero/circuit-breaker seam (child HEX-019-b), the presentation/one-message-per-turn seam or the sentinel's group/broadcast/status extension (child HEX-019-c), the lab-number verifications, the reconnection/pairing runbooks, the sqlstore backup over IPC, any Fase B or Cloud API work, or the hard portfolio ceiling and incident-rate threshold of adr-0015 Layer 3. Whether the indicator is actually rendered on the recipient's device and whether the ramp changes anything on Meta's side are explicitly deferred and must be recorded as such, not stubbed or faked."
    - "Do NOT touch docs/STATUS.md. Its open discipline entry is closed by child HEX-019-c, the last child to complete the full seven-measure set, per 00-spec.yaml non_goals."
    - "Do NOT reorder, renumber, or rewrite an existing ADR or discard-log entry, and do NOT add a new one in this task. All identifiers, comments, documentation, and the commit message are written in Spanish; artifact YAML prose stays in English; every date written into code or documentation is absolute (2026-08-11), never relative."

verify:
  commands:
    - cargo fmt --check
    - cargo build --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    - test "$(cargo tree -p hexcell-core | wc -l)" = "1"
    - cargo test -p hexcell-core --doc 2>&1 | grep -q "compile fail"
    - cd sidecar && test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test ./...

acceptance:
  human_gate: true

limits:
  max_files_changed: 12
  # Honest sizing runs above the parent's "about 11 files / 1250 lines" estimate once
  # docs/protocolo-ipc-nucleo-sidecar.md counts as a 12th file and the 9 new env vars (2 scalar +
  # 4 window + 3 ramp) get the same bounded-range validation rigor as the existing
  # retroceso/TTL parameters. Point estimate ~1400 lines; set with headroom up front rather than
  # forcing a tight cap, following the precedent of HEX-018's post-review amendment (1250 -> 1350).
  # ENMIENDA DEL ORQUESTADOR (2026-08-11), en dos rondas adjudicadas por la revisión profunda:
  # 1400 -> 1550 (entrega del delegado: código necesario mal estimado por el blueprint, con el
  # inflado real recortado en la ronda de arreglos) y 1550 -> 1600 (arreglos mandados por la
  # propia revisión: rutas fail-closed con eventos de registro, contador diario en la zona de
  # la ventana, poda de presencias con su test, marcas D-13/anti-baneo, método encadenado
  # ConDisciplina impuesto por los llamadores protegidos). Precedente PAT-022 aplicado solo a
  # la segunda ronda. Cada línea del exceso traza a un fix_task; el revisor confirmó que no
  # queda inflado recortable. Eventos contract_amendment en 07-trace.json.
  max_diff_lines: 1600
  per_class:
    - glob: "sidecar/internal/*/*_test.go"
      max_diff_lines: 800
    # ENMIENDA DEL ORQUESTADOR (2026-08-11): 190 -> 260 -> 285. El dedup pedido resultó
    # neutro en líneas (283 -> 282): el archivo es irreducible en el estilo declarativo del
    # repo (9 variables x nombre+doc+default+techo); estimación del blueprint corregida.
    - glob: sidecar/internal/configuracion/configuracion.go
      max_diff_lines: 285
    # ENMIENDA DEL ORQUESTADOR (2026-08-11): 180 -> 215 -> 245 por los arreglos de la
    # revisión (fail-closed de la rampa + D-13 + lectura del día en la zona de la ventana).
    - glob: sidecar/internal/outbox/disciplina.go
      max_diff_lines: 245
    # ENMIENDA DEL ORQUESTADOR (2026-08-11): 55 -> 60 -> 82 — realineación de gofmt más
    # poda de presencias y rama nil-legal explícita mandadas por la revisión.
    - glob: sidecar/internal/outbox/salida.go
      max_diff_lines: 82
    - glob: sidecar/internal/outbox/outbox.go
      max_diff_lines: 20
    - glob: sidecar/internal/outbox/presencia.go
      max_diff_lines: 95
    - glob: sidecar/main.go
      max_diff_lines: 35
    - glob: docs/protocolo-ipc-nucleo-sidecar.md
      max_diff_lines: 50

execution:
