forbid:
  files:
  - .ai/tasks/active/HEX-032-new-spec/00-spec.yaml
  - docs/adr/adr-0010-puerto-de-canal.md
  - docs/adr/adr-0011-whatsmeow-sidecar-e-ipc.md
  - docs/adr/adr-0020-respaldo-y-restauracion-por-celula.md
  - sidecar/internal/identidad/identidad.go
  - sidecar/internal/identidad/baja.go
  - sidecar/internal/identidad/cortacircuitos.go
  - sidecar/internal/identidad/presentacion.go
  - go.mod
  - go.sum
  - Cargo.lock
  behaviors:
  - Do NOT alter the shape of the existing orden_respaldo_sqlstore / acuse_respaldo_sqlstore messages (their exact fields,
    order, or semantics); the identidad backup is a NEW message pair, and adr-0022 EXTENDS (never rewrites) contrato-ipc-respaldo-del-sqlstore.md
    and adr-0020.
  - 'Do NOT let a second or external process copy identidad.db: the SIDECAR must produce the copy via VACUUM INTO on its own
    dedicated read-only connection (LES-031, D-15, D-19, D-22); the nucleo never opens identidad.db, not even read-only.'
  - Do NOT leave an unverified file under the canonical name identidad.db on failure; a per-store failure removes any partial
    copy and returns a non-zero result naming the store (fail-closed, PAT-038).
  - 'Do NOT break wire-version lockstep: bump BOTH Rust VERSION_PROTOCOLO and Go VersionProtocolo 4->5 together; never leave
    the two sides on different versions.'
  - 'Do NOT reorder the fail-empty sequence: ALL IPC-ordered sidecar stores (sqlstore, identidad) are produced BEFORE the
    three local ones, after a pre-check of all FIVE destinations, so a violated pause-first discipline leaves an EMPTY destination.'
  - 'Do NOT reopen or contradict D-15, D-19, D-20, D-22 or D-23: no in-cell scheduler, no concurrent no-pause backup, no rusqlite
    online-backup API, no storing the STOP list in the sqlstore. Record the new discard of option (a) generalization as bitacora
    D-24.'
  - Do NOT put any phone number, JID or device id in backup file names or logs (adr-0010, adr-0019).
  - Do NOT introduce mass-sending vocabulary, nor any text implying Fase B replaces or retires the sidecar.
  - Do NOT rewrite any existing ADR or reuse an ADR number; the new ADR is adr-0022 (current max is adr-0021).
  - Do NOT add third-party dependencies or bump the pinned whatsmeow commit.
  - 'Do NOT weaken tests to pass: a test MUST fail if identidad.db is dropped from the backup set or a protocol field is mistyped
    (LES-033, LES-036). Deferred live-channel checks stay as documented sentinels, never faked.'
  - All user-visible text in Spanish; artifact YAML prose in English; absolute dates (2026-08-20).
verify:
  commands:
  - cargo fmt --check
  - cargo build --workspace
  - cargo clippy --workspace -- -D warnings
  - cargo test --workspace
  - test "$(cargo tree -p hexcell-core | wc -l)" = "1"
  - cargo test -p hexcell-core --doc 2>&1 | grep -q "compile fail"
  - cd sidecar && test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test ./...
  - cd sidecar && go test -race ./internal/ipc/... ./internal/canal/... ./internal/servidor/... ./internal/identidad/...
