task_id: HEX-032
summary: Back up the sidecar identidad.db (STOP list) as the fifth cell store via a new IPC message pair (wire 4->5, adr-0022);
  the sidecar produces its own VACUUM INTO copy.
goal: 'Close lab finding 12 (safety/PRIORITY): the cell backup covers four stores but the sidecar Go identity store identidad.db
  (STOP/baja list, conversation-id mapping, circuit-breaker state) is not backed up, so a restore revives opted-out contacts.
  Add identidad.db to the backup with the same integrity discipline as the sqlstore - the SIDECAR produces the verified copy
  (VACUUM INTO on a dedicated read-only connection), never a second process copying the live WAL file - via a NEW dedicated
  IPC message pair orden_respaldo_identidad / acuse_respaldo_identidad. This adds two message types to the CLOSED protocol,
  so the wire version bumps 4->5 on both Rust and Go in lockstep and a new adr-0022 records the evolution and extends (never
  rewrites) docs/contrato-ipc-respaldo-del-sqlstore.md and adr-0020. The respaldar operator mode produces five verified copies
  with the fail-empty ordering (both IPC stores before the three local ones), the restore runbook lists identidad.db, and
  the finding-12 STATUS entry moves to resolved dated 2026-08-20 without erasing the lab-finding record.'
