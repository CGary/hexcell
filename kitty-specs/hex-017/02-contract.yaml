forbid:
  files:
    - crates/hexcell-canal-contrato/src/banco.rs
    - crates/hexcell-canal-contrato/src/bateria.rs
    - crates/hexcell-core/src/canal.rs
    - crates/hexcell-canal-simulado/src/adaptador.rs
    - crates/hexcell/src/motor.rs
    - crates/hexcell/src/procesador.rs
    - sidecar/internal/canal/canal.go
    - sidecar/internal/canal/traduccion.go
  behaviors:
    - "Do NOT change the shape of the ChannelAdapter port. MensajeSaliente, TestigoDeEntrante, ResultadoEnvio and the trait signatures stay exactly as they are. Widening them to carry the origin timestamp would cascade into crates/hexcell-canal-contrato/src/banco.rs, which the spec forbids touching; take the anchor from adapter-held state fed by the inbound read loop instead."
    - "Do NOT weaken, disable, skip or delete the send-path sentinel in sidecar/internal/outbox/centinela_rutas_de_envio_test.go. Extend its watch list or its directory exemption only, per the contract stated in its own header comment. Its empty-corpus guard and its synthetic self-test must both keep failing on a real regression, and each newly watched name needs a synthetic case proving it is caught."
    - "Do NOT introduce a dead-letter queue, a quarantine table, a startup recovery query, or any other mechanism that re-enqueues pending or expired outbound messages when the sidecar starts. Absence of that mechanism is a requirement, not an omission."
    - "Do NOT measure TTL from enqueue time, from process start, from the last retry, or from any clock reading taken at insertion. The only anchor is the stored absolute origin timestamp of the inbound event, so the expiry verdict is identical before and after a restart."
    - "Do NOT introduce traffic shaping in code, comments, configuration names, log event names or documentation. No jitter, no warm-up ramp, no volume schedule, no proxy or IP rotation. Retries are error-driven recovery bounded by a failure ceiling, per D-08 of the discard log and adr-0011 item 6."
    - "Do NOT leave any part of the HEX-015 bridge in the send path: the outbound in-memory buffer, the exposed accepted-sends counter and the provisional bridge log line must all be gone. When no IPC connection is established, send returns an error rather than accepting the message into memory."
    - "Do NOT rewrite, renumber or reorder sections 1 to 8 of docs/protocolo-ipc-nucleo-sidecar.md. Extend them in place: add the correspondence row, the type rows, the new field tables, and update section 9 to stop deferring the outbound direction. Do not repeat the stale claim that the Rust workspace declares serde in no crate."
    - "Do NOT let any whatsmeow transport identifier cross the IPC boundary. The SendResponse Sender JID is never copied into an acknowledgement; only SendResponse.ID travels, as id_correlacion. No new field name may contain jid, telefono, phone, dispositivo, device or numero."
    - "Do NOT hardcode the TTL or the retry bound as hidden constants. Both are documented calibratable parameters read through sidecar/internal/configuracion, with defaults and validation handled the same way the existing backoff parameters are."
    - "This task RE-DEFERS and does NOT close the HEX-015 at-most-once inbound-ack window recorded in adr-0011 item 7, where the inbound acknowledgement fires after an in-memory handoff instead of after a durable core-side record. That window belongs to the inbound direction and closes only when the core gains its own durable consumption of the event; this task owns the outbound direction. Keep the STATUS entry Pendiente with its closure condition unchanged, and do not silently drop it."
    - "Do NOT place any real send call outside the outbox module. The whatsmeow-backed transmitter lives in sidecar/internal/outbox/, and the queue's public entry point is Encolar, so that plan task 13's STOP list can later reject a message before it is enqueued without editing the queue."
    - "Do NOT build the Go IPC socket server in this task. It belongs to plan task 3 and is absent today; verification stays at the wire and library level, with live-channel testing deferred to plan task 15 by the spec's own criterion."
    - "Do NOT add new third-party dependencies to either the Rust workspace or the Go module. Everything needed is already present."
    - "All new identifiers, comments and documentation are written in Spanish, and any date written into an artifact is absolute (2026-08-09), never relative."

