task_id: HEX-017
summary: "Sidecar outbound queue with absolute TTL and idempotent bounded retries, protocol 1.3/wire 4 outbound types and correlated acks, and a Rust adapter forwarding sends over IPC."
goal: >-
  Implement A-3 plan task 12 as the owner of the outbound direction. Add a durable outbound queue
  to the Go sidecar whose absolute TTL is measured from the originating inbound event's timestamp
  and never from enqueue time, with hard discard on expiry carrying its own log event and its own
  counter, bounded and idempotent retries, no dead-letter queue and no re-enqueue at startup.
  Extend the IPC protocol in place from document 1.2 to 1.3 and wire version 3 to 4, adding the
  outbound message type and the sent/delivered/read/failed acknowledgement carrying the whatsmeow
  SendResponse correlation identifier to the closed set of section 6, extending sections 1 to 8
  without rewriting or renumbering them and keeping both ends failing closed on version mismatch.
  Replace the HEX-015 in-memory send bridge in hexcell-canal-whatsmeow with real IPC forwarding.

