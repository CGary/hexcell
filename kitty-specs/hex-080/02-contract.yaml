    - Cargo.lock
    - crates/hexcell-admin/Cargo.toml
    - crates/hexcell-admin/src/argumentos.rs
    - crates/hexcell-admin/src/codigo_de_salida.rs
    - crates/hexcell-admin/src/salida.rs
