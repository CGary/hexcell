acceptance:
    human_gate: true
execution:
    branch: ai/HEX-005
    mode: worktree_edit
forbid:
    behaviors:
        - 'Do not add, remove, rename or edit anything under crates/hexcell-core. That crate is
          closed by HEX-002 and untouched by HEX-004. In particular do NOT add a recv/subscribe
          method to ChannelAdapter, do NOT move the Reloj trait into it, and do NOT put the
          deduplication registry or the FueraDeVentana policy there. Its [dependencies] table stays
          empty; that is AC-12, not a style preference.'
        - 'Do not make the contract battery depend on any concrete adapter. crates/hexcell-canal-contrato
          must not name AdaptadorSimulado, must not depend on hexcell-canal-simulado, and must not
          implement ChannelAdapter for anything. It depends on hexcell-core and on nothing else - no
          tokio, no HTTP crate, no test framework - because it is plain async fn plus assertions,
          awaited by whatever runtime the calling test already runs.'
        - 'Do not solve the battery with dynamic dispatch. ChannelAdapter returns impl Future + Send
          (RPITIT) and is therefore NOT dyn-compatible: Box<dyn ChannelAdapter> does not compile. The
          battery is generic over a harness trait with an associated adapter type.'
        - 'Do not fold the clock-dependent scenarios into the base harness trait. The trait that
          advances time is a separate sub-trait, so an adapter that cannot control its clock still
          implements the base trait and runs every non-temporal scenario.'
        - 'Do not implement the FueraDeVentana policy anywhere except crates/hexcell. Not in
          hexcell-core, not in hexcell-canal-simulado, not in the contract crate. The policy is
          deferral of the reply with a BOUNDED per-conversation queue and a documented drop-oldest
          rule at the cap; escalation to a human is not implemented, because there is no operator
          channel to escalate to until later stages, and that rejection is written down rather than
          left implicit.'
        - 'Do not add a retry loop, a backoff timer, a sleep or a background task for the deferred
          replies. They are re-attempted only when a later event arrives for that same conversation,
          and they are flushed before that new event''s own reply so the thread stays chronological.'
        - 'Do not give the deduplication registry a clock, and do not import Reloj, RelojDePrueba or
          RelojDelSistema into crates/hexcell/src/. The retention window is measured against the
          monotonic maximum marca_temporal supplied by the caller on every call. Production code in
          crates/hexcell must not import a trait from the test-double crate for timekeeping.'
        - 'Do not hardcode the retention window inside the registry and do not leave it as a bare
          literal. Per the human decision of 2026-07-30 the window is a CONSTRUCTOR PARAMETER of
          RegistroDeDeduplicacion whose default is the named Duration constant
          VENTANA_DE_RETENCION_DEDUPLICACION_POR_DEFECTO (one hour), carrying at its declaration the
          explicit justification AC-8 demands about the channel''s expected redelivery horizon and a
          note that the definitive value is still an open product decision. Keep the documented hard
          cap on retained entries so a burst cannot grow the map without bound against NFR-01.'
        - 'Do not restate the one-hour value anywhere outside its single declaration in
          crates/hexcell/src/deduplicacion.rs. crates/hexcell/src/configuracion.rs must IMPORT that
          constant as its fallback, never write 3600 or an equivalent literal of its own; two
          literals for one number is how a default silently drifts from the justification that
          documents it.'
        - 'Do not invent a new configuration mechanism for the window. Follow the HEXCELL_CAPACIDAD_COLA
          precedent already in crates/hexcell/src/configuracion.rs exactly: an OPTIONAL environment
          variable HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS, a ventana_deduplicacion field on
          Configuracion, a ValorInvalido error naming the variable and its expected format when it
          does not parse, and the documented default when it is absent. No config file, no CLI flag,
          no build-time feature.'
        - 'Do not break what HEX-004 closed in crates/hexcell/src/configuracion.rs, which this task
          reopens only for that one addition: no unwrap(), no expect(), no panic, every existing
          variable still parsed and validated, the loopback default preserved, and the failure path
          still terminating before anything is bound.'
        - 'Do not present the one-hour window as a settled figure. docs/STATUS.md gets a Pendiente
          entry dated 2026-07-30 recording that the definitive value is an open product decision, and
          that entry must NOT be written into the Definido section - an open product decision recorded
          as settled is precisely the failure mode the repository''s STATUS discipline exists to
          prevent.'
        - 'Do not invent a behaviour for a redelivery arriving beyond the retention window. The plan''s
          risk table already fixes it: it is processed again as a new event, deliberately, with a log
          line, as an accepted and documented residual limitation. Do not reject it, do not panic, do
          not add a second retention tier.'
        - 'Do not make the re-pairing test vacuous. It must NOT construct two events with the same
          IdConversacion and assert they are equal. The simulated adapter grows the contact-to-
          IdConversacion map that adr-0010 assigns to the adapter, keyed by contact ONLY and never by
          device, and re_emparejar changes the device identifier while leaving that map intact.'
        - 'Do not construct, interpret, parse, split, reverse or derive an IdConversacion anywhere
          under crates/hexcell/src/. IdConversacion::nuevo and IdRemitente::nuevo must not appear in
          that directory. The engine receives the value through the port and uses it as an opaque map
          key (AC-6).'
        - 'Do not break the API HEX-004 left on AdaptadorSimulado. inyectar, forzar (queued per
          conversation), forzar_siguiente (queued undirected, FIFO), forzar_averia (a one-shot
          boolean flag, not a queue) and envios_capturados keep their current names and semantics,
          because crates/hexcell-canal-simulado/tests/adaptador_simulado.rs and
          crates/hexcell/tests/motor.rs depend on them.'
        - 'Do not call SystemTime::now(), Instant::now(), tokio::time::sleep, tokio::time::pause or
          tokio::time::advance in crates/hexcell-canal-simulado/src/adaptador.rs, and do not write
          the literal text SystemTime::now in that file''s comments either - the verify grep is
          textual and cannot tell code from prose. The window is computed only from the injected
          Reloj, and RelojDelSistema in reloj.rs is the single permitted caller.'
        - 'Do not restate the 24 h value as 86400, as 24 * 60 * 60, as 60 * 60 * 24 or as any literal
          Duration, in the simulated adapter or in the contract crate. Import
          DURACION_VENTANA_SERVICIO from hexcell_core::canal.'
        - 'Do not hold a std::sync::Mutex guard across an .await inside the simulated adapter; the
          future returned by send() must stay Send to satisfy the port''s bound, and a guard held
          across an await breaks that with a compile error far from the cause.'
        - 'Do not call unwrap(), expect(), panic!, unreachable! or todo! in crates/hexcell/src/motor.rs,
          crates/hexcell/src/deduplicacion.rs or crates/hexcell/src/conversaciones.rs, and do not add
          a wildcard arm (_ =>) to the match over ResultadoEnvio. That match must keep naming all five
          variants plus Err so a future variant breaks compilation.'
        - 'Do not name whatsmeow, JID, wa_id, Cloud API or Graph API in crates/hexcell/src/motor.rs,
          procesador.rs, deduplicacion.rs or conversaciones.rs, in code or in comments. The retention
          justification must be phrased functionally - a channel that retries an unconfirmed delivery,
          a channel that replays what was pending on reconnect - and any vendor-specific wording goes
          to docs/STATUS.md or to the simulated crate, where those words are legitimate. Note that
          crates/hexcell/src/configuracion.rs already contains Cloud API legitimately and must not be
          edited to remove it.'
        - 'Do not create, renumber, reorder, retitle or edit any file under docs/adr/. This task adds
          no ADR: plan task 6 asks for the decision documentada, not for an ADR, and the policy is
          engine-internal and binds no future adapter. If review later demands one, the number is
          0017 and it comes from the index docs/adr/README.md, which already assigns 0001 to 0016 -
          never from ls docs/adr/, where 0003 to 0007 and 0011 to 0013 are reserved entries with no
          file yet.'
        - 'Do not write anything in docs/STATUS.md that marks etapa A-2 as closed, finished or
          cerrada, and do not rewrite or delete any existing bullet, Definido or Pendiente. Add
          exactly two new Definido entries dated 2026-07-30 and attributed to HEX-005. AC-13 treats
          this file as a tripwire and the stage closes with HEX-008.'
        - 'Do not open, create or reference sessions.db, knowledge_live.db or any SQLite file; do not
          write a schema, a migration, a pool, a SQL statement or a WAL setting. Persistence is
          HEX-006/HEX-007 and everything in this task is in memory, documented as transitional.'
        - 'Do not implement real readiness logic in GET /health/ready, do not add any HTTP route, and
          do not edit crates/hexcell/src/salud.rs at all. Real readiness is plan task 7 / HEX-006.'
        - 'Do not implement SIGTERM handling, graceful shutdown, in-flight drain or SQLite checkpoint.
          That is plan task 12 / HEX-008.'
        - 'Do not add an LLM provider interface, real or simulated, and do not add product logic to
          the processor beyond the existing echo. Those are plan task 11 / HEX-008 and an explicit
          non-goal.'
        - 'Do not add tracing, log, env_logger, serde, serde_json, clap, anyhow, thiserror, rusqlite,
          sqlx, rand, chrono, axum, tiny-http, actix-web, warp, rocket, tide, reqwest or ureq to any
          manifest. Structured logging is plan task 15 (HEX-008); errors stay hand-written enums with
          Display and std::error::Error impls.'
        - 'Do not add hexcell-canal-contrato as a REGULAR dependency of crates/hexcell or of
          crates/hexcell-canal-simulado. It is test scaffolding and belongs under [dev-dependencies]
          only; the cell binary already ships hexcell-canal-simulado and must not also ship the
          battery.'
        - 'Do not enable tokio''s rt-multi-thread feature or change the runtime flavor away from
          current_thread. One cell serves low traffic and a per-cell worker pool is the wrong trade
          on the target hardware (NFR-01).'
        - 'Do not change [workspace.package], [workspace.dependencies] or [profile.release] in the
          root Cargo.toml. The only permitted change there is adding the new crate to members.'
        - 'Do not hand-write, hand-edit or prune Cargo.lock. Let cargo regenerate it and commit it
          verbatim. Its path matches sensitive_path_match in complexity-score, so the calculated risk
          for this task will read high while 00-spec says medium; that divergence is expected, is
          recorded in the blueprint, and is not to be corrected by dropping the new crate.'
        - 'Do not reach any network from tests. Only 127.0.0.1 loopback sockets bound by the test
          itself are allowed, and no test may sleep to make a temporal assertion pass.'
        - 'Do not leave the literal 8081, or any other fixed port, as the basis of an assertion in
          crates/hexcell/tests/configuracion.rs. The free port is obtained by binding 127.0.0.1:0 and
          dropping the listener, and the residual race is documented in a comment rather than hidden.'
        - 'Do not state or imply anywhere that Fase B replaces, substitutes or closes Fase A, or that
          the sidecar is retired or transitional. The own channel is the default and permanent
          channel and the sidecar is its permanent cost.'
        - 'Do not weaken the FR-12 distinction in prose: the TYPE admits the restrictive outcome, the
          POLICY of each adapter decides whether it produces it. The battery exercising a 24 h window
          against the simulated adapter must never be written as evidence that the own-channel
          adapter should impose one.'
        - 'Do not write repository prose, doc comments, error messages or commit messages in English.
          Rust identifiers, crate names and existing English identifiers stay in idiomatic English;
          the language rule governs prose, not identifiers. Markdown prose and long comments keep the
          repository''s ~100 column width.'
        - 'Do not add Co-Authored-By or any AI-attribution trailer to any commit message. Conventional
          commits in Spanish only.'
        - 'Do not write a relative date anywhere. Every date is absolute (2026-07-30).'
        - 'Do not commit any *.db, *.db-wal, *.db-shm or .env* file, and do not hardcode any secret,
          token, API key or credential in source, manifests or test fixtures - not even as an example
          value in documentation.'
