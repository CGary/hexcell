goal: |
    Turn A-2 plan tasks 5, 6, 9 and 10 into Rust code on top of what HEX-004 left on main, plus the
    AC-10 fix to an existing test. Four pieces land. First, a REUSABLE contract battery for the
    ChannelAdapter port, in a new dependency-light crate crates/hexcell-canal-contrato that names no
    concrete adapter: because the port is RPITIT and therefore not dyn-compatible, the battery is a
    set of generic async fn parameterised over a harness trait, with the clock-dependent scenarios
    split into a separate sub-trait so an adapter that cannot control time still runs the rest. It is
    exercised here from crates/hexcell-canal-simulado/tests/, that is, from outside the crate that
    defines it, which is exactly how etapa B-1 will reuse it against the Cloud API adapter. Second,
    the core's policy on FueraDeVentana: the engine defers the reply in a bounded per-conversation
    queue and re-sends it when the client writes again, before that new event's own reply; escalation
    to a human is explicitly rejected for now because there is no operator channel to escalate to.
    Third, thread continuity across a re-pairing: the simulated adapter grows the contact-to-
    conversation identity store that adr-0010 assigns to the adapter, keyed by contact and never by
    device, and the engine grows the in-memory per-conversation history needed to observe that the
    thread survives - both documented as transitional and replaced by sessions.db in HEX-006. Fourth,
    delivery idempotency: an in-memory registry of already-seen deduplication identifiers with a
    named retention constant of one hour, justified at its declaration against the channel's expected
    redelivery horizon and capped in size, whose behaviour for a late redelivery is the one the plan
    already fixed - processed again, deliberately and documented. Finally
    el_binario_no_vincula_nada_si_la_configuracion_es_invalida stops assuming port 8081 is free. No
    SQLite, no SIGTERM, no readiness logic, no LLM provider, no ADR, and hexcell-core is not touched
    at all.
