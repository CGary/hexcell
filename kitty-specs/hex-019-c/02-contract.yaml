    - docs/adr/adr-0015-politica-de-convivencia-con-el-baneo.md
    - docs/bitacora-de-descartes.md
  behaviors:
    - "Do NOT relocate, weaken, skip, or otherwise touch the opt-out/STOP check (ControlDeBaja.EnvioPermitido) or the circuit breaker check (ControlDeCortacircuitos.SalidaPermitida) inside outbox/portero.go's Admitir. AdmitirMensajeDePresentacion must reclaim the presentation claim first and then call the unmodified Admitir (never cola.Encolar directly) so both untouched checks still gate the presentation message ahead of it, structurally enforcing baja > traspaso > presentacion at the admission seam."
    - "Do NOT let a claimed presentation message bypass the baja or cortacircuitos checks. Cover with tests: an opted-out contact whose presentation claim is won still receives no presentation (Admitir rejects it); a contact whose breaker already tripped and whose presentation claim is won still receives no presentation. The single-claim itself is not undone by either rejection (matches AdmitirMensajeDeTraspaso's existing behavior of consuming the claim even when the wrapped Admitir subsequently fails)."
    - "Do NOT keep the first-turn presentation claim in memory. It persists in the new identidad-owned presentacion_de_conversacion table via the same RowsAffected-decided atomic-claim pattern RegistrarBaja and ReclamarMensajeDeTraspaso already use, so it survives a process restart. On a read/write error against this state (in ReclamarPresentacion or in PorteroDeSalida's presentation check), fail CLOSED: never enqueue the candidate message, log a dedicated event, and increment a dedicated counter (LES-2026-08-11-000000025/26)."
    - "Do NOT send more than one presentation message per conversation. The single-claim contention test (mirroring TestPorteroDeSalida_AdmitirMensajeDeTraspaso's existing shape) is mandatory: a second AdmitirMensajeDePresentacion call for an already-claimed id_interno must not enqueue a second row, and this must hold across a store close/reopen."
    - "Do NOT introduce randomness anywhere in template selection (D-08 forbids it structurally, not just as a style preference). SelectorDePlantilla.Elegir must be a pure, deterministic function of id_interno only -- same input always yields the same variant, with no clock, counter, or math/rand involved."
    - "Do NOT invent or alter the ratified identification text. Use the exact literal from .ai/tasks/active/HEX-019-new-spec/07-trace.json's human_ruling event (topic textos): 'Te atiende un asistente automático. Si preferís hablar con una persona, escribí «humano».', guillemets included -- this is the canonical source over 00-spec.yaml's AC-1 statement, which renders the same text with plain quotes as a YAML-nesting artifact, not a second ratified value. Do NOT write 'PENDING RATIFICATION' for this text."
    - "For the three presentation variant texts, ship 01-blueprint.yaml's documented default ('¡Hola! Gracias por escribir.' / 'Hola, ¿en qué te puedo ayudar?' / 'Buenas, gracias por tu mensaje.') as the declared default per 00-spec.yaml constraint 4, since 07-trace.json ratifies only their structure (three, neutral, deterministic selection) and not their literal content. Record this as an open point for the reviewer in 04-implementation-log.yaml rather than silently treating it as fully closed."
    - "Do NOT make HEXCELL_TEXTO_IDENTIFICACION or HEXCELL_PLANTILLAS_PRESENTACION expressible as disabling the measure. The identification text is rejected when present-but-empty-or-whitespace-only; the variant list is rejected when it resolves to fewer than 2 non-empty elements; configuracion.Presentacion carries no boolean field. Cover the boundary rejections and the no-boolean-field property with tests, not just the happy path."
    - "Do NOT reuse a plain comma as HEXCELL_PLANTILLAS_PRESENTACION's element separator if the shipped default variants contain literal commas as ordinary punctuation (e.g. 'Hola, ¿en qué te puedo ayudar?'); use ';' instead, documented inline as a deliberate deviation from the PalabrasDeBaja/CortacircuitosPalabrasFrustracion comma convention, not an oversight."
    - "Do NOT bump the IPC protocol version, the wire version, or the closed set of eleven message types, and do NOT touch sidecar/internal/ipc/mensajes.go. Nothing in this task crosses the wire. Only section 2 of docs/protocolo-ipc-nucleo-sidecar.md changes, to document the two new environment variables."
    - "Do NOT change the schema of an existing table (identidad, direccion, baja_de_contacto, cortacircuitos, cola_salida, outbox, volumen_diario) and do NOT write an imperative migration. The one new table (presentacion_de_conversacion, in identidad.go's esquema constant) is added with CREATE TABLE IF NOT EXISTS so an existing identidad.db gains it on open with its other tables and rows untouched."
    - "Do NOT skip the HEX-019-b review residual. The pre-existing baja discard block in outbox/salida.go's intentarUno (the ContadorDescartadasPorBaja.Add(filas) path) must call c.liberarPresencia(p.idMensaje), mirroring the cortacircuitos discard block a few lines below it that already does. Add a test proving PresenciasPendientesParaPruebas drops after a deferred-then-baja-discarded row. This is the only required touch to salida.go's disciplina-gate logic (owned by HEX-019-a/b); do not use it as license to touch anything else there."
    - "Do NOT claim the group/broadcast/status sentinel extension covers a real distinct whatsmeow primitive unless it is verified against the actual whatsmeow API surface (go.mau.fi/whatsmeow, pinned version in sidecar/go.mod). If, as the blueprint's investigation found, no such distinct primitive exists (every destination sends through the already-watched SendMessage), the extension is defensive (future-proofing against a helper or SDK rename) and the code/test comments must say so plainly -- do not write documentation implying the current SDK exposes SendGroupMessage/SendBroadcastMessage/SendStatusMessage today. Add, alongside the sentinel extension, a real structural test that identidad.Almacen.DireccionDe's direccion table CHECK constraint (tipo IN ('pn','lid')) excludes group/broadcast/status JIDs from ever reaching TransmisorWhatsmeow."
    - "Do NOT weaken the send-path sentinel's empty-corpus guard or remove an existing watched name. Extend esRutaDeEnvioVigilada's switch with the new names and update the existing exact-count assertions (TestCentinelaDetectaUnaRutaDeEnvioSintetica et al.) deliberately to reflect the larger corpus, with one new synthetic self-test per newly watched name."
    - "Do NOT introduce mass-sending vocabulary in code, comments, identifiers, environment variable names, log event names, tests, or documentation. No jitter, no calentamiento or warm-up, no proxy, no VPN, no IP rotation, no throughput, no traffic shaping. Frame identification/handoff, template variation, and one-message-per-turn per adr-0015's own [causa documentada] classification (items 6, 8, 9), matching that mark verbatim in the code/doc comments introduced by this task."
    - "Do NOT add a third-party dependency to the Go module and do NOT touch anything under crates/. No new import beyond the standard library and the packages already imported by the touched files."
    - "Do NOT leave dead wiring. NuevoPorteroDeSalida and NuevoTraductor both gain one new parameter; every call site (main.go and every test constructing either type) must be migrated, not left to fail the build or to pass nil where a real collaborator now exists in production wiring. ControlDePresentacion and GeneradorDePresentacion must have real non-test callers in main.go."
    - "Do NOT leave docs/STATUS.md's 'Política anti-ban no desactivable por configuración' entry silently as-is. Update it to record closure dated 2026-08-11, reflecting all seven adr-0015 Layer-1 measures now implemented across HEX-019-a/b/c."
    - "Do NOT close this task's review without an explicit statement of whether any residual remains in the HEX-019 a/b/c chain (00-spec.yaml constraint 27, PAT-2026-08-11-000000027); the parent cannot close with an undeclared residual. This is the last child."
    - "Do NOT touch the hard portfolio cap or incident-rate threshold (adr-0015 Layer 3, pending business decisions), and do NOT implement any new re-subscription/opt-in flow beyond the existing STOP mechanism."
    - "Do NOT reorder, renumber, or rewrite an existing ADR or discard-log entry, and do NOT add a new one in this task. All identifiers, comments, documentation, and the commit message are written in Spanish; artifact YAML prose stays in English; every date written into code or documentation is absolute (2026-08-11), never relative."

