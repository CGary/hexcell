    - glob: sidecar/internal/identidad/identidad.go
      max_diff_lines: 35
    - glob: sidecar/internal/identidad/presentacion.go
      max_diff_lines: 110
    - glob: sidecar/internal/outbox/portero.go
      max_diff_lines: 90
    - glob: sidecar/internal/outbox/salida.go
      max_diff_lines: 40
    - glob: sidecar/internal/canal/traduccion.go
      max_diff_lines: 210
    - glob: sidecar/internal/configuracion/configuracion.go
      max_diff_lines: 150
    - glob: sidecar/main.go
      max_diff_lines: 25
    - glob: docs/protocolo-ipc-nucleo-sidecar.md
      max_diff_lines: 15
    - glob: docs/STATUS.md
