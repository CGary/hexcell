  # 01-blueprint.yaml's strategy touches 16 files (identidad: 3 incl. 1 new; outbox: 4; canal: 3;
  # configuracion: 2; main.go: 1; docs: 2; not counted as new: 1) against the parent decomposition's
  # rough ~10-file estimate for child C -- the same undercount pattern HEX-019-a and HEX-019-b both
  # showed (the parent's rough count did not itemize the identidad schema addition, the AC-6
  # residual's own test, or the doc files). Honest line estimate: identidad ~185 (schema+new file+
  # test), outbox ~350 (portero+tests, salida residual+test, sentinel extension), canal ~300
  # (selector/composer/generator+wiring+tests), configuracion ~205 (struct+loader+tests), main.go
  # ~12, docs ~19. Total ~1070. Setting max_diff_lines with ~30% headroom over that honest estimate
  # up front, per the LES-2026-08-11-000000024 lesson from both prior siblings' post-review
  # amendments, rather than a tight cap likely to need its own amendment round.
  max_diff_lines: 1550
  per_class:
    - glob: "sidecar/internal/*/*_test.go"
