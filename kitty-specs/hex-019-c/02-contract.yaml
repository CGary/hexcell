task_id: HEX-019-c
summary: >-
  Presentation claim, deterministic template variation, fixed one-message-per-turn precedence,
  sentinel extension for group/broadcast/status, and the HEX-019-b liberarPresencia residual.
goal: >-
  Implement the last three adr-0015 Layer-1 measures in the Go sidecar: a new
  identidad-owned presentacion_de_conversacion table with a single-claim first-turn
  presentation message; a ControlDePresentacion gate wired into outbox/portero.go's
  Admitir via AdmitirMensajeDePresentacion, which routes through the unmodified Admitir so
  the existing baja and cortacircuitos checks still gate presentation ahead of it; a
  deterministic (non-random) SelectorDePlantilla/ComponerPresentacion pair in
  canal/traduccion.go wired into procesarMensaje's existing esBaja/disparoCortacircuitos
  decision as a third branch, giving the fixed precedence baja > traspaso > presentacion;
  an extended send-path sentinel covering group/broadcast/status primitive names; the two
  new parameters (identification text, presentation variants) wired through
  sidecar/internal/configuracion, neither expressible as disabled; the closing of the
  HEX-019-b review residual (registrarFallo's sibling baja-discard block in salida.go
  missing liberarPresencia); and the docs/STATUS.md closure of the seven-measure
  discipline entry. No IPC wire change, no schema change to an existing table, no new
  dependency.

