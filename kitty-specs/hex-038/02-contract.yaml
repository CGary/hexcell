  behaviors:
    - Do NOT modify the GCRA algorithm implementation in crates/hexcell-core/src/admision.rs
      (00-spec.yaml invariant). ConfiguracionGcra::nueva, tasa_sostenida_por_segundo(), and
      tolerancia_rafaga() already exist and are public; use them as-is.
    - Do NOT add any new Cargo dependency, dev-dependency, workspace dependency, or Cargo
      feature anywhere. hexcell-core's dependency table must stay empty (adr-0002).
      crates/hexcell already depends on hexcell-core; no manifest change is needed.
    - 'Do NOT change the public signature of Motor::nuevo. The parsed/validated
      ConfiguracionGcra must reach Motor only through a new opt-in method (e.g. a consuming
      builder con_configuracion_gcra(mut self, configuracion ConfiguracionGcra) -> Self).
      Every existing Motor::nuevo call site outside crates/hexcell/tests/admision.rs and
      crates/hexcell/src/main.rs must keep compiling completely unmodified.'
    - Do NOT make ConfiguracionGcra, or any new configuracion.rs field carrying it, a mandatory
      constructor input anywhere it would force touching test files outside this contract's
      touch list (LES-039). Keep the field optional-with-a-computed-default at every call site.
    - Do NOT change the limitation key for admission (it remains the normalized conversation id
      via Motor::procesar_evento -> RegistroDeAdmision::admitir(evento.conversacion.como_str()));
      this task documents that behavior, it does not change it.
    - Do NOT change ConfiguracionGcra::default()'s compiled-in numeric values (0.5 req/s,
      burst 3) unless the ac_3 realistic conversation profile evidence read during this task
      demonstrably requires it -- and even then, only flag it as a risk in 01-blueprint.yaml
      for explicit human sign-off; never change the defaults silently as part of this
      implementation.
    - 'Every new/changed env-var parsing branch in configuracion.rs must, on an invalid value,
      return an Err with ErrorDeConfiguracion::ValorInvalido (fields nombre, valor,
      formato_esperado) naming the exact HEXCELL_ADMISION_* variable, in Spanish, following
      the file''s exact existing idiom (see the HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS branch)
      -- never a bare unwrap/expect/panic in this parsing path (the module doc comment
      explains why -- release profile sets panic to abort, which eats the message).'
    - Do NOT add discard logging, tracing, metrics, or any crate::registro wiring for the
      admission discard path (stage A-4 task 4, out of scope, see 00-spec.yaml non_goals).
    - Do NOT implement the Tokio concurrency semaphore or any LLM budget/balance accounting
      (stage A-4 task 5 and later tasks, out of scope).
    - Do NOT introduce any HTTP- or transport-specific type into configuracion.rs, motor.rs, or
      main.rs as part of this change.
    - 'Do NOT delete, weaken, or silently reinterpret any existing test under
      crates/hexcell/tests/configuracion.rs or crates/hexcell/tests/admision.rs. New coverage is
      additive: new #[test]/#[tokio::test] functions, plus adding the two new env var names to
      limpiar_entorno_de_hexcell''s cleanup list in configuracion.rs.'
    - 'Tests must discriminate (LES-036): the invalid-value tests must assert the specific
      ErrorDeConfiguracion::ValorInvalido { nombre, .. } naming the exact offending variable
      (never a bare is_err() check), and the new admision.rs builder test must assert an exact
      admitted/discarded count that differs from the existing default-config test, so a
      no-op con_configuracion_gcra implementation fails it.'
    - adr-0023 must be numbered exactly adr-0023 (verify adr-0022 is still the latest row in
      docs/adr/README.md before writing) and must never renumber or reorder any existing ADR.
    - docs/adr/README.md must gain exactly one new row, in the existing table's column format,
      for adr-0023; no other row may be edited, reordered, or removed.
    - Do NOT write any code, comment, doc-comment, ADR prose, or commit message in a language
      other than Spanish; conventional commits without AI attribution.
    - Do NOT version *.db, *.db-wal, *.db-shm, or .env* files.
