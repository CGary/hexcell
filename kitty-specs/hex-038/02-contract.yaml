task_id: HEX-038
summary: Add two HEXCELL_* env vars to parametrize GCRA sustained rate and burst, wire the
  parsed ConfiguracionGcra into Motor via a new builder method, and write adr-0023.
goal: 'Deliver stage A-4 task 3 (docs/plan/fase-a-4-admision-presupuesto.md), covering FR-08 of
  docs/PRD.md: make the GCRA admission control''s sustained rate and burst tolerance
  configurable at startup via two new environment variables, following the existing Spanish
  HEXCELL_* convention in crates/hexcell/src/configuracion.rs. An invalid value for either
  variable must fail startup closed with a Spanish error naming the exact offending variable,
  before any network or disk access beyond what desde_entorno() already performs. When both
  variables are unset, ConfiguracionGcra::default() (0.5 req/s, burst 3) must be preserved
  exactly (LES-039: this default is legitimate, admission rate limits are not
  deployment-region-dependent). The parsed configuration must reach the production Motor via a
  new opt-in builder method, never by changing Motor::nuevo''s existing signature, so the
  ~20 existing call sites across crates/hexcell/tests/ and src/main.rs keep compiling
  unmodified. Finally, write docs/adr/adr-0023-*.md justifying the preserved defaults against
  the plan''s zero-false-positive criterion (the ac_3 realistic conversation profile evidence),
  citing FR-08, and add its row to docs/adr/README.md.'
read:
  - .ai/tasks/active/HEX-038-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-038-new-spec/01-blueprint.yaml
  - crates/hexcell-core/src/admision.rs
  - crates/hexcell/tests/motor.rs
