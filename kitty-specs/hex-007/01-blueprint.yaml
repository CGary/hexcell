test_scenarios:
    - covers:
        - AC-1
        - AC-11
      statement: The inference port declares one generation operation whose signature names no concrete provider, returns impl Future + Send rather than using async fn in the trait, and lives in a crate whose dependency table stays empty.
    - covers:
        - AC-2
      statement: Calling the simulated provider twice with the same request, in separate invocations, returns byte-identical replies, and the reply is derived only from the request content with no randomness and no reading of any clock.
    - covers:
        - AC-3
      statement: The engine receives the provider through a processor that is generic over the trait, so the concrete simulated type is never named in the signature the engine holds.
    - covers:
        - AC-4
      statement: An event injected by the simulated adapter and processed by the engine produces an outgoing message captured by the adapter that equals the provider reply and is NOT the echo of the incoming content, proving the reply came from the provider rather than from a value fixed in the processor.
    - covers:
        - AC-4
      statement: A provider failure produces no send and no panic, and the engine keeps consuming subsequent events.
    - covers:
        - AC-5
      statement: The real binary, launched as tests/salud_http.rs launches it and with an in-flight event proven by its inferencia_iniciada log line, exits with code 0 in under 30 seconds after receiving SIGTERM.
    - covers:
        - AC-6
      statement: With both pools still open, writing rows and then calling the checkpoint leaves the sessions.db -wal file at exactly zero bytes and the data still readable, which is the falsifiable form of the criterion because SQLite deletes the -wal by itself when the last connection closes.
    - covers:
        - AC-6
      statement: The shutdown of the real process emits a punto_de_control_wal entry reporting a zero-byte WAL before the process exits.
    - covers:
        - AC-7
      statement: An event still in flight when SIGTERM arrives is found complete in sessions.db after the process is gone - the incoming event registered and its outgoing reply recorded in the conversation history - with nothing half-written.
    - covers:
        - AC-7
      statement: Events already queued but not yet dequeued when the signal arrives are drained before exit, because the engine closes the receiver instead of abandoning it, and no sender can enqueue anything after that point.
    - covers:
        - AC-8
      statement: A log entry produced while processing an event carries the cell identifier, an event identifier and a latency measurement, in a single JSON object per line.
    - covers:
        - AC-9
      statement: An event whose content is a distinctive marker leaves that marker nowhere in the whole captured stdout and stderr of the process, while its log entries are still present and correlated by identifier.
    - covers:
        - AC-10
      statement: cargo fmt --check, cargo clippy --workspace --all-targets -- -D warnings and cargo test --workspace all finish clean on the pinned 1.92.0 toolchain, including the trait methods written as impl Future + Send rather than async fn.
    - covers:
        - AC-11
      statement: 'crates/hexcell-core/Cargo.toml still declares no dependency at all: no tokio, no HTTP crate, no SQLite or pool crate, whether or not the inference port lives there.'
    - covers:
        - AC-12
      statement: The diff contains no VACUUM INTO, no backup or restore mechanism, no sidecar IPC contract, no API key and nothing in docs/STATUS.md marking etapa A-2 as closed.
