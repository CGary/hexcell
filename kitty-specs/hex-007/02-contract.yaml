forbid:
    behaviors:
        - 'Do not write the trait methods as async fn. Both ProveedorDeInferencia::generar and ProcesadorDeMensajes::procesar are DECLARED returning impl Future<Output = ...> + Send. On rustc 1.92.0 the short form fires the async_fn_in_trait warning, which cargo clippy -D warnings turns into an error, and crates/hexcell-core/src/canal.rs already carries this exact reasoning for ChannelAdapter. The IMPLEMENTATIONS may and should use plain async fn: the lint fires on the declaration, not on the impl. Verified on the pinned toolchain on 2026-07-30, together with the bound the impl needs: ProcesadorDeInferencia<I> requires I: ProveedorDeInferencia + Sync, because &self crosses the await and the future must stay Send. Do not silence the lint with an allow attribute and do not drop the + Send bound.'
        - 'Do not give crates/hexcell-core a single dependency. Its [dependencies] table stays empty and that is AC-11, not a style preference: no tokio, no HTTP crate, no SQLite crate, no serde, no futures. The inference port lives there BECAUSE it costs nothing - IdConversacion, String and std::future::Future - and if any type you want to add would need a crate, the type is wrong, not the rule. crates/hexcell-core/src/canal.rs and identidad.rs are not edited at all: this task does not reopen ChannelAdapter, does not add a session-state method, does not implement CicloDeVidaSesion and does not touch the canonical event types. The only change under hexcell-core is the NEW file src/inferencia.rs plus its module declaration in lib.rs.'
        - Do not put anything speculative in the inference types. PeticionDeInferencia carries the opaque IdConversacion and the normalised content; RespuestaDeInferencia carries the reply text. NO token counts, no cost, no model name, no temperature, no streaming variant, no retry policy and no budget hook. That is D-09 in docs/bitacora-de-descartes.md - an anticipated signature written as a compatibility mitigation, discarded as a design principle - and the spec only requires that A-4 be able to WRAP the provider without changing the signature the engine consumes. A-4 adding a usage field to RespuestaDeInferencia does not change that signature, so the deferral is safe and must be stated in adr-0017 rather than hedged against in code.
        - 'Do not make the simulated provider non-deterministic, and do not make it an echo. The reply is derived ONLY from the request content, by a hand-written FNV-1a 64 fingerprint of about ten lines: no rand crate, no hashing crate, no SystemTime::now, no Instant::now, no DefaultHasher (whose output is explicitly not stable across processes) and no HashMap iteration order. It must NOT be the echo of the input, because AC-4 requires a test to distinguish a reply that came from the provider from a value fixed in the processor, and an echo cannot be distinguished from what ProcesadorDeEco already did. The optional fixed latency is a Duration defaulting to ZERO, awaits nothing at all when zero, changes no output and therefore does not weaken the determinism criterion.'
        - 'Do not create an eighth workspace crate for the simulated provider, and do not add or remove any workspace member. It is a module of crates/hexcell, which already has a lib target for exactly this reason. hexcell-canal-simulado earned a crate because hexcell-canal-contrato consumes it independently of the binary; nothing outside crates/hexcell consumes this one. Do not edit the root Cargo.toml at all: the tokio entry in [workspace.dependencies] already carries default-features = false and every crate selects its own features, so the signal feature is added in crates/hexcell/Cargo.toml and nowhere else.'
        - Do not add tracing, tracing-subscriber, tracing-appender, log, env_logger, slog, fern, serde, serde_json, tokio-util, libc, nix, signal-hook, tempfile, rand, chrono, time, anyhow or thiserror to any manifest. The logger is about two hundred lines of hand-written JSON-line emission; tracing plus a JSON subscriber would drag serde and serde_json and roughly a dozen crates to print a handful of fields per event on a cell budgeted at 80 MB, which is the same argument this repository already made against axum, tiny-http and r2d2. tokio-util is rejected because CancellationToken duplicates what tokio::sync::watch - already enabled - expresses exactly. libc is rejected because the process test delivers the signal with /bin/kill, the same trade this repository made when it wrote raw HTTP over a TcpStream rather than add a client crate. Record both rejections as NEW entries D-17 and D-18 in docs/bitacora-de-descartes.md, as CLAUDE.md requires a discard to be written in the same commit that makes it.
        - 'Do not let message content reach a log line, by construction and not by care. EntradaDeRegistro declares evento as a &''static str - a runtime String cannot be coerced into one, so a message body cannot occupy that field - plus the identifier fields, latencia_ms, and EXACTLY ONE free-text field, detalle, documented as being for the process own text (a bound address, a storage error) and never for the text of a message. Do not add a generic key-value bag, a Display-based field, a format-string passthrough or a Debug dump of EventoEntrante or of MensajeSaliente anywhere. crates/hexcell/src/registro.rs must not contain the identifier contenido at all, and inferencia.rs, procesador.rs, conversaciones.rs and deduplicacion.rs must not import the logging module: those are the modules that can see message text, and the import ban is the structural half of AC-9.'
        - Do not emit anything to stdout or stderr from crates/hexcell/src/motor.rs except through the logging module. Every existing println! and eprintln! in that file is replaced by a registro entry. Every entry emitted while processing an event carries the cell identifier, the event identifier and a latency measurement, including the duplicate-discarded case and the error cases. The cell identifier comes from a std::sync::OnceLock set once by registro::inicializar from Configuracion::id_celula; it is not threaded through Motor::nuevo, which keeps its five parameters.
        - 'Do not read Instant::now or SystemTime::now outside the one place this task permits. SystemTime::now stays banned across crates/hexcell/src/ and crates/hexcell-storage/src/, with no exception: message timestamps still come from the event and the deduplication horizon is still pruned against the maximum received timestamp, exactly as HEX-005 fixed and HEX-006 persisted. Instant::now - the MONOTONIC clock - is permitted in crates/hexcell/src/motor.rs only, to measure latency and to check the drain limit between events, and remains banned in deduplicacion.rs, conversaciones.rs, configuracion.rs and inferencia.rs. Do not import Reloj, RelojDePrueba or RelojDelSistema into crates/hexcell/src/: production code does not take its clock from the test-double crate.'
        - 'Do not put anything except the shutdown signal and receptor_eventos.recv() inside the select! of Motor::ejecutar. The per-event work is awaited in the BODY of the recv branch, never as a select branch, so an event in flight cannot be cancelled half-way; that is the structural form of the invariant that an event in flight is processed to its natural end. Use biased so the shutdown branch wins deterministically. On the signal, call receptor_eventos.close(): senders are refused from that instant while recv() keeps yielding what is already buffered until the queue empties. Do NOT wrap the drain loop in tokio::time::timeout - it would drop the inner future at whatever await point it had reached, possibly between the send and the history write, which is precisely the truncation this task exists to prevent. The limit is checked BETWEEN events, before dequeuing the next one, and a spent limit logs drenaje_incompleto with the pending count and breaks.'
        - 'Do not try to checkpoint knowledge_live.db, and do not open a read-write connection to it at shutdown to make the wording of the spec literally true. Verified empirically on 2026-07-30: PRAGMA wal_checkpoint on a SQLITE_OPEN_READ_ONLY connection fails with a disk I/O error, and every connection of PoolDeConocimiento is read-only because FR-05 and adr-0003 say knowledge_live.db is read-only in production. punto_de_control_de_wal visits both pools, runs PRAGMA wal_checkpoint(TRUNCATE) on the single sessions.db write connection, and reports the knowledge pool as read-only with nothing to consolidate. The mismatch with the spec wording is RISK-1 in the blueprint; the spec belongs to the human and is not rewritten.'
        - 'Do not assert that the checkpointed-page count is greater than zero. Verified on 2026-07-30: after a successful TRUNCATE the pragma returns 0|0|0, because the counters describe the WAL state after the reset. What is observable, and what the storage test asserts WITH THE POOLS STILL OPEN, is that the -wal file is exactly zero bytes and the data still reads back. Do not write that assertion as a check after the process has exited: SQLite checkpoints and DELETES the -wal by itself when the last connection closes, so such a test passes identically with and without the explicit checkpoint - a test that cannot fail is decoration.'
        - 'Do not fail the process because the checkpoint failed. A WAL that could not be consolidated is not data loss - SQLite replays it on the next open - and reporting a failure exit to the orchestrator for it would be a false alarm during a routine stop. Log it and still return ExitCode::SUCCESS. Equally, do not skip the checkpoint when the engine stopped for any other reason: it runs after the select in every path that reaches the end of main.'
        - 'Do not call unwrap(), expect(), panic!, unreachable! or todo! anywhere under crates/hexcell/src/, crates/hexcell-core/src/ or crates/hexcell-storage/src/. None of those directories contains a single one today, verified on 2026-07-30, and that is not an accident: [profile.release] sets panic = "abort", so a panic in production leaves no usable message. Registering the signal handler is fallible and its error is returned and handled in main, not expect()ed. Do not add a wildcard arm to the match over ResultadoEnvio in motor.rs: it keeps naming all five variants plus Err so a future variant breaks compilation.'
        - 'Do not construct an IdConversacion or an IdRemitente anywhere under crates/hexcell/src/ or crates/hexcell-storage/src/. The synthetic boot event is injected through AdaptadorSimulado::inyectar_desde_contacto, which mints both inside the adapter where adr-0010 says identity translation belongs. IdDeduplicacion::nuevo may appear in main.rs ONLY, for that one synthetic event, with a doc comment saying why: with a real channel the event identifier always arrives from the transport through the adapter. It must not appear in motor.rs, procesador.rs, inferencia.rs, conversaciones.rs or deduplicacion.rs.'
        - 'Do not edit crates/hexcell-canal-simulado in any way. The spec invariant says this task does not touch the channel adapter, and it does not need to: AdaptadorSimulado::inyectar_desde_contacto already exists and is public, and the boot event is injected BEFORE Motor::nuevo takes ownership of the adapter, so no Arc, no shared handle and no delegating ChannelAdapter wrapper is needed in src/. Do not add an injection route to the health server and do not add a stdin reader to the binary; both were considered and rejected in RISK-8 of the blueprint.'
        - Do not leave the test harness dropping the child stdout pipe. crates/hexcell/tests/comun/mod.rs currently builds a BufReader over the child stdout and lets it drop when lanzar_binario_con_ruta_de_datos returns; that closes the read end, and once the binary logs per event the child gets EPIPE and println! panics. Both pipes must be drained for the whole life of the child, on detached threads, into a shared buffer the test can read. Launch the child with stdin null. Deliver the signal with /bin/kill -TERM and wait for exit by polling try_wait, because std has no wait-with-timeout.
        - Do not make a temporal assertion pass by sleeping. The in-flight shutdown test waits for the inferencia_iniciada log line - which proves the event is being processed - and only then sends SIGTERM; it does not sleep an arbitrary interval and hope. Every process test uses its own temporary directory and binds 127.0.0.1:0 for a free port; no test asserts on a fixed port, no test shares a database between tests or between runs, and no test reaches any network beyond the loopback socket it binds itself. No test calls a real inference provider, because none exists in this task.
        - Do not implement anything that belongs to HEX-008 or to a later stage. No VACUUM INTO, no backup, no restore, no restore runbook, no device_removed branch, no sidecar IPC contract, no knowledge_staging.db, no epoch file, no ArcSwap, no symlink switching, no GCRA, no financial accounting, no real inference provider (Gemini, Groq, OpenRouter), no HTTP client and no API key, token or credential anywhere - not in source, not in manifests, not as an example value in documentation. AC-12 treats the diff as a tripwire for these.
        - Do not add product logic to the processor beyond consulting the provider. When the provider returns an error the engine logs it and sends nothing; do not invent a fixed apology text, a retry loop, a backoff or a fallback rule. What a cell says when inference fails is product policy tied to the degraded mode of A-4 (FR-10), and docs/STATUS.md lists product decisions as declared blocks, not things to settle in passing.
        - 'Do not enable tokio rt-multi-thread and do not change the runtime flavor away from current_thread. Add exactly the signal feature to the tokio entry in crates/hexcell/Cargo.toml, with its one-line reason. Verified on 2026-07-30 against the pinned 1.92.0 toolchain: it resolves, compiles clean and pulls exactly one new package, signal-hook-registry 1.4.8, since libc, mio and socket2 are already in the lock through rusqlite and hyper.'
        - Do not hand-write, hand-edit or prune Cargo.lock. Let cargo regenerate it and commit it verbatim. Its path matches sensitive_path_match in complexity-score, so the calculated risk will read higher than the medium 00-spec declares; that divergence is expected, is RISK-11 in the blueprint, and is not corrected by touching the lock file.
        - 'Do not create adr-0020 or higher, do not renumber, reorder, retitle or edit any existing ADR row, and do not skip the check. The full table of docs/adr/README.md was read for this task: 0001 to 0016 are all assigned, NO row is reserved for ordered shutdown or for structured logging, and adr-0012 is a different decision (inference is 100% external, the local hardware runs no models, stage A-4) which must not be repurposed for the port. The three new rows are adr-0017-puerto-de-inferencia.md, adr-0018-apagado-ordenado.md and adr-0019-registro-estructurado.md, each stating the stage that produces it (A-2) and its status as Vigente with the date 2026-07-30. Every other row stays byte-identical.'
        - 'Do not edit or renumber any existing entry of docs/bitacora-de-descartes.md. Entries are append-only by its own rules: add D-17 (logging crates rejected) and D-18 (tokio-util CancellationToken rejected), each with its motive and its explicit reopen condition, add their two rows to the index table, and update the last-updated line at the top. D-01 to D-16 stay untouched, and a reopened discard would be marked REABIERTO rather than rewritten - no discard is reopened here.'
        - Do not write anything in docs/STATUS.md that marks etapa A-2 as closed, finished, cerrada, completada or terminada, and do not rewrite or delete any existing bullet. Add only new entries dated 2026-07-30 attributed to HEX-007, including one Pendiente stating that a real provider in A-4 must carry a per-call timeout comfortably smaller than the drain limit, because the drain limit is checked between events and cannot bound a single hung call. The stage closes with HEX-008.
        - 'Do not state or imply anywhere that Fase B replaces, substitutes or closes Fase A, or that the sidecar is retired or transitional. The own channel is the default and permanent channel and the sidecar is its permanent cost. Do not introduce any mass-sender folklore (jitter, warm-up protocols, proxies, VPN, IP rotation): D-08 rejects it as a design principle.'
        - 'Do not write repository prose, doc comments, error messages or commit messages in English. Rust identifiers, crate names, SQL keywords and existing English identifiers stay as they are; the language rule governs prose, not identifiers. JSON log field names are written in Spanish, consistently with the identifiers already used across the tree. Markdown prose and long comments keep the repository''s ~100 column width. Every date written is absolute (2026-07-30), never relative. Correct the two stale module-doc lines that attribute ordered shutdown and structured logging to HEX-008 (crates/hexcell/src/main.rs and motor.rs): those are plan tasks 12 and 15 and they belong to THIS task.'
        - Do not add Co-Authored-By or any AI-attribution trailer to any commit message. Conventional commits in Spanish only.
        - 'Do not commit any *.db, *.db-wal, *.db-shm or .env* file - .gitignore already covers them and must not be edited - and do not leave a temporary directory behind: every test directory is removed on drop by the existing helper.'
