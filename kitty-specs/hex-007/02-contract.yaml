goal: |
    Turn A-2 plan tasks 11, 12 and 15 into Rust code on top of what HEX-006 left on main. Three
    independent pieces land. First, the INFERENCE PORT: a trait ProveedorDeInferencia declared in
    crates/hexcell-core/src/inferencia.rs with std only, written as fn generar(...) -> impl
    Future<Output = Result<RespuestaDeInferencia, Self::Error>> + Send because async fn in a trait
    fires async_fn_in_trait and clippy -D warnings turns that into an error on the pinned 1.92.0
    toolchain, plus a deterministic ProveedorSimulado in crates/hexcell/src/inferencia.rs whose reply
    is an FNV-1a fingerprint of the request content - no rand, no clock, and deliberately NOT the echo
    of the input, so a test can prove the reply came from the provider. The engine consumes it through
    ProcesadorDeMensajes, which becomes future-returning, and a new ProcesadorDeInferencia<I> generic
    over the trait; ProcesadorDeEco stays for the five test files that must not become inference tests.
    No token accounting, no cost, no model name: that is D-09 territory and A-4 adds usage to the
    response when it has a real API to model it on, without touching the engine. Second, the ORDERED
    SHUTDOWN: Apagado::instalar registers SIGTERM and SIGINT over tokio::sync::watch, Motor::ejecutar
    selects biased over exactly two branches - the signal and recv - with the per-event work awaited in
    the branch BODY so it can never be cancelled half-way, closes the receiver on the signal so senders
    are refused while buffered events still drain, checks the 10 s limit BETWEEN events rather than
    wrapping the drain in a timeout, and then checkpoints the WAL and exits 0. The checkpoint visits
    both pools but only sessions.db can receive one: verified on 2026-07-30, a checkpoint on a
    read-only connection fails with a disk I/O error and every knowledge_live.db connection is
    read-only by FR-05. Third, STRUCTURED LOGS: one hand-rolled JSON object per line on stdout, NO
    logging crate, with a typed field set - evento is a &'static str, there is exactly one free-text
    field - and with the modules that can see message text forbidden from importing the logger at all.
    Three ADRs are written, numbered 0017, 0018 and 0019, checked against the full README table rather
    than assumed. No backup, no restore, no VACUUM INTO, no sidecar IPC, no real provider, no API key,
    and nothing marking etapa A-2 as closed.
