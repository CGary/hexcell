entries:
  - "Fix round (06-review.json fix_tasks, contract amended 2026-08-11 PAT-022): (1) cortacircuitos-descarte-en-drenaje - ColaDeSalida gained a ControlDeCortacircuitos collaborator (ConCortacircuitos, mirroring ConDisciplina) and intentarUno now re-checks SalidaPermitida at drain time, right after the existing baja recheck: tripped-and-not-the-claimed-handoff discards the row (delete + liberarPresencia + ContadorDescartadasPorCortacircuitos + EventoSalidaDescartadaPorCortacircuitos), a read error defers the row (fail closed, ContadorAplazadasPorErrorCortacircuitos + log, matching verificarDisciplina's pattern) without transmitting or discarding. main.go wires almacenIdentidad via .ConCortacircuitos(almacenIdentidad). New test TestDrenarDescartaFilaEncoladaAntesDeDispararseCortacircuitos proves a reply admitted before the trip is discarded (not transmitted) after the handoff while the handoff itself still transmits, and TestDrenarAplazaFilaPendienteSiFallaLaConsultaDeCortacircuitos proves the read-error path defers. (2) cortacircuitos-fallo-cerrado-entrante - canal.Traductor.procesarMensaje's inbound Observar error path no longer swallows the error and falls through to forward the message; it now increments a new canal.ContadorErroresCortacircuitos atomic counter and returns early (no persist, no forward), matching the file's existing hard-error-return convention and the outbound fail-closed pattern in portero.go. New test TestProcesarMensaje_Cortacircuitos_ErrorDeObservacion_FallaCerradoYNoReenvia is the inbound twin of TestPorteroDeSalida_AdmitirFallaCerradoEnErrorCortacircuitos. Diff stayed within amended per_class caps (salida.go 69/110, traduccion.go 169/200, main.go 13/30) and the global cap (1674/1900); gofmt/build/vet/test all clean."
summary: 'Conversational circuit breaker: repetition/frustration detection, persistent trip and single-handoff claim in identidad, enforced at the portero COSTURA ahead of the STOP check.'
task_id: HEX-019-b
