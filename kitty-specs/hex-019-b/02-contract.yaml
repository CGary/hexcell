limits:
  max_files_changed: 14
  # Parent HEX-019's decomposition entry (01-blueprint.yaml DECOMPOSITION, child B) estimated
  # ~10 files / ~1050 lines; that count did not itemize identidad.go's schema addition or the
  # protocol doc update, so the honest file count here is 14. Honest line estimate across the
  # design in 01-blueprint.yaml is roughly 1450 (identidad: ~220, outbox: ~300, canal: ~430,
  # configuracion: ~245, main.go: ~12, doc: ~12, plus the salida.go one-line residual fix).
  # Setting max_diff_lines with ~30% headroom over that honest estimate up front, per the
  # LES-2026-08-11-000000024 lesson from HEX-019-a's two post-review amendments (1400 -> 1550 ->
  # 1600) on a comparably-scoped 12-file/1250-line starting estimate, rather than forcing a tight
  # cap that likely needs its own amendment round.
  max_diff_lines: 1900
  per_class:
    - glob: "sidecar/internal/*/*_test.go"
      max_diff_lines: 1100
    - glob: sidecar/internal/identidad/cortacircuitos.go
      max_diff_lines: 260
    - glob: sidecar/internal/identidad/identidad.go
      max_diff_lines: 40
    - glob: sidecar/internal/outbox/portero.go
      max_diff_lines: 110
    # ENMIENDA DEL ORQUESTADOR (2026-08-11, PAT-022): 20 -> 110. La revision profunda mando el
    # re-chequeo del cortacircuitos en el drenaje (fix_task cortacircuitos-descarte-en-drenaje);
    # el tope original solo presupuestaba el residuo liberarPresencia (5 lineas usadas).
    - glob: sidecar/internal/outbox/salida.go
