task_id: HEX-019-b
summary: >-
  Conversational circuit breaker: repetition/frustration detection, persistent trip and
  single-handoff claim in identidad, enforced at the portero COSTURA ahead of the STOP check.
goal: >-
  Implement the conversational circuit breaker end to end in the Go sidecar: a new
  identidad-owned table tracking per-conversation repetition count and trip/handoff-claim
  state; a ControlDeCortacircuitos gate wired into outbox/portero.go's Admitir at the
  documented COSTURA, ahead of the untouched baja/STOP check, that suppresses every
  outbound candidate for a tripped conversation except the one reclaimed handoff message;
  an inbound DetectorDeCortacircuitos in canal/traduccion.go that trips on 3 consecutive
  identical normalized messages or on any whole-word match against the ratified
  frustration keywords; the two new parameters plus the handoff text wired through
  sidecar/internal/configuracion following the existing bounded/non-empty env-var
  pattern, none expressible as disabled; and the closing of the HEX-019-a review residual
  (registrarFallo's retry-exhaustion branch missing liberarPresencia). No IPC wire change,
  no schema change to an existing table, no new dependency.

