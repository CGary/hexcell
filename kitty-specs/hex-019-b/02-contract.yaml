    - sidecar/internal/identidad/presentacion.go
    - sidecar/internal/canal/canal.go
    - sidecar/internal/canal/canal_test.go
    - sidecar/internal/canal/almacen_interno_test.go
    - sidecar/internal/canal/emparejamiento.go
    - sidecar/internal/canal/emparejamiento_test.go
    - sidecar/internal/canal/reconexion.go
    - sidecar/internal/canal/reconexion_interno_test.go
    - sidecar/internal/canal/taxonomia.go
    - sidecar/internal/canal/taxonomia_interno_test.go
    - docs/STATUS.md
  behaviors:
    - "Do NOT relocate, weaken, skip, or otherwise touch the opt-out/STOP check in outbox/portero.go's Admitir (the ControlDeBaja.EnvioPermitido call and its ErrContactoDadoDeBaja path). The circuit breaker's ControlDeCortacircuitos check is inserted strictly at the existing COSTURA comment, strictly ahead of it, never replacing or reordering it. AdmitirConfirmacionDeBaja stays untouched in both signature and behavior: it is baja's own exemption path, not the pattern for the handoff (see the next rule)."
    - "Do NOT let the circuit breaker's handoff message bypass the baja/STOP check. Per the A-3 plan's explicit precedence (STOP over the outbox queue and over the breaker), AdmitirMensajeDeTraspaso must route the claimed handoff through the unmodified Admitir (or otherwise re-run the existing baja check) rather than calling ColaDeSalida.Encolar directly the way AdmitirConfirmacionDeBaja does. A contact under an active baja registration must not receive the handoff, covered by a test."
    - "Do NOT make any of the three new parameters (repetition threshold, frustration keyword list, handoff text) expressible as disabling the breaker. The repetition threshold is validated through the existing enteroAcotadoDelEntorno with a documented, bounded ceiling (not left effectively unbounded, which would let a huge value neuter the breaker); the frustration keyword list is rejected when present-but-empty, exactly like the existing PalabrasDeBaja pattern; configuracion.Cortacircuitos carries no boolean field. Cover the boundary rejections and the no-boolean-field property with tests, not just the happy path."
    - "Do NOT invent, alter, or re-mark as pending the three human-ratified values: repetition threshold 3, frustration keywords humano/persona/agente/operador, and the handoff text 'Te paso con una persona del equipo. En cuanto esté disponible te responde por acá.' (see .ai/tasks/active/HEX-019-new-spec/07-trace.json, topics defaults_numericos and textos, ratified 2026-08-11). Ship each as the declared default; per 00-spec.yaml constraint 4 these remain per-cell configurable and may still carry a PENDIENTE DE CALIBRACIÓN-style comment for field calibration, but do not write 'PENDING RATIFICATION' anywhere for these three values."
    - "Do NOT bump the IPC protocol version, the wire version, or the closed set of eleven message types, and do NOT touch sidecar/internal/ipc/mensajes.go. Nothing in this task crosses the wire: the breaker is a sidecar-only reaction to inbound text and a sidecar-only gate on outbound admission. The Rust core needs no new knowledge of the breaker. Only section 2 of docs/protocolo-ipc-nucleo-sidecar.md changes, to document the three new environment variables."
    - "Do NOT change the schema of an existing table (identidad, direccion, baja_de_contacto, cola_salida, outbox, volumen_diario) and do NOT write an imperative migration. The one new table (cortacircuitos, in identidad.go's esquema constant) is added with CREATE TABLE IF NOT EXISTS so an existing identidad.db gains it on open with its other tables and rows untouched."
    - "Do NOT keep the trip state or the single-handoff claim in memory. They persist in the identidad-owned cortacircuitos table via the same RowsAffected-decided atomic-claim pattern that ReclamarConfirmacionDeBaja already uses for baja's own single confirmation, so both survive a process restart. On a read error against this state (in either PorteroDeSalida.Admitir's cortacircuitos check or the inbound detector's RegistrarObservacion call), the code must fail CLOSED: never assume 'not tripped', log a dedicated event, increment a dedicated counter, and do not enqueue the candidate message (LES-2026-08-11-000000025)."
    - "Do NOT let the circuit breaker send more than one handoff message per tripped conversation. The single-claim contention test (mirroring TestPorteroDeSalida_AdmitirConfirmacionDeBaja_ReclamoUnico) is mandatory: a second AdmitirMensajeDeTraspaso call for an already-claimed conversation must not enqueue a second row."
    - "Do NOT compare timestamps or day-boundaries in the circuit breaker path against a different timezone on read than on write. If any temporal key is introduced (e.g. disparado_en_ms, traspaso_encolado_en_ms), it is read back and reasoned about in the same zone it was written in (LES-2026-08-11-000000025); prefer storing and comparing raw epoch milliseconds, exactly as the existing baja_de_contacto table already does, over any zone-dependent formatted key."
    - "Do NOT skip the HEX-019-a residual. registrarFallo's retry-exhaustion DELETE branch (the nuevoIntentos >= c.intentosMaximos path) must call c.liberarPresencia(p.idMensaje), with a test proving PresenciasPendientesParaPruebas reflects the release after exhaustion. This is the one required touch to salida.go; do not use it as license to touch anything else in that file's disciplina-gate logic (owned by HEX-019-a and forbidden above). ENMIENDA DEL ORQUESTADOR (2026-08-11, PAT-022, adjudicada por la revision profunda): el fix_task cortacircuitos-descarte-en-drenaje exige un SEGUNDO toque en salida.go — re-chequear el estado del cortacircuitos en el drenaje (como ya se hace con baja) para que las filas admitidas antes del disparo no se transmitan tras el traspaso, con fallo CERRADO ante error de lectura. Ese re-chequeo queda autorizado; el resto de la logica de disciplina de HEX-019-a sigue intocable."
    - "Do NOT introduce mass-sending vocabulary in code, comments, identifiers, environment variable names, log event names, tests, or documentation. No jitter, no calentamiento or warm-up, no proxy, no VPN, no IP rotation, no throughput, no traffic shaping. Frame the breaker per adr-0015's own [causa documentada] classification of 'Cortacircuitos conversacional', matching that mark verbatim in the code/doc comments introduced by this task."
    - "Do NOT add a third-party dependency to the Go module and do NOT touch anything under crates/. No new import beyond the standard library and the packages already imported by the touched files."
    - "Do NOT leave dead wiring. NuevoPorteroDeSalida and NuevoTraductor both gain one new parameter; every call site (main.go and every test constructing either type) must be migrated, not left to fail the build or to pass nil where a real collaborator now exists in production wiring. The detector and the cortacircuitos control must have real non-test callers in main.go."
    - "Do NOT implement the presentation claim, the deterministic template variation, the one-message-per-turn precedence rule, or the group/broadcast/status sentinel extension (all child HEX-019-c's scope, which depends on this child establishing the second sidecar-authored message). Do NOT implement any new re-subscription/opt-in flow; the explicit reset invariant is satisfied by a store-level Restablecer primitive only, not a conversational command or CLI surface. Do NOT touch the hard portfolio cap or incident-rate threshold (adr-0015 Layer 3, pending business decisions)."
    - "Do NOT touch docs/STATUS.md. Its open discipline entry closes with child HEX-019-c, the last child to complete the full measure set, per 00-spec.yaml non_goals."
    - "Do NOT reorder, renumber, or rewrite an existing ADR or discard-log entry, and do NOT add a new one in this task. All identifiers, comments, documentation, and the commit message are written in Spanish; artifact YAML prose stays in English; every date written into code or documentation is absolute (2026-08-11), never relative."

verify:
