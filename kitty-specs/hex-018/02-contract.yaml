task_id: HEX-018
summary: "Opt-out (STOP) list in the sidecar identity store, detected inbound, enforced ahead of Encolar and again at drain, with exactly one confirmation."
goal: >-
  Implement A-3 plan task 13. Detect a per-cell configurable opt-out keyword on the sidecar's
  inbound path, register the contact in a NEW table inside the sidecar's identidad.db (never the
  whatsmeow sqlstore, so a re-pairing cannot revive an opted-out contact), refuse every outbound
  send to that contact at the earliest point of the send path that exists today, ahead of
  ColaDeSalida.Encolar and leaving the seam for the future circuit breaker, and enqueue exactly one
  confirmation message using the cell's configured text as the only send ever permitted to an
  opted-out contact. Opt-out takes effect immediately, including for messages already sitting in
  the outbound queue, and never expires. No re-subscription path exists in this task.

