task_id: HEX-006
summary: 'A-2 tasks 7 and 8: dual SQLite pools in hexcell-storage on rusqlite 0.39, sessions.db schema
    and user_version migrations, dedup and history persisted, real /health/ready.'
goal: |
    Turn A-2 plan tasks 7 and 8 into Rust code on top of what HEX-005 left on main. Three pieces land.
    First, a DUAL SQLITE POOL MANAGER in crates/hexcell-storage - the crate adr-0002 reserved for
    persistence and the one the A-2 plan names for exactly this - holding one read/write pool for
    sessions.db and one read-only pool for knowledge_live.db, both in WAL, every connection setting
    busy_timeout, synchronous and foreign_keys explicitly with its justification written at the point
    of the call, plus a per-pool vitality probe. The driver is rusqlite 0.39 with the bundled feature
    and NOTHING else: r2d2 is rejected because it would run a background reaper thread over a writer
    pool whose maximum useful size is one, sqlx is rejected for its dependency tree, and both
    rejections are the same argument this repository already applied to axum and tiny-http. The crate
    stays synchronous and tokio-free; whoever owns the runtime decides how to schedule blocking work.
    Second, the SCHEMA AND VERSIONED MIGRATIONS of sessions.db - contactos, conversaciones, mensajes,
    parametros_de_plantilla, deduplicacion and estado_del_motor, STRICT, with their indexes, keyed by
    the internal opaque conversation identifier and with NO column holding a raw transport identifier -
    driven by PRAGMA user_version inside the same transaction that changes the schema, so re-running is
    a no-op and no migration crate is needed. Third, PERSISTENCE OF WHAT HEX-005 LEFT IN MEMORY:
    sessions.db becomes the single source of truth for the deduplication registry and the conversation
    history, so both survive a process restart, with the semantics HEX-005 fixed unchanged - pruning
    against the maximum received timestamp, never a system clock, and the one-hour default still driven
    by HEXCELL_VENTANA_DEDUPLICACION_SEGUNDOS. Finally GET /health/ready stops being a placeholder and
    becomes the conjunction of both pool vitalities and the channel session state, the last supplied at
    composition time because - contrary to what 00-spec.yaml assumes - ChannelAdapter exposes no such
    method and this task does not reopen hexcell-core to add one. One ADR is written, and its number is
    0003, not 0017. No SIGTERM, no LLM provider, no structured logging, no backup or restore, no epochs,
    no real channel, and hexcell-core is not touched at all.
