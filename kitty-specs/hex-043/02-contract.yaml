      max_diff_lines: 420
    - glob: "crates/hexcell-storage/src/presupuesto.rs"
      max_diff_lines: 220
    - glob: "docs/**"
      max_diff_lines: 90

execution:
  mode: worktree_edit
  branch: ai/HEX-043-new-spec

retry_policy:
  max_attempts: 2
  escalate_after: 2
