limits:
  max_files_changed: 20
  max_diff_lines: 2800
  per_class:
    - glob: "deploy/verificar_renderizado_configuracion.sh"
      max_diff_lines: 420
execution:
  mode: worktree_edit
  branch: ai/HEX-081
retry_policy:
  max_attempts: 2
  escalate_after: 1
