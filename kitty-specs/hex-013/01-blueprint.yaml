symbols:
  - "ipc.VersionProtocolo (Value Object constant: 2 -> 3, the wire integer of document v1.2)"
  - "ipc.EstadoPausada (fourth value of the estado enum, alongside EstadoActiva/Reconectando/Desvinculada)"
  - "ipc.CausaDispositivoRemovido (LoggedOut with OnConnect=false, the device_removed signature)"
  - "ipc.CausaSesionCerrada (LoggedOut with OnConnect=true, carrying its ConnectFailureReason)"
  - "ipc.CausaBaneoTemporal (TemporaryBan, carries Code and the converted absolute expiry)"
  - "ipc.CausaSesionReemplazada (StreamReplaced)"
  - "ipc.CausaFalloDeConexion (ConnectFailure, carries its Reason as codigo)"
  - "ipc.CausaErrorDeFlujo (StreamError, unknown stream code)"
  - "ipc.CausaDesconexionDeTransporte (Disconnected, the ordinary transient websocket close)"
  - "ipc.CausaClienteObsoleto (ClientOutdated)"
  - "ipc.CausasDeclaradas() []string (enumerator mirroring TiposDeclarados(), stable order)"
  - "ipc.EstadosDeclarados() []string (enumerator of the four estado values, stable order)"
  - "canal.clasificarDesconexion (UNEXPORTED pure func: (evento any, ahoraMs int64) -> (desconexion, bool))"
  - "canal.proyectarEstado (UNEXPORTED pure func: causa string -> estado string, total over the closed vocabulary)"
  - "canal.desconexion (UNEXPORTED value object: Causa, Codigo, ExpiraEnMs)"
  - "canal.intervaloDeRetroceso (UNEXPORTED pure func: attempt + params -> time.Duration, clamped at the ceiling)"
  - "canal.Espera (injectable waiter seam: func(context.Context, time.Duration) error)"
  - "canal.SumideroDeEstado (injectable sink seam: func(ipc.EstadoSesion))"
  - "canal.Supervisor / canal.NuevoSupervisor (Application Service owning retry attempts and estado transitions)"
  - "configuracion.Retroceso (Value Object: IntervaloInicial, Factor, IntervaloMaximo, BaneoInicial, BaneoMaximo)"
  - "configuracion.VariableRetrocesoInicialMs / VariableRetrocesoFactor / VariableRetrocesoMaximoMs"
  - "configuracion.VariableRetrocesoBaneoInicialMs / VariableRetrocesoBaneoMaximoMs"
  - "configuracion.ErrRetrocesoInvalido (rejects non-numeric, zero or inverted ceiling values)"

