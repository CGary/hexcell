task_id: HEX-013
summary: >-
  Sidecar disconnection taxonomy and reconnection backoff with a temporary-ban pause, plus IPC
  document v1.2 / wire 3 adding the pausada estado and closing the causa vocabulary.

goal: >-
  Deliver A-3 tasks 6 and 7 as one unit, sidecar side only. Implement the disconnection taxonomy as a
  PURE UNEXPORTED classifier over whatsmeow events, with every variant instrumented separately and
  projected onto a session estado that travels ALONGSIDE the raw causa, never in its place. Implement
  reconnection with exponential backoff and a real ceiling, a distinct logged record of every retry
  attempt and every estado transition, and a clear split between a transient error and an invalid
  session. Add a separate temporary-ban branch that moves the cell to the new pausada estado under
  long backoff toward the declared expiry with NO automatic reactivation: returning to service
  requires a human-initiated process restart, guaranteed by construction because no code path and no
  IPC message can do it. Raise docs/protocolo-ipc-nucleo-sidecar.md to version 1.2 dated 2026-08-05
  with wire version 3, adding pausada to the estado enum and closing the causa vocabulary the
  document itself deferred to this task. The closed message-type set STAYS AT NINE. The Rust
  core-side consumer is A-3 task 10 and is out of scope. Everything is written in Spanish.

read:
  - .ai/tasks/active/HEX-013-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-013-new-spec/01-blueprint.yaml
  - docs/protocolo-ipc-nucleo-sidecar.md
  - docs/plan/fase-a-3-adaptador-whatsmeow.md
  - docs/adr/README.md
  - docs/adr/adr-0010-puerto-de-canal.md
  - docs/adr/adr-0015-politica-de-convivencia-con-el-baneo.md
  - docs/adr/adr-0019-registro-estructurado.md
  - docs/adr/adr-0020-respaldo-y-restauracion-por-celula.md
  - docs/bitacora-de-descartes.md
  - docs/runbook-restauracion-de-celula.md
  - docs/STATUS.md
  - sidecar/internal/ipc/mensajes.go
  - sidecar/internal/ipc/mensajes_test.go
  - sidecar/internal/ipc/documento_test.go
  - sidecar/internal/canal/canal.go
  - sidecar/internal/canal/canal_test.go
  - sidecar/internal/canal/almacen_interno_test.go
  - sidecar/internal/configuracion/configuracion.go
  - sidecar/internal/outbox/outbox.go
  - sidecar/internal/registro/registro.go
  - sidecar/internal/registro/registro_test.go
  - sidecar/main.go
