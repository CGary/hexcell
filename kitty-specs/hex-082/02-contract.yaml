task_id: HEX-082
summary: >-
  Real cell terminate in hexcell-admin plus the channel-agnostic POST /admin/sesion/cierre route on
  the core. Destructive and irreversible: abort before destroying anything.
goal: >-
  Replace the NoImplementadoTodavia stub of `cell terminate --id <id> --confirmar` with a real,
  strictly ordered, abort-on-first-failure sequence, and give the core the route that sequence needs.
  On the core: crates/hexcell/src/admin.rs gains POST /admin/sesion/cierre, WITHOUT authentication -
  its Spanish doc comment states that the security boundary is the cell's internal network, exactly
  like /admin/ingesta - answering 200 {"resultado":"completado"} on a completado acuse, 502
  {"resultado":"fallido","motivo":...} on a fallido acuse, and 504 when no acuse arrives within the
  deadline. admin.rs stays channel-agnostic: the route calls a seam (a boxed async closure held in a
  OnceCell) that main.rs registers from the Whatsmeow branch using a NEW cloneable AsaDeSesion handle
  taken from the adapter BEFORE Motor::nuevo consumes it; that handle sends the already existing wire
  6 `orden_cierre_de_sesion` with motivo "cell terminate" and awaits `acuse_cierre_de_sesion`. The
  wire format does not change and the sidecar is not touched. deploy/cell.compose.yml must set
  HEXCELL_DIRECCION_ADMIN=0.0.0.0:8082 on the nucleo service, because the admin listener defaults to
  loopback and a sibling container could otherwise never reach the route. On the CLI:
  ciclo_de_vida::retirar inspects nucleo then sidecar, resolves the volume name from the core's
  Mounts[].Name for /var/lib/hexcell (never by convention), aborts with the exact pause literal if the
  core is not running, POSTs the close through an alpine:3 sibling container inside the cell network
  with `wget -q -O - --post-data ''` and aborts destroying NOTHING if that container exits non-zero,
  then stops sidecar and nucleo reusing the same no-deadline stop as `cell pause`, removes both
  containers and removes the volume, printing three stdout lines and exiting 0. Idempotence is task
  15, persisting the Retirada state is task 14, the forced-terminate variant for banned devices is a
  written follow-up on task 15. No new CLI flag, no new exit code, no new dependency.
