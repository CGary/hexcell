task_id: HEX-037
summary: Add a std-only per-key RegistroDeAdmision to hexcell-core::admision and call it as the
  first step of Motor::procesar_evento, so GCRA gates every channel-port event before context/inference.
goal: 'Deliver stage A-4 task 2 (docs/plan/fase-a-4-admision-presupuesto.md), covering FR-08 of
  docs/PRD.md: integrate the already-merged GCRA primitives from HEX-036
  (crates/hexcell-core/src/admision.rs) into the core''s consumption of the normalized
  channel-port event flow. A per-key registry maps one limiting key (the conversation id) to one
  Gcra instance, and the admission check runs as the very first step of
  Motor::procesar_evento, strictly before deduplication, conversational-context loading and the
  inference call, so a discarded event does no further processing work. Provisional
  ConfiguracionGcra::default() only; env-var parametrization (task 3), discard logging (task 4)
  and the concurrency semaphore (task 5) are explicitly out of scope.'
read:
  - .ai/tasks/active/HEX-037-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-037-new-spec/01-blueprint.yaml
  - crates/hexcell-core/src/canal.rs
  - crates/hexcell/src/procesador.rs
  - crates/hexcell/tests/motor.rs
  - crates/hexcell/tests/inferencia.rs
  - crates/hexcell/tests/comun/mod.rs
  - docs/plan/fase-a-4-admision-presupuesto.md
  - docs/PRD.md
  - docs/adr/adr-0002-estructura-workspace.md
touch:
  - crates/hexcell-core/src/admision.rs
  - crates/hexcell/src/motor.rs
  - crates/hexcell/tests/admision.rs
forbid:
  files:
    - docs/PRD.md
    - docs/adr/README.md
    - docs/STATUS.md
    - docs/bitacora-de-descartes.md
    - Cargo.toml
    - Cargo.lock
    - crates/hexcell-core/Cargo.toml
    - crates/hexcell/Cargo.toml
    - crates/hexcell-admin/Cargo.toml
    - crates/hexcell-storage/Cargo.toml
    - crates/hexcell-meta/Cargo.toml
    - crates/hexcell-canal-simulado/Cargo.toml
    - crates/hexcell-canal-contrato/Cargo.toml
    - crates/hexcell-canal-whatsmeow/Cargo.toml
    - crates/hexcell-core/src/lib.rs
    - crates/hexcell-core/src/canal.rs
    - crates/hexcell-core/src/identidad.rs
    - crates/hexcell-core/src/inferencia.rs
    - crates/hexcell/src/main.rs
    - crates/hexcell/src/procesador.rs
    - crates/hexcell/src/configuracion.rs
    - crates/hexcell/tests/motor.rs
    - crates/hexcell/tests/persistencia.rs
    - crates/hexcell/tests/respaldo_y_restauracion.rs
    - crates/hexcell/tests/continuidad_de_hilo.rs
    - crates/hexcell/tests/deduplicacion.rs
    - crates/hexcell/tests/inferencia.rs
    - crates/hexcell/tests/politica_fuera_de_ventana.rs
    - crates/hexcell/tests/rss_linea_base.rs
    - crates/hexcell-canal-simulado/src/adaptador.rs
    - crates/hexcell-canal-whatsmeow/src/adaptador.rs
    - crates/hexcell-canal-whatsmeow/src/mensajes.rs
    - crates/hexcell-canal-contrato/src/bateria.rs
    - crates/hexcell-canal-contrato/src/banco.rs
    - sidecar/main.go
    - sidecar/go.mod
    - sidecar/go.sum
  behaviors:
    - Do NOT add any new Cargo dependency, dev-dependency, workspace dependency, or Cargo
      feature anywhere. hexcell-core's dependency table must stay empty (adr-0002); the new
      registry imports only std::sync::Mutex, std::collections::HashMap and std::sync::Arc.
    - Do NOT change the public signature of Motor::nuevo. RegistroDeAdmision is constructed
      internally inside Motor::nuevo from ConfiguracionGcra::default(); it is not a new
      constructor parameter. All 8 existing call sites (crates/hexcell/src/main.rs and the 7
      files listed in forbid.files under crates/hexcell/tests/) must keep compiling unmodified.
    - Do NOT hold RegistroDeAdmision's Mutex while calling Gcra::admitir(). The lock may only
      guard HashMap lookup/insert; clone the Arc<Gcra>, drop the guard, then call admitir() on
      the clone outside the lock, so the per-key admission decision stays lock-free.
    - Do NOT place the admission check anywhere in Motor::procesar_evento other than as its very
      first statement -- before the "evento_recibido" log, before RegistroDeDeduplicacion,
      before EstadoDeConversaciones::registrar_entrante/historial, and before
      ProcesadorDeMensajes::procesar. On ResultadoDeAdmision::Descartado, return immediately.
    - Do NOT add discard logging, tracing, metrics, or any crate::registro wiring for the
      discard path (stage A-4 task 4, out of scope). Returning early on
      ResultadoDeAdmision::Descartado is sufficient for this task.
    - Do NOT add environment-variable parametrization, a CLI flag, or a docs/adr/*.md file for
      GCRA parameters (stage A-4 task 3, out of scope). Use ConfiguracionGcra::default() as-is.
    - Do NOT implement the Tokio concurrency semaphore or any two-phase LLM budget/balance
      accounting (stage A-4 tasks 5 and 7-13, out of scope).
    - Do NOT introduce any HTTP or transport-specific type into admision.rs, RegistroDeAdmision,
      or the Motor::procesar_evento call site.
    - Do NOT change Gcra's or ConfiguracionGcra's existing public API beyond adding
      RegistroDeAdmision alongside them in the same file.
    - 'Do NOT delete, weaken, or silently reinterpret any existing test under
      crates/hexcell/tests/*.rs or crates/hexcell-core/src/admision.rs''s existing #[cfg(test)]
      module. New coverage belongs in the new crates/hexcell/tests/admision.rs file and in new
      #[cfg(test)] functions appended to admision.rs.'
    - 'Tests must discriminate (LES-036): the burst-excess integration test must assert an exact
      admitted count (e.g. exactly 4 of 5 injected same-conversation events reach send/history),
      never a loose "at least one was discarded" check, so that a stub which always admits fails
      the test.'
    - Do NOT write any code, comment, doc-comment, or commit message in a language other than
      Spanish; conventional commits without AI attribution.
    - Do NOT version *.db, *.db-wal, *.db-shm, or .env* files.
verify:
  commands:
    - cargo build --workspace
    - cargo test --workspace
    - cargo fmt --check
    - cargo clippy --workspace -- -D warnings
acceptance:
  human_gate: true
limits:
  max_files_changed: 3
  max_diff_lines: 480
  per_class:
    - glob: crates/hexcell-core/src/admision.rs
      max_diff_lines: 220
    - glob: crates/hexcell/src/motor.rs
      max_diff_lines: 50
    - glob: crates/hexcell/tests/admision.rs
      max_diff_lines: 260
execution:
  mode: worktree_edit
  branch: ai/HEX-037
retry_policy:
  max_attempts: 2
  escalate_after: 2
