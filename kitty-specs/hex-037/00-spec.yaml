task_id: HEX-037
summary: Wire the merged GCRA admission module into the channel-port event-consumption path, discarding excess events before deserialization or context loading. Risk medium.
goal: >
  Stage A-4, task 2 of docs/plan/fase-a-4-admision-presupuesto.md. Integrate the
  already-merged GCRA admission primitives (Gcra<R: Reloj>, ConfiguracionGcra,
  ResultadoDeAdmision, MotivoDescarte from HEX-036, crates/hexcell-core/src/admision.rs)
  into the core's consumption of the normalized channel-port event flow. Introduce a
  per-key registry that maps one limiting key (the conversation id as normalized by the
  channel port) to one Gcra instance, and call the admission check as the very first step
  of event consumption, strictly before any heavy deserialization or conversational-context
  loading, so that a discarded event allocates no processing memory. This satisfies FR-08
  (GCRA admission control operating on the normalized port flow, not on HTTP).
invariants:
  - GCRA admission is evaluated on every channel-port event before any heavy deserialization or conversational-context loading occurs for that event.
  - One Gcra instance corresponds to exactly one limiting key (conversation id normalized by the channel port); the registry never shares one instance across two distinct keys nor creates two instances for the same key.
  - An admitted event (ResultadoDeAdmision::Admitido) flows unchanged through the rest of the consumption path.
  - A discarded event (ResultadoDeAdmision::Descartado) short-circuits before context loading and before the inference call; it never reaches ProcesadorDeInferencia.
  - hexcell-core keeps its empty external-dependency table per adr-0002; any synchronization or map structure needed for the per-key registry either lives in the consuming crate (hexcell) or uses only std-only synchronization inside hexcell-core.
  - The admission module remains transport-free; no HTTP or transport-specific type is introduced into admision.rs or its call site as part of this integration.
acceptance:
  - id: AC-1
    statement: An admitted channel-port event is processed through the existing consumption path unchanged, with no observable difference versus the pre-integration behavior.
    given: a channel-port event whose limiting key is under the configured GCRA rate/burst
    when: the event is consumed by the core's event-consumption path
    then: the event proceeds to context loading and inference exactly as before this integration
  - id: AC-2
    statement: An excess channel-port event is discarded by the GCRA admission check before conversational-context loading, observable via the simulated channel / existing test harness.
    given: a channel-port event whose limiting key has exceeded the configured GCRA rate/burst
    when: the event is consumed by the core's event-consumption path
    then: the admission check returns ResultadoDeAdmision::Descartado and the event never reaches context loading or the inference call, verified by an integration test using the simulated adapter
  - id: AC-3
    statement: The admission check is demonstrably positioned upstream of deserialization and context loading, either by a test that proves no context-loading side effect occurs on discard, or by an explicit code-position assertion covering this ordering.
    given: the integrated consumption path
    when: reviewing the call order or running the discard-path test
    then: the GCRA admission check executes before any heavy deserialization or conversational-context loading call
  - cargo build --workspace and cargo test --workspace pass, including the new integration tests for the admission wiring.
  - cargo fmt --check and cargo clippy --workspace -- -D warnings are clean.
  - FR-08 is cited in the resulting code/doc comments as the requirement this integration satisfies.
risk: medium
non_goals:
  - Environment-variable parametrization of GCRA rate/burst/key granularity and its ADR (stage task 3); this integration uses ConfiguracionGcra::default() as a provisional configuration.
  - Discard log instrumentation with key, timestamp, and reason (stage task 4); returning ResultadoDeAdmision::Descartado to the caller is sufficient for this task. The stage-level "todo descarte queda registrado" acceptance criterion is explicitly deferred to task 4.
  - The Tokio concurrency semaphore (stage task 5).
  - Two-phase financial budget accounting (reservation/reconciliation) and the real inference provider client.
  - Any sidecar/Go changes.
  - Any HTTP-facing code, middleware, or Fast-Reject pattern (out of scope in Fase A per the plan; reserved for stage B-1).
constraints:
  - All content (code comments, docs, commit messages) in Spanish; conventional commits without AI attribution.
  - Never version *.db, *.db-wal, *.db-shm, or .env* files.
  - Hexagonal discipline is mandatory - the core consumes only the normalized channel-port event flow ("GCRA sobre el flujo normalizado del puerto, no sobre HTTP"); no channel-transport type may leak into the admission call site.
  - Do not modify the public API of admision.rs unless strictly necessary; if a small addition is required, it must remain transport-free and be recorded as a spec-level note for the blueprint to pick up.
  - hexcell-core's dependency table must remain empty per adr-0002; any new synchronization primitive for the per-key registry must be std-only in hexcell-core, or the registry itself must live in the consuming crate (hexcell).
  - "Base commit: HEX-036 merged at ba93f47; this task builds on top of it in the existing 5-crate workspace (core binary crate hexcell wires Motor + ProcesadorDeInferencia; channel-port types live in hexcell-canal*)."
