test_scenarios:
    - covers:
        - AC-1
      statement: A backup fired while the cell is running produces exactly three files in the destination directory, named sessions.db, knowledge_live.db and adapter_identity.db, each of them non-empty and each opening as a valid SQLite database.
    - covers:
        - AC-1
      statement: Every one of the three copies passes PRAGMA integrity_check with the value ok read over a read-only connection, and its PRAGMA user_version equals the schema version its origin declares, which VACUUM INTO preserves.
    - covers:
        - AC-1
        - AC-2
      statement: With the engine concurrently consuming a burst of injected events, the backup completes, no VACUUM INTO returns an error whose SQLite code is SQLITE_BUSY, and every event injected before, during and after the backup is still answered through send.
    - covers:
        - AC-2
      statement: After a backup taken while the writer is active, the source sessions.db is still writable and readable, the vitality probes of both pools still report Sana, and the backup neither truncated nor removed the -wal file of sessions.db.
    - covers:
        - AC-1
      statement: A backup into a directory that does not exist, and a backup into a directory that already holds a file with one of the three canonical names, both fail with their own named error variant and leave no partial copy behind, because VACUUM INTO refuses an existing destination.
    - covers:
        - AC-5
      statement: The adapter identity store maps a contact to an internal conversation identifier that survives closing and reopening the store, and re-pairing the adapter with a different device leaves every mapping intact.
    - covers:
        - AC-5
        - AC-6
      statement: The internal identifier the store assigns depends on the order in which contacts were first seen, so a store rebuilt from scratch would hand the second contact a different identifier than the restored store does; the cycle test relies on that to make its assertion non-vacuous.
    - covers:
        - AC-5
        - AC-7
      statement: Full cycle in one isolated test - a cell processes events over a temporary data directory, the three bases are backed up into a second temporary directory outside it, the copies are restored into a third clean directory, a new cell instance starts against the restored files, a new event is injected from a previously known contact, and the reply is emitted through send carrying the same internal conversation identifier the original cell used.
    - covers:
        - AC-5
      statement: The event injected after the restore is persisted into the restored sessions.db, and the history read back from it contains both the entries that came from the backup and the new one, in order.
    - covers:
        - AC-6
      statement: Negative probe - the same restored environment, with the engine deliberately not consuming the port, is fed to the same verification helper; the helper reports the failure reason of no reply through the port even though the restored history is verifiably present, so file presence alone can never be reported as a successful restore.
    - covers:
        - AC-3
        - AC-10
      statement: The sqlstore IPC contract document exists, carries an explicit contract version and the absolute date 2026-07-30, and states the trigger message, that the sidecar process itself runs VACUUM INTO over its own connections, the high frequency of every few hours rather than daily, and the destination of the copy.
    - covers:
        - AC-3
        - AC-10
      statement: The diff contains no real IPC client or server - no Unix socket type, no serialisation crate, no process spawn under any src directory - so the contract is written and versioned but not executed.
    - covers:
        - AC-4
      statement: The restore runbook exists, covers the four bases, and confronts its two branches before touching the sqlstore, each with its reasoning - LoggedOut with device_removed does not restore the sqlstore and goes straight to re-pairing by PairPhone, any other cause restores the backup.
    - covers:
        - AC-8
        - AC-9
      statement: cargo fmt --check, cargo clippy --workspace --all-targets -- -D warnings and cargo test --workspace all finish clean, and crates/hexcell-core still resolves to exactly one node in cargo tree with an empty dependency table.
    - covers:
        - AC-10
      statement: No backup copy, temporary directory or database file is left behind by any test or tracked by git, and no API key, remote backup destination or STATUS.md wording closing stage A-2 appears in the diff.
