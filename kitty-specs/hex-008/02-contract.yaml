goal: |
    Turn A-2 plan tasks 13, 14 and 16 into code and documentation on top of what HEX-007 left on main.
    FOUR pieces land, and the first of them is the one the spec does not know it is asking for.

    ONE, THE THIRD BASE HAS TO BE MADE BEFORE IT CAN BE BACKED UP. The spec asks for a VACUUM INTO of
    the adapter identity store against the already open SQLite pools. Verified on 2026-07-30: that
    store is a HashMap<String, IdConversacion> in the field contactos of EstadoInterno in
    crates/hexcell-canal-simulado/src/adaptador.rs. There is no file, no pool and no schema behind it,
    so there is nothing to copy and AC-5 could not be satisfied either. adr-0010 already decided that
    the mapping persists in a store of the adapter's own, separate from the sqlstore, so this
    implements adr-0010 rather than widening the spec. Add AlmacenDeIdentidad in
    crates/hexcell-storage/src/almacen_de_identidad.rs over its own file adapter_identity.db, opened
    like PoolDeSesiones (one read-write connection, one read-only connection, each behind a Mutex, both
    through aplicar_parametros_de_conexion), with its own migration and its own user_version. It stores
    TWO OPAQUE TEXT COLUMNS - contacto as primary key, identificador_interno - and never names
    IdConversacion: minting stays in the adapter, which is where adr-0010 puts identity translation and
    where HEX-007's standing check expects it. The adapter derives the new identifier from the stored
    COUNT, so identifiers depend on the order of first sight; that is what stops the restore assertion
    from being one an empty store would also satisfy.

    TWO, THE BACKUP ITSELF. crates/hexcell-storage/src/respaldo.rs runs VACUUM INTO with the
    destination path BOUND AS A PARAMETER (verified: VACUUM INTO ?1 accepts a bound parameter) and then
    verifies each copy by opening it read-only and asserting PRAGMA integrity_check = ok and PRAGMA
    user_version equal to the origin's schema version, which VACUUM INTO preserves. EVERY copy is taken
    from a READ connection: sessions.db through PoolDeSesiones::con_lectura, knowledge_live.db through
    PoolDeConocimiento::con_lectura, the identity store through its own read-only connection. Verified
    on 2026-07-30 with sqlite3 3.53.4 and -readonly: VACUUM INTO succeeds on a read-only connection,
    unlike PRAGMA wal_checkpoint, which HEX-007 verified fails there. Under WAL a reader never blocks
    the writer and the engine's hot path is all writes, so no SQLITE_BUSY and no interruption. The
    destination is an EXISTING directory into which the three copies go under their CANONICAL names;
    an already occupied destination is a named error checked before the first copy, because VACUUM INTO
    refuses to overwrite. crates/hexcell/src/respaldo.rs orchestrates the three and emits the log lines.
    There is NO scheduler, NO HTTP route and NO CLI subcommand: nothing in the spec or in plan task 13
    asks for one, the shutdown path belongs to HEX-007 and is off limits, and scheduling is A-6.

    THREE, TWO DOCUMENTS. docs/contrato-ipc-respaldo-del-sqlstore.md fixes the trigger message, that the
    SIDECAR PROCESS ITSELF runs VACUUM INTO over its own connections, the every-few-hours frequency and
    the destination - written and versioned, never executed, with no IPC client or server anywhere in
    the diff. docs/runbook-restauracion-de-celula.md covers the four bases and confronts its two
    branches before touching the sqlstore: LoggedOut with device_removed does not restore it and
    re-pairs by PairPhone(), any other cause restores the backup.

    FOUR, THE TESTS THAT MAKE THE CLAIM REAL. A full in-process cycle over three separate temporary
    directories - process events, back up, restore into a clean one, start a second cell, inject and
    assert the reply carries the identifier the first run assigned - plus the negative probe with the
    same helper, where restored history is present but the cell does not answer and the helper reports
    failure. One ADR, adr-0020, and two new discards, D-19 and D-20. Nothing marks stage A-2 as closed.
