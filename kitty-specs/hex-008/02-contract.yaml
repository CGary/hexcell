acceptance:
    human_gate: true
execution:
    branch: ai/HEX-008
    mode: worktree_edit
forbid:
    behaviors:
        - 'Do not try to back up the adapter identity store without first creating it. The spec says to VACUUM INTO it against the already open pools; verified on 2026-07-30, it is the in-memory field contactos: HashMap<String, IdConversacion> of EstadoInterno in crates/hexcell-canal-simulado/src/adaptador.rs and there is no file behind it. Do not fake the third copy by serialising that map to a file with your own format, do not skip it and report two copies, and do not rewrite 00-spec.yaml, which belongs to the human. Create AlmacenDeIdentidad over a real SQLite file named adapter_identity.db under the cell data path, with its own migration and its own user_version, which is what adr-0010 already decided. This is RISK-1 in the blueprint.'
        - 'Do not let AlmacenDeIdentidad know what an IdConversacion is. It stores two opaque TEXT columns - contacto as PRIMARY KEY and identificador_interno - and its API speaks String: buscar(contacto) -> Option<String>, registrar(contacto, identificador_interno) as an idempotent INSERT OR IGNORE, contactos_registrados() -> i64. Do not import hexcell_core into crates/hexcell-storage/src/almacen_de_identidad.rs and do not construct IdConversacion or IdRemitente anywhere under crates/hexcell-storage/src/ or crates/hexcell/src/. adr-0010 puts identity translation in the ADAPTER and the core treats the identifier as opaque; a storage layer that minted identifiers would be a second translator, and two pieces that translate the same thing diverge without anyone noticing until both have written data.'
        - Do not derive the new internal identifier from the contact name. Today the adapter does exactly that, with a deterministic format, which means a cell started against an EMPTY identity store would hand out the same identifier as a correctly restored one - so the AC-5 assertion would pass whether or not the restore worked, and the test could not fail. Mint it from the count already stored (contactos_registrados), so identifiers depend on the ORDER of first sight, and make the cycle test register at least two contacts in a known order and assert on the SECOND. This is RISK-8 and it is the difference between AC-5/AC-6 meaning something and being decoration.
        - 'Do not change AdaptadorSimulado::nuevo and do not thread the store through every constructor. Keep nuevo(reloj, capacidad) byte-compatible and add nuevo_con_almacen(reloj, capacidad, Arc<AlmacenDeIdentidad>); turn the contactos field into an enum with an EnMemoria variant holding today''s HashMap and a Persistente variant holding the Arc, and branch only inside inyectar_desde_contacto. The store is shared by Arc and not owned, because Motor takes ownership of the adapter and the backup still needs the store afterwards. Do not add a second injection method that duplicates the logic: one method, one branch.'
        - 'Do not hold the adapter Mutex or a SQLite connection across an await. The SQLite work of inyectar_desde_contacto goes inside the existing non-async block that already ends before self.remitente_eventos.send(evento).await, exactly as the current code builds the event. clippy::await_holding_lock is an error under -D warnings and it is right: a connection held across an await in a current_thread runtime stalls the whole cell. Do not silence it with an allow attribute.'
        - 'Do not flatten the new failure mode into the old error. inyectar_desde_contacto returns Result<IdConversacion, ErrorDeInyeccion> with variants Envio(SendError<EventoEntrante>) and Almacen(ErrorDeAlmacen), deriving Debug and implementing Display and std::error::Error. There are seven call sites (crates/hexcell/src/main.rs, crates/hexcell/tests/continuidad_de_hilo.rs twice, crates/hexcell-canal-simulado/tests/adaptador_simulado.rs four times) and all of them expect() or Display the error, so they compile unchanged. Do not map a storage failure onto SendError and do not swallow it into an Ok: a write to the identity store that silently failed is the exact corruption this task exists to catch.'
        - 'Do not run any VACUUM INTO from a write connection, and do not open a read-write connection to knowledge_live.db to make one possible. sessions.db is copied through PoolDeSesiones::con_lectura, knowledge_live.db through PoolDeConocimiento::con_lectura, the identity store through its own read-only connection. Verified on 2026-07-30 against sqlite3 3.53.4 with -readonly: VACUUM INTO SUCCEEDS on a read-only connection and the copy passes integrity_check, because it is a read - the exact opposite of PRAGMA wal_checkpoint, which HEX-007 verified fails with a disk I/O error on the same kind of connection. Using con_escritura would serialise the backup behind the hot writer, which is the interruption AC-1 forbids; a read-write knowledge connection would violate FR-05 and adr-0003 for no gain. This is RISK-4.'
        - 'Do not open a fresh connection of your own for the backup either. The spec constraint says the copy is made over the pools the process ALREADY has open, and reusing them also reuses their busy_timeout, synchronous and foreign_keys settings rather than quietly acquiring different ones. The cost - a concurrent historial() call waits behind the copy on the sessions read connection - is accepted and documented where the code is, because the engine''s hot path writes: procesar_deduplicacion, anotar_entrante and anotar_saliente all go through con_escritura. That is RISK-7.'
        - 'Do not interpolate the destination path into the VACUUM INTO statement. Verified on 2026-07-30: VACUUM INTO ?1 accepts a bound parameter, so bind it. A path built by format! into SQL is the one place in this crate where an outside value would reach a statement as text, and crates/hexcell-storage/src/migraciones.rs already documents that the only acceptable interpolation is a constant integer of the crate itself.'
        - 'Do not run VACUUM INTO inside a transaction and do not assume anything about the destination. Verified on 2026-07-30: it cannot run within an open transaction, it fails if the destination FILE already exists, and it fails if the destination''s parent DIRECTORY does not exist. So issue it on an autocommit connection, never wrapped in unchecked_transaction; take an EXISTING destination directory; write the three copies under their CANONICAL names sessions.db, knowledge_live.db and adapter_identity.db; and check all three for prior existence BEFORE the first copy, failing with a named error variant so no half-finished round is left behind. Canonical names are what make the runbook''s restore step a copy of three files.'
        - Do not name backup files from a clock. SystemTime::now stays banned across crates/hexcell/src/ and crates/hexcell-storage/src/, as HEX-005 fixed and HEX-007 kept, and Instant::now remains permitted only in motor.rs. Rotation, labelling and retention of destination directories belong to the operator and are written in the runbook, not derived inside the code. Do not add chrono, time or any date crate to any manifest to get around this.
        - 'Do not weaken the integrity verification into an existence check. Each copy is opened READ-ONLY and must satisfy two things before it counts: PRAGMA integrity_check returns the single value ok, and PRAGMA user_version equals the schema version its origin declares - verified on 2026-07-30 that VACUUM INTO preserves user_version. A copy that fails either one is an error with its own variant, not a warning. Do not use PRAGMA quick_check here and do not compare file sizes as a proxy for consistency.'
        - 'Do not assert that a copy comes back in WAL mode. Verified on 2026-07-30: the file VACUUM INTO produces is in journal_mode = delete even when the origin is in WAL. It self-heals on restore, because abrir_lectura_escritura issues PRAGMA journal_mode = WAL on every read-write open. Do not treat delete mode in a copy as corruption, do not add a step that rewrites the mode of a copy, and do not touch punto_de_control_de_wal or any other part of the HEX-007 shutdown path to make it look tidier.'
        - Do not add a scheduler, a timer, an HTTP route, an environment variable or a hexcell-admin subcommand to trigger the backup. Nothing in 00-spec.yaml or in task 13 of docs/plan/fase-a-2-nucleo-persistencia.md asks for one; the ordered shutdown belongs to HEX-007 and the spec's non-goals forbid reopening it; packaging, CLI and scheduling are stage A-6. respaldar_celula is a public library operation whose callers in this diff are the tests, and whose invocation by an operator or a future scheduler is described in the runbook. Write that deferral in adr-0020 and as a Pendiente in docs/STATUS.md so it reads as a decision instead of an omission. This is RISK-9 and closing it here is out of contract.
        - 'Do not let GestorDePools open the identity store. main.rs builds Arc<AlmacenDeIdentidad> from configuracion.ruta_datos right after the pools and before binding the health server, failing the same way the pools do - stderr plus ExitCode::FAILURE - and hands a clone to AdaptadorSimulado::nuevo_con_almacen. adr-0010 makes that store the adapter''s; folding it into the core''s pool manager would put the adapter''s identity file behind the core''s persistence. Do not add a new environment variable for its path: derive it from the already validated data path, exactly as sessions.db and knowledge_live.db are.'
        - 'Do not implement any part of the sqlstore IPC. No UnixStream, UnixListener or UnixDatagram anywhere under crates/; no serde, serde_json, prost, tonic, bincode, ipc-channel or interprocess in any manifest; no std::process::Command under any src/ directory; no client, server, socket path, retry loop or message struct for talking to a sidecar. The contract is a DOCUMENT. Prose is not the target of this ban: doc comments and the two new documents will and should say sqlstore, PairPhone and device_removed while explaining the boundary, and deleting that explanation to satisfy a word search would be the wrong fix. The ban is on machinery.'
        - Do not enable the rusqlite backup feature and do not use Connection::backup. The SQLite online backup API restarts its copy every time a writer commits, so under a hot writer it can make no progress, while VACUUM INTO takes one read snapshot, needs no extra feature and yields a defragmented single file. Record that rejection as D-19 in docs/bitacora-de-descartes.md, and the rejection of a periodic backup scheduler inside the cell process as D-20, each with its motive and its explicit reopen condition, both in the same commit that makes them, as CLAUDE.md requires.
        - Do not copy a live database file from outside the process that has it open, anywhere, and do not let the documents imply it is acceptable. That is the whole reason the sqlstore contract puts VACUUM INTO inside the sidecar. The runbook does copy backup FILES with an ordinary copy, and it must say why that is safe - they are quiescent - so nobody generalises the wrong lesson in either direction.
        - 'Do not add any crate to any manifest. The only manifest change permitted is adding the hexcell-storage PATH dependency to crates/hexcell-canal-simulado/Cargo.toml, with its one-line reason. Do not touch the root Cargo.toml, crates/hexcell/Cargo.toml or crates/hexcell-storage/Cargo.toml: every crate this task needs is already there. Do not hand-write, hand-edit or prune Cargo.lock; let cargo regenerate it and commit it verbatim, where the only change should be the dependency list of the hexcell-canal-simulado package.'
        - Do not give crates/hexcell-core a single dependency and do not put one line of this task in it. Its [dependencies] table stays empty and cargo tree -p hexcell-core keeps printing exactly one line; that is AC-9. Backup, restore, identity persistence and SQLite are infrastructure and belong in hexcell-storage; the core is not edited at all in this task.
        - Do not call unwrap(), expect(), panic!, unreachable! or todo! anywhere under crates/hexcell/src/, crates/hexcell-core/src/ or crates/hexcell-storage/src/. None of those directories contains one today, verified on 2026-07-30, and [profile.release] sets panic = "abort", so a panic in production leaves no usable message. New failure modes get named variants of ErrorDeAlmacen - a destination directory that is inaccessible, a destination already occupied, a copy that fails verification - each carrying the path it is talking about. crates/hexcell-canal-simulado/src/ keeps its existing expect() calls on its own Mutex and is NOT covered by this ban.
        - 'Do not let message content near the backup path. crates/hexcell/src/respaldo.rs may import crate::registro - it never sees message text - and emits respaldo_iniciado, respaldo_completado and respaldo_fallido with counts, byte sizes and paths only. It must not import EventoEntrante or MensajeSaliente, must not take one as a parameter and must not Debug-dump either. The typed field set of HEX-007 stays as it is: registro.rs is not edited.'
        - Do not test with a shared database, a fixed path, a real network call or a real sidecar. Every test builds its own temporary directory with the existing DirectorioTemporal helper and removes it on drop; the cycle test uses THREE separate ones - original data, backup destination, clean restore target - and the restore target must never be the original directory. No test binds a fixed port, none reaches beyond loopback, none spawns a sidecar process, and none calls a real inference provider, because none exists in this task.
        - 'Do not let the restore test pass on file presence alone. Factor the criterion into one helper returning Result<IdConversacion, MotivoDeRestauracionFallida> and use the SAME helper for both cases: the positive test asserts Ok and that the identifier equals the one the first run assigned to that contact, read from envios_capturados(); the negative test runs the same restored environment with the engine deliberately not consuming, asserts the helper reports the no-reply reason, AND separately asserts that the restored history IS present. Without that second assertion the negative test proves nothing. Do not make a temporal assertion pass by sleeping an arbitrary interval.'
        - 'Do not create adr-0021 or higher, do not renumber, reorder, retitle or edit any existing ADR row, and do not skip the check. The full table of docs/adr/README.md was read for this task: rows 0001 to 0019 are all assigned, none is reserved for backup or restore, and the remaining official-channel ADRs are deliberately unnumbered until adr-0013 is decided. Write ONE new ADR, adr-0020-respaldo-y-restauracion-por-celula.md, stating stage A-2, status Vigente and the absolute date 2026-07-30, and add exactly one row. Every other row stays byte-identical. adr-0010 in particular is NOT edited, even though it calls the identity store the cuarta base while this task''s spec calls the sqlstore the cuarta base: name the four bases explicitly in the new documents and avoid the ordinal instead of renumbering a Vigente ADR (RISK-2).'
        - 'Do not edit or renumber any existing entry of docs/bitacora-de-descartes.md. It is append-only by its own rules and runs to D-18 today: add D-19 and D-20 with their motives and explicit reopen conditions, add their two rows to the index table, refresh the last-updated line, and leave D-01 to D-18 untouched. A reopened discard would be marked REABIERTO rather than rewritten; none is reopened here.'
        - 'Do not write anything in docs/STATUS.md that marks etapa A-2 as closed, finished, cerrada, completada or terminada, and do not rewrite or delete any existing bullet. Add only new entries dated 2026-07-30 attributed to HEX-008: the backup with no production trigger in this stage, the identity store now persistent, the two new documents, and the still pending business decision on the real remote backup destination, which this task simulates with a second local directory and must not resolve.'
        - Do not invent a real remote backup destination. No S3 bucket, no rsync target, no host name, no cloud provider, no credential and no example endpoint, in code or in documentation. docs/STATUS.md lists it as a pending business decision and the tests simulate outside the disk with a second local directory. No API key, token, password or secret appears anywhere in the diff, not even as an example value.
        - 'Do not state or imply anywhere that Fase B replaces, substitutes or closes Fase A, or that the sidecar is retired or transitional. The own channel is the default and permanent channel and the sidecar is its permanent cost - which is precisely why its sqlstore is backed up every few hours rather than daily. Do not introduce mass-sender folklore (jitter, warm-up protocols, proxies, VPN, IP rotation): D-08 rejects it as a design principle.'
        - Do not write repository prose, doc comments, error messages or commit messages in English. Rust identifiers, crate names, SQL keywords and existing English identifiers stay as they are; the language rule governs prose. File names of the databases stay in English (sessions.db, knowledge_live.db, adapter_identity.db) for consistency with what is already on disk. Markdown prose and long comments keep the repository's ~100 column width. Every date written is absolute (2026-07-30), never relative.
        - Do not add Co-Authored-By or any AI-attribution trailer to any commit message. Conventional commits in Spanish only.
        - 'Do not commit any *.db, *.db-wal, *.db-shm or .env* file - .gitignore already covers them and must not be edited - and do not leave a temporary directory or a backup round behind: every test directory is removed on drop by the existing helper.'
