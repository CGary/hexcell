        - docs/STATUS.md
      notes:
        - D-19 (rusqlite online backup API rejected for VACUUM INTO) and D-20 (in-process backup scheduler rejected, scheduling belongs to A-6) appended with their motive and reopen condition, two new index rows, last-updated line refreshed; D-01 through D-18 untouched. STATUS.md gains one Definido entry (HEX-008, 2026-07-30) and two Pendiente entries (real remote backup destination; absence of a production trigger), no existing bullet edited or removed, and no wording anywhere marks stage A-2 as closed.
      verify_pending: false
