  - crates/hexcell-canal-whatsmeow/src/lib.rs
  - crates/hexcell-canal-whatsmeow/tests/cierre_de_sesion.rs
  - crates/hexcell-canal-whatsmeow/tests/comun/mod.rs
  - deploy/cell.compose.yml
  - CLAUDE.md
