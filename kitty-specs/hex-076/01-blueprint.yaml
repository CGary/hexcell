task_id: HEX-076
summary: Cell isolation test (plan task 17) - mutation-proven static guard on the compose template plus a live two-cell script exercising four cross-access vectors.
affected_files:
  - deploy/cell.compose.yml
  - deploy/verificar_aislamiento_estatica.sh
  - deploy/verificar_aislamiento.sh
  - .github/workflows/ci.yml
