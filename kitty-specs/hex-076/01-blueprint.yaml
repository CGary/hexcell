  - verificar_volumen_dedicado
  - verificar_sin_publicacion_de_puertos
  - verificar_todo
  - verificar_cruce_de_volumen
  - verificar_alcance_de_red
  - verificar_socket_ipc_ajeno
  - verificar_sin_puertos_publicados_en_vivo
dependencies:
  - deploy/verificar_senales.sh
  - deploy/verificar_endurecimiento.sh
  - deploy/verificar_apagado_ordenado.sh
  - deploy/celula.env.ejemplo
  - docs/PRD.md
