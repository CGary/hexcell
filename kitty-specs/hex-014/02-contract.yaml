task_id: HEX-014
summary: "Add sidecar identidad SQLite store (PN anchor, LID alias, provisional+merge) and canal Traductor building evento_entrante persisted to the outbox before an injected sink. Wire 3 frozen."
goal: >
  Implement stage A-3 task 9 in full and the incoming half of task 8. Create the new Go package
  sidecar/internal/identidad: a SQLite database in its OWN file on the cell volume
  (/var/lib/hexcell/identidad.db), physically separate from the sqlstore so a LoggedOut of any kind
  cannot take the contact mapping with it, holding two tables (identidad, direccion) that map a
  contact anchored on its phone-number JID — with the LID kept as an alias — to an OPAQUE
  crypto/rand internal identifier, and implementing the provisional / anchored / merged state
  machine with a deterministic oldest-wins survivor rule and an explicit refusal to merge on
  conflicting observations. Create sidecar/internal/canal/traduccion.go: a Traductor that filters
  incoming events.Message through a pure allow-list, extracts text, resolves the sender through the
  identity store, builds the existing wire-3 ipc.EventoEntrante with marca_temporal_ms taken from
  the incoming event, persists the encoded line to outbox.Persistir keyed by the same
  id_deduplicacion, and only then hands the value to an injected sink following the estado_sesion
  convention. Wire the whole chain in main.go with a new HEXCELL_RUTA_IDENTIDAD configuration
  variable, and update section 9 of docs/protocolo-ipc-nucleo-sidecar.md plus docs/STATUS.md to
  record that the acknowledgement half of task 8 is deferred to A-3 task 12. The IPC wire format,
  its version and its executable privacy guard are frozen.

