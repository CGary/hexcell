test_scenarios:
  - statement: "Abrir creates a database file at a path distinct from RutaSqlstore and applies the two-table schema (identidad, direccion) with its indices; reopening the same path is idempotent and preserves rows."
    covers: ["AC-1"]
  - statement: "construirDSN carries _pragma=foreign_keys(1), journal_mode(WAL), synchronous(FULL) and busy_timeout(5000), and never the mattn-only ?_foreign_keys=on syntax (internal test, mirrors outbox/pragmas_internos_test.go)."
    covers: ["AC-1"]
  - statement: "A generated internal identifier starts with \"ct-\", is 35 characters, is pure lowercase hex after the prefix, and two consecutive calls never collide; no character of the source JID or phone number appears in it."
    covers: ["AC-1", "AC-2"]
  - statement: "Resolver with only a PN mints an identity in estado anclada; Resolver with only an unknown LID mints an identity in estado provisional."
    covers: ["AC-1", "AC-3"]
  - statement: "Resolver called twice with the same PN returns the same IdInterno; Resolver called with (PN, LID) after a PN-only mint attaches the LID alias to the SAME identity without minting a second one."
    covers: ["AC-1", "AC-3"]
  - statement: "Merge preserves the OLDEST identity: when a provisional LID identity created first is later observed paired with a PN identity created second, the survivor is the provisional one (already emitted to the core), the younger is tombstoned with estado fusionada and fusionada_en pointing at the survivor, and both addresses resolve to the survivor's IdInterno."
    covers: ["AC-3"]
  - statement: "A lookup that lands on a tombstoned identity follows fusionada_en exactly one hop and returns the survivor; chains never exceed depth 1 because absorbing an identity repoints every row already pointing at it in the same transaction."
    covers: ["AC-3"]
  - statement: "Conflicting observation: a LID already bound to an identity holding PN p1 is observed paired with a different PN p2; the store does NOT rebind and does NOT merge, returns the identity resolved from the PN with ConflictoDeAlias true, and emits EventoConflictoDeAlias (internal test on the unexported merge path)."
    covers: ["AC-3"]
  - statement: "Concurrency: N goroutines call Resolver simultaneously with the same PN under -race; exactly one identity row exists afterwards and every goroutine received the same IdInterno (UNIQUE PRIMARY KEY on direccion plus INSERT ... ON CONFLICT DO NOTHING inside one transaction is the enforcement point)."
    covers: ["AC-1", "AC-3"]
  - statement: "DireccionDe returns the PN for an anchored identity and the LID for a provisional one, proving the internal-id -> JID reverse mapping the reply path (A-3 tasks 11-12) requires."
    covers: ["AC-1"]
  - statement: "A plain text events.Message from an unknown DM sender produces an ipc.EventoEntrante whose id_remitente and id_conversacion are the same opaque internal identifier, whose contenido is the message text, and whose marca_temporal_ms is Info.Timestamp.UnixMilli() and NOT the enqueue clock."
    covers: ["AC-2"]
  - statement: "The produced ipc.EventoEntrante round-trips through ipc.Codificar/ipc.Decodificar unchanged and its encoded line declares exactly the seven wire-3 fields, with no field added and version still 3."
    covers: ["AC-2", "AC-6"]
  - statement: "No value placed on any evento_entrante field contains '@', the s.whatsapp.net or lid server strings, or the digit run of the source phone number (mutation-proof privacy assertion over the translated value, complementing the field-name guard)."
    covers: ["AC-2", "AC-5"]
  - statement: "Persist-first ordering: a spy BuzonDurable and a spy sink record their call order; Persistir is always recorded before the sink, the string passed to Persistir equals the EventoEntrante.IdDeduplicacion, and when Persistir returns an error the sink is NEVER called (internal test)."
    covers: ["AC-4"]
  - statement: "The same events.Message delivered twice produces the identical IdDeduplicacion, and against a real *outbox.Outbox the second Persistir leaves exactly one row (ON CONFLICT DO NOTHING), proving stability across sidecar restarts."
    covers: ["AC-4"]
  - statement: "Filter allow-list: messages with IsFromMe true, IsGroup true, a chat server other than s.whatsapp.net or lid (broadcast, status, newsletter), Info.Edit non-empty, or a non-text body (image, sticker, reaction, location, document-with-caption) are all dropped — no outbox row, no sink call — and each drop logs EventoMensajeDescartado with a fixed reason and no JID."
    covers: ["AC-2", "AC-4"]
  - statement: "A text extraction that yields an empty string after trimming is dropped rather than emitted as an empty contenido."
    covers: ["AC-2"]
  - statement: "A ResolutorDeAlias returning an error (the ErrDeviceDeleted NoopStore case after any LoggedOut) is non-fatal: translation continues with a provisional identity and the message is still emitted."
    covers: ["AC-3"]
  - statement: "The existing ipc guard TestElEventoEntranteNoTransportaNingunIdentificadorDeTransporte still passes untouched over all nine declared types, and the count of declared types is still nine."
    covers: ["AC-5"]
  - statement: "docs/protocolo-ipc-nucleo-sidecar.md still contains sections 1, 2, 4 and 5 and the unchanged 1.2 -> 3 version row, so ipc/documento_test.go stays green after section 9 is edited."
