task_id: HEX-016
summary: "Gate MensajeSaliente behind a TestigoDeEntrante witness with a
  compile_fail doctest and a rejection counter, and add an AST-based Go sentinel
  guarding the sidecar's send-path absence."
goal: "Make the only-reply invariant a compile-time property: TestigoDeEntrante
  is obtainable only from a real EventoEntrante and gates the sole public path to
  a MensajeSaliente, whose variants become non_exhaustive struct variants so no
  other crate can build one by struct literal. Prove it with a compile_fail
  doctest paired with a positive doctest, back it with an exposed rejection
  counter exercised by a deliberate cross-conversation attempt, migrate every
  construction and match site across the workspace using the compiler as the
  net, and add a Go sentinel that fails if a send-shaped call appears anywhere in
  the sidecar outside sidecar/internal/outbox."
read:
  - .ai/tasks/active/HEX-016-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-016-new-spec/01-blueprint.yaml
  - crates/hexcell-canal-contrato/src/banco.rs
  - crates/hexcell-core/src/identidad.rs
  - crates/hexcell-core/Cargo.toml
  - sidecar/internal/outbox/outbox.go
  - sidecar/internal/ipc/documento_test.go
  - docs/adr/adr-0010-puerto-de-canal.md
  - docs/adr/README.md
  - CLAUDE.md
touch:
  - crates/hexcell-core/src/canal.rs
  - crates/hexcell-core/tests/testigo_de_entrante.rs
  - crates/hexcell/src/procesador.rs
  - crates/hexcell/src/motor.rs
  - crates/hexcell/src/conversaciones.rs
  - crates/hexcell-storage/src/sesiones.rs
  # Enmienda del orquestador (2026-08-09): el diseño SalienteHistorico aprobado por decisión
  # humana exige re-exportar el tipo desde la raíz del crate (+1/-1); el blueprint listó
  # sesiones.rs pero omitió el lib.rs del re-export. Evento contract_amendment en 07-trace.json.
  - crates/hexcell-storage/src/lib.rs
  - crates/hexcell-canal-simulado/src/adaptador.rs
  - crates/hexcell-canal-whatsmeow/src/adaptador.rs
  - crates/hexcell-canal-contrato/src/bateria.rs
  - crates/hexcell/tests/deduplicacion.rs
  - crates/hexcell/tests/continuidad_de_hilo.rs
  - crates/hexcell/tests/apagado_ordenado.rs
  - crates/hexcell/tests/motor.rs
  - crates/hexcell/tests/inferencia.rs
  - crates/hexcell/tests/persistencia.rs
  - crates/hexcell/tests/politica_fuera_de_ventana.rs
  - crates/hexcell/tests/respaldo_y_restauracion.rs
  - crates/hexcell-canal-simulado/tests/adaptador_simulado.rs
  - crates/hexcell-canal-whatsmeow/tests/contrato_del_puerto.rs
  - crates/hexcell-storage/tests/repositorio_de_sesiones.rs
  - sidecar/internal/outbox/centinela_rutas_de_envio_test.go
  - docs/STATUS.md
  - docs/bitacora-de-descartes.md
  - docs/adr/adr-0021-testigo-de-entrante.md
  - docs/adr/README.md
forbid:
  files:
    - crates/hexcell-canal-contrato/src/banco.rs
    - sidecar/internal/ipc/mensajes.go
    - docs/protocolo-ipc-nucleo-sidecar.md
    - crates/hexcell-core/Cargo.toml
    - Cargo.toml
    - sidecar/go.mod
    - sidecar/go.sum
    - .ai/tasks/active/HEX-016-new-spec/00-spec.yaml
  behaviors:
    - "Do NOT add any Cargo or Go dependency, dev-dependency or Cargo feature.
      trybuild is explicitly discarded by human decision; the compile_fail
      doctest is the only compile-failure mechanism in scope, and
      cargo tree -p hexcell-core must keep printing exactly one line."
    - "Do NOT use a TUPLE variant with #[non_exhaustive]. It was verified on
      rustc 1.92.0 that this makes the variant fully private (E0603) and
      unmatchable from other crates. Use struct variants:
      RespuestaLibre { texto: String } and Plantilla { id, parametros }."
    - "Do NOT ship the compile_fail doctest alone. Pair it with a positive
      doctest through the witnessed constructor, because the E0639 annotation is
      NOT enforced on stable rustc 1.92.0 and a doctest failing for an unrelated
      reason still reports ok. Neither doctest may be marked ignore or no_run."
    - "Do NOT add a public un-witnessed constructor, a Default impl, a
      From<IdConversacion>, or any 'rehidratar' / 'para_pruebas' escape hatch on
      MensajeSaliente or TestigoDeEntrante. Storage replay is solved with the
      storage-local SalienteHistorico type, not by reopening hexcell-core."
    - "Do NOT edit crates/hexcell-canal-contrato/src/banco.rs, and do NOT widen
      BancoDeCanal::inyectar_evento to return an EventoEntrante. bateria.rs must
      build its own local EventoEntrante to derive a witness."
    - "Do NOT touch the IPC wire (version 3): no message type, field or semantic
      change in sidecar/internal/ipc/mensajes.go or the protocol document."
    - "Do NOT implement the sidecar send path, TTL or retries. A-3 task 12 owns
      the outbound queue, and whatsmeow's send buffering into memory stays as it
      is."
    - "Do NOT write the Go sentinel as a raw text or regex grep over file
      contents. The sidecar's Spanish comments use enviar/envia throughout and a
      text matcher false-positives immediately; it must parse with go/parser and
      go/ast and match an explicit call-name allowlist, leaving IPC writes such
      as conn.Write and json Encode alone."
    - "Do NOT assert an absolute value of the rejection counter. It is a
      process-wide AtomicU64; assert deltas only, from the dedicated integration
      test file crates/hexcell-core/tests/testigo_de_entrante.rs."
    - "Do NOT delete, ignore, weaken or rewrite any existing test to make the
      migration compile. The existing suite is the regression net for AC-4."
    - "Do NOT write the sentinel so that A-3 task 12 must delete it. Task 12 must
      be able to extend the allowlist or the exempt directory in place; say so in
      the file's doc comment."
    - "All new identifiers, comments and doc comments in Spanish; dates in
      absolute form (2026-08-09). Register the trybuild discard as D-21 in
      docs/bitacora-de-descartes.md in this same change, and adr-0021 in the
      docs/adr/README.md table. Never state or imply that Fase B replaces,
      closes or supersedes Fase A, or that the sidecar is retired."
    - "Do NOT version *.db, *.db-wal, *.db-shm or .env* files, and do NOT add
      mass-sending folklore (jitter, warm-up, proxies, VPN, IP rotation)."
verify:
  commands:
    - cargo fmt --check
    - cargo build --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    - test "$(cargo tree -p hexcell-core | wc -l)" = "1"
    - cargo test -p hexcell-core --doc 2>&1 | grep -q "compile fail"
    - cd sidecar && go build ./... && go vet ./... && go test ./...
acceptance:
  human_gate: true
limits:
  max_files_changed: 26
  max_diff_lines: 2300
  per_class:
    - glob: crates/hexcell-core/src/canal.rs
      max_diff_lines: 420
    - glob: "**/tests/**"
      max_diff_lines: 950
    - glob: sidecar/internal/outbox/centinela_rutas_de_envio_test.go
      max_diff_lines: 260
    - glob: docs/*.md
      max_diff_lines: 80
    - glob: docs/adr/*.md
      max_diff_lines: 200
execution:
  mode: worktree_edit
  branch: ai/HEX-016
retry_policy:
  max_attempts: 2
  escalate_after: 2
