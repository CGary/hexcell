task_id: HEX-015
summary: "Add crates/hexcell-canal-whatsmeow: wire-3 Unix-socket IPC client implementing ChannelAdapter + CicloDeVidaSesion against a simulated sidecar; EstadoSesion, four-state ready, adr-0011. Wire 3 frozen."
goal: >
  Implement stage A-3 task 10. Create the new workspace crate crates/hexcell-canal-whatsmeow
  holding AdaptadorWhatsmeow: a Unix-domain-socket CLIENT (the sidecar listens, the core dials)
  speaking wire version 3 of docs/protocolo-ipc-nucleo-sidecar.md, implementing the
  hexcell-core ChannelAdapter trait and the CicloDeVidaSesion sub-trait. It performs the
  section-3 version handshake by strict integer equality and fails closed on mismatch, emits
  section-4 confirmacion keyed on id_deduplicacion and tolerates redelivery without minting new
  ids, reconnects per section 5 on deterministic injected backoff, and treats every section-8
  protocol error as a connection-closing event that never logs the raw line. Add serde and
  serde_json to the root workspace dependency table, each with a Spanish justification that
  explicitly reconciles the choice with adr-0019. Add the EstadoSesion enum (activa /
  reconectando / desvinculada / pausada) to crates/hexcell-core/src/canal.rs and widen
  crates/hexcell/src/preparacion.rs so GET /health/ready projects all four. Tests drive a
  simulated sidecar test double under the new crate's tests/comun/. Finally write
  docs/adr/adr-0011-whatsmeow-sidecar-e-ipc.md, flip its existing docs/adr/README.md row out of
  "Por escribir", and record it in docs/STATUS.md. Nothing under sidecar/ changes, the protocol
  document is not edited, and no version is bumped.

