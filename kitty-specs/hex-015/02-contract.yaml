  behaviors:
    - "Do NOT change the IPC wire. It stays at document 1.2 / wire version 3, the nine declared message types stay nine, and evento_entrante keeps exactly its seven fields. If the design seems to need a wire change, STOP and report it instead of bumping any version or adding a type."
    - "Do NOT edit docs/protocolo-ipc-nucleo-sidecar.md at all. Its section-9 bullet already points the parse decision at adr-0011 and stays accurate once the ADR exists. If you believe it must change, STOP and report it."
    - "Do NOT touch anything under sidecar/. The Go IPC socket server does not exist yet and is a separate future task (A-3 task 12 and beyond). This task is the Rust side only."
    - "Do NOT edit crates/hexcell-canal-contrato in any way to make the battery pass. If a battery scenario cannot pass against this adapter, that is a finding to report, not a file to change."
    - "Do NOT fabricate a 24-hour service window in the whatsmeow adapter. estado_ventana always answers Abierta and send never produces FueraDeVentana or PlantillaRequerida from its own policy. The TYPE admits the restrictive outcome; this adapter's POLICY does not produce it. Consequently the two temporal battery scenarios are out of reach: implement BancoDeCanal only, NOT BancoConRelojControlable, and justify the exclusion in a comment citing crates/hexcell-canal-contrato/src/banco.rs, which split the sub-trait for exactly this case."
    - "Do NOT let any JID, phone number, device identifier or push name reach hexcell-core state, a log line, or sessions.db. The ids arriving over IPC are ALREADY opaque (minted by the sidecar identity store in HEX-014) and must be passed through byte-for-byte; the adapter adds no transport identifier of its own and derives nothing from one."
    - "Do NOT mint a new deduplication id for a redelivered event, and do NOT reference an event by a per-connection sequence number anywhere. confirmacion carries the same id_deduplicacion string that arrived in evento_entrante. Deduplication stays the core's downstream responsibility."
    - "Do NOT negotiate, degrade or partially accept on a version handshake mismatch. Compare the integer for strict equality; on mismatch close the connection and surface BOTH versions."
    - "Do NOT log the raw offending line on a protocol error. Log the error kind and at most the offending field NAME: a raw line can contain message text (adr-0019). Every protocol error closes the connection; never resynchronise the stream or skip lines."
    - "Do NOT use an unbounded line reader. tokio's AsyncBufReadExt::read_line grows without limit; the reader must refuse any line exceeding 131072 bytes including the trailing newline and treat the excess as a protocol error. This is a memory-safety property in a process budgeted at 80 MB, not a formality."
    - "Do NOT model always-present wire fields as Option. Protocol rule 4 states every field is always present, with absence encoded as \"\" or 0. Use plain String and i64. Put #[serde(deny_unknown_fields)] on every message struct: rejecting unknown fields is protocol rule 3, mandatory."
    - "Do NOT lift the wire's causa, codigo or expira_en_ms fields into hexcell_core::canal::EstadoSesion. They are whatsmeow taxonomy and belong inside the adapter crate; putting them in the port would push transport knowledge into the core. Treat expira_en_ms as an ABSOLUTE Unix-ms instant, never a relative duration."
    - "Do NOT add a tokio dependency, or any dependency, to crates/hexcell-core. It stays tokio-free; crates/hexcell-core/Cargo.toml is a forbidden file. The adapter's async runtime usage lives entirely in the new crate."
    - "Do NOT add a method to the ChannelAdapter trait: hexcell-canal-simulado implements it and is a forbidden crate. Adding estado_sesion to CicloDeVidaSesion IS allowed, because no workspace type implements that sub-trait today."
    - "Do NOT add serde or serde_json without a written Spanish justification comment in the root [workspace.dependencies] table, matching the style of every existing entry. The comment MUST explicitly reconcile the addition with adr-0019, which rejected a serializer on the NFR-01 memory budget: that ruling governs EMITTING logs (registro.rs keeps hand-writing them and is a forbidden file), while this task PARSES hostile input at a trust boundary where contenido carries arbitrary user text. Do NOT supersede, edit or contradict adr-0019."
    - "Do NOT read the sidecar's HEXCELL_RETROCESO_* environment variables for the core's IPC backoff, and do NOT present any backoff number as calibrated. Those five variables govern the sidecar's own WhatsApp reconnection; the protocol assigns the core's IPC retry no variables and no values, and their calibration is an open decision in docs/STATUS.md. Take the parameters by injection with defaults documented as provisional, which is also what lets the reconnection tests run without sleeping on the wall clock."
    - "Do NOT put the simulated sidecar test double under src/. It is test scaffolding and lives in tests/comun/mod.rs, following crates/hexcell/tests/comun/mod.rs. It must be a LISTENER on a Unix socket, matching the real topology where the sidecar serves and the core dials - do NOT invert it."
    - "Do NOT add a temp-directory crate for test socket paths. Build them from temp_dir() and process::id(), the pattern crates/hexcell/tests/ and crates/hexcell-storage/tests/ already use."
    - "Do NOT append a new row to docs/adr/README.md. The adr-0011 row already exists with status \"Por escribir\"; edit that row's status cell only. The ADR numbering is the source of truth and is never reused or reordered."
    - "Do NOT introduce mass-sender folklore anywhere, including in the ADR prose: no jitter, no warm-up sequences, no proxies, no VPN, no IP rotation. All dates are absolute (2026-08-08), never relative."
    - "Do NOT implement out-of-scope work: no acknowledgements (sent/delivered/read/failed), no outbound queue, no Go IPC server, no only-reply-type enforcement in the type system, no STOP list, no behaviour discipline, and no test against a real WhatsApp number."
    - "All Rust identifiers, comments, doc comments, test names and documentation prose MUST be in Spanish, per repository convention. Conventional commit messages in Spanish with no AI attribution."
    - "Do NOT modify 00-spec.yaml, and do NOT run git merge."

