task_id: HEX-055
summary: 'FR-07 epoch promotion: seal-then-checkpoint staging, rename to epoch N, atomic symlink swap, ArcSwap pool swap with pre-warmed connections, drain seam for task 7, plus adr-0006.'
goal: 'Deliver stage A-5''s highest-risk task: the sequence that turns a validated knowledge_staging.db into the live epoch without ever exposing an in-flight reader to a half-written file. Six ordered steps, all decided: re-validate staging through leer_sonda_semantica (None aborts) and validar_integridad_del_indice (a rejection aborts), touching no file before both gates pass; seal with ONE UPDATE setting numero_de_epoca and sellada_ms together and THEN run PRAGMA wal_checkpoint(TRUNCATE), comparing its result row against (0,0,0) rather than assuming success; rename staging to knowledge_epoch_N.db where N comes from the highest existing epoch''s INTERNAL numero_de_epoca plus one, read from file contents and never parsed from a filename; reassign knowledge_live.db with the temporary-symlink-plus-rename POSIX idiom; store a pre-warmed replacement pool through ArcSwap and measure the swap-to-first-read interval against NFR-03''s 10 ms budget with a monotonic clock; and hand the superseded pool over ALIVE inside the drain seam that stage A-5 task 7 will build against. A defect here surfaces as silent data corruption days later, not as an error, which is why every gate is verified rather than trusted.'
