task_id: HEX-055
summary: Applied the five fix_tasks from 06-review.json (fix-loop pass) inside worktrees/HEX-055 on top of the existing promotion sequence implementation.
entries:
  - changed_files:
      - crates/hexcell-storage/src/promocion.rs
      - crates/hexcell-storage/src/error.rs
      - crates/hexcell-storage/tests/promocion.rs
    notes:
      - "Fix 1 (critical): replaced the two remove_file calls on staging's -wal/-shm companions in sellar_y_consolidar_staging with a verify-and-abort gate. If either companion still exists after drop(conexion), the function now returns Err(ErrorDeAlmacen::CompanieroDeStagingSobreviviente{ruta}) instead of deleting it, leaving staging intact for diagnosis."
      - "Fix 1 test: verificar_fix_wal_shm_sobreviviente_aborta_sin_borrar_ni_renombrar opens an external reader connection on staging (autocommit read, connection kept open) which keeps the -shm mapping alive even though the checkpoint itself reports full success (0,0,0); asserts the promotion returns the new error, staging still exists, and no epoch file was created."
      - "Fix 2 (critical): added a pre-rename existence check in reasignar_enlace_de_la_epoca_viva; if knowledge_epoch_N.db already exists at the computed target, aborts with the new Err(ErrorDeAlmacen::EpocaDestinoYaExiste{numero_de_epoca, ruta}) instead of letting POSIX rename silently overwrite it."
      - "Fix 2 test: verificar_fix_colision_de_epoca_destino_aborta_sin_sobrescribir plants a sentinel file at the computed epoch target before promoting; asserts the new error, and that both the existing epoch file (byte-identical) and staging survive."
      - "Fix 3: rewrote verificar_ac2_punto_de_control_incompleto_aborta_sin_renombrar. The old test only prepared a statement without stepping a row, so no real read snapshot was taken and the busy branch never ran. The new version steps a real row (filas.next()) to hold a genuine snapshot across the wal_checkpoint(TRUNCATE) call, asserts the outcome is exactly Abortada{PuntoDeControlIncompleto}, asserts the negative (staging exists, knowledge_epoch_1.db does not), then releases the reader and asserts a retry promotes cleanly."
      - "Fix 3 mutation proof: temporarily changed the (0,0,0) equality gate in sellar_y_consolidar_staging to `if false`; the rewritten test then failed (surfacing via the new Fix-1 companion-survives error, since the checkpoint no longer aborts and the blocking reader keeps -wal alive), proving the test is load-bearing; reverted the gate and confirmed the test (and the full suite) passes again."
      - "Fix 4: bound the previously discarded `let _cuenta` liveness read as `cuenta` and added a debug_assert_eq! against a named constant CONTEO_ESPERADO_DE_METADATOS_DE_CONOCIMIENTO (0, since that table is never populated). Also changed the non-finite duracion_ms fallback from 0.0 (looks perfect) to f64::INFINITY (surfaces as anomalous and fails the existing is_finite() assertion instead of hiding the anomaly). Test verificar_ac7_ac8_ac9_apertura_explicita_drenaje_vivo_y_latencia_nfr03 now also reads the new pool inside the test and asserts the expected count (0) alongside the sub-10ms bound."
      - "Fix 5: implemented five previously-declared-but-missing blueprint scenarios in tests/promocion.rs: (1) verificar_lector_previo_a_la_conmutacion_sigue_sirviendo_el_inodo_viejo - a reader opened before a second promotion keeps serving the old epoch's data after the symlink repoints; (2) verificar_ningun_enlace_temporal_sobrevive_en_el_directorio_de_datos - no .knowledge_live.tmp.* file survives after promotions; (3) verificar_medio_sellado_es_rechazado_por_el_check_de_metadatos_de_epoca - a deliberate half-seal (only numero_de_epoca or only sellada_ms) is rejected by the CHECK constraint in both directions; (4) verificar_abrir_gestor_sobre_enlace_ya_existente_reporta_ambas_sondas_sanas - GestorDePools::abrir over an already-symlinked knowledge_live.db reports both probes Sana; (5) verificar_ac10_interrupcion_tras_enlace_simbolico_y_antes_del_swap_de_pool - calling sellar_y_consolidar_staging and reasignar_enlace_de_la_epoca_viva directly (without the ArcSwap step) simulates a crash between the symlink swap and the pool swap; the original in-memory gestor keeps serving valid reads and a freshly reopened GestorDePools follows the new symlink with no repair code."
      - "Adjusted the shared test fixture preparar_staging_valido to explicitly set PRAGMA journal_mode=WAL right after creating the staging file, matching real production behavior (hexcell_storage::conocimiento opens staging via abrir_lectura_escritura, which always sets WAL). Without this, the first-ever WAL-mode switch inside the sealer's own connection required exclusivity and collided with the Fix-3 test's concurrent reader, producing an unrelated SQLITE_BUSY on the journal_mode pragma rather than exercising the intended checkpoint gate."
    verify_pending: false
