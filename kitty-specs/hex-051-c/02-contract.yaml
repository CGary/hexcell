task_id: HEX-051-c
summary: sessions.db migration 0004 defers foreign keys and rebuilds only reservas with a nullable id_conversacion, adds the consumo_de_ingesta view, and adds reservar_presupuesto_de_ingesta.
goal: Prepare the sessions.db accounting substrate that stage A-5 task 3 needs, so a catalog ingestion can reserve budget without a conversation. Raise VERSION_DE_ESQUEMA_DE_SESIONES from 3 to 4 with one new rung in the stepped ladder. The rung defers foreign-key enforcement with PRAGMA defer_foreign_keys and rebuilds ONLY `reservas`; `movimientos` is never dropped, copied or recreated, and no helper or staging table is created. Every guarantee in this migration is VACUOUS on an empty database, where there are no parent rows to orphan, so the seeded upgrade test is the only thing standing between this task and a green suite over a broken migration. Implement no embeddings port, no adapter, no batching, no retry, and no actual consumption of the ingestion budget; those belong to siblings HEX-051-a and HEX-051-b.
