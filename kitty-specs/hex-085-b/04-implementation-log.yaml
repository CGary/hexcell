task_id: HEX-085-b
summary: Revise fix for 06-review.json revise verdict; scoped strictly to the eight fix_tasks.
entries:
  - changed_files:
      - path: crates/hexcell-admin/tests/reemparejamiento.rs
      - path: crates/hexcell-admin/tests/ciclo_de_vida.rs
    notes:
      - Injected PlazosDeReemparejamiento (cadencia_ms 1) into every reemparejamiento.rs test via
        ejecutar_reemparejamiento called directly, replacing por_omision() from
        ejecutar_con_efectos; no test in the crate sleeps real seconds any more (hexcell-admin
        suite wall time dropped from ~2.1 s minimum to ~1.5 s for the reemparejamiento file).
      - Used the previously dead helper plazos_de_rebind() in tests/ciclo_de_vida.rs for four new
        unit-level guards on solicitar_emparejamiento, reanudar_envio and
        descartar_sqlstore_y_rearrancar.
      - Fixed the misleading comment and removed the unconsumed second guion at
        codigo_expirado_deja_la_fila_reemparejando_y_sin_sustituciones (the budget with a
        negative window makes exactly one attempt, not a pair).
    verify_pending: false
  - changed_files:
      - path: crates/hexcell-admin/tests/reemparejamiento.rs
      - path: crates/hexcell-admin/tests/ciclo_de_vida.rs
      - path: crates/hexcell-admin/tests/almacen_plano_de_control.rs
    notes:
      - Added the missing blueprint scenarios: step-7 pausa retry (sin_conexion then aplicado) at
        both unit and end-to-end level; pairing sin_conexion twice then codigo; pairing fallido
        with another motivo ending Fallo with the row left Reemparejando and no sustituciones row;
        reanudar fallido ending Fallo with the row left Reemparejando; budget exhaustion after
        4 status polls with injected plazos (AC-13); AC-9 end-to-end (close probe exit 1 writes
        one diagnostic line and the sequence still reaches Exito); confirmar_reemparejamiento
        rollback when the sustituciones insert fails (forced by dropping the table from a second
        connection).
    verify_pending: false
  - changed_files:
      - path: crates/hexcell-admin/src/ciclo_de_vida.rs
      - path: crates/hexcell-admin/src/comandos.rs
    notes:
      - Narrowed solicitar_emparejamiento's return type to DesenlaceDeSolicitudDeEmparejamiento
        (Codigo/CanalSinSesion only, no metodo field) so comandos.rs no longer needs the dead
        Ok(Fallido) match arm; the compiler now enforces that a fallido pairing response can never
        reach the caller as Ok.
      - Replaced the unreachable!() panic path in ejecutar_reemparejamiento (transition rejection
        arm) with a diagnosed Fallo; no production path in the crate panics.
      - The "emparejamiento <metodo>: <valor>" line now prints metodo.nombre_de_cable() (the
        operator's --metodo choice) instead of the core's echoed field.
    verify_pending: false
