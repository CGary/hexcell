mutaciones:
  - descripcion: >-
      M3 reubicado a mano: persistir EnEjecucion->Reemparejando ANTES de la sonda de pausa del
      paso 3 (comandos.rs, en_secuencia_completa) en vez de después de preparar_reemparejamiento.
    prueba_que_se_puso_roja: pausa_fallida_en_el_paso_3_no_persiste_ni_hace_nada_destructivo
  - descripcion: >-
      M5 aplicado a mano: el cuerpo de la sonda de emparejamiento siempre manda {"metodo":"qr"}
      sin importar el --metodo elegido (ciclo_de_vida.rs, solicitar_emparejamiento).
    prueba_que_se_puso_roja: solicitar_emparejamiento_reintenta_sin_conexion_y_envia_el_metodo_elegido
  - descripcion: >-
      M8 aplicado a mano: reanudar_envio trata un fallido como éxito (colapsa las tres variantes
      de DesenlaceDePausa en un único Ok(())).
    prueba_que_se_puso_roja: reanudar_envio_falla_si_la_respuesta_es_fallido
  - descripcion: >-
      M9 aplicado a mano (dos veces): solicitar_emparejamiento reintenta sobre CUALQUIER motivo
      en vez de sólo sin_conexion (quitando la guarda `if motivo == "sin_conexion"`).
    prueba_que_se_puso_roja: >-
      solicitar_emparejamiento_no_reintenta_con_otro_motivo (unitaria) y
      resume_con_emparejamiento_fallido_por_otro_motivo_no_reintenta_ni_persiste
      (secuencia completa)
  - descripcion: >-
      Rollback de confirmar_reemparejamiento: se ignora el error del INSERT en sustituciones con
      `let _ =` y se confirma la transacción de todas formas, rompiendo la atomicidad.
    prueba_que_se_puso_roja: confirmar_reemparejamiento_revierte_si_falla_la_insercion_en_sustituciones
  - descripcion: >-
      Reintento del paso 7 invertido a mano: la guarda de descartar_sqlstore_y_rearrancar pasa de
      `motivo == "sin_conexion"` a `motivo != "sin_conexion"`, así que sin_conexion aborta de
      inmediato en vez de reintentar.
    prueba_que_se_puso_roja: >-
      descartar_sqlstore_y_rearrancar_reintenta_la_pausa_tras_sin_conexion (unitaria) y
      paso_7_pausa_reintenta_una_vez_tras_sin_conexion_y_continua_hasta_exito (secuencia completa)
  - descripcion: >-
      AC-9 suprimido a mano: se deja de escribir el aviso de cierre fallido por el sumidero de
      diagnóstico (comandos.rs).
    prueba_que_se_puso_roja: cierre_fallido_emite_un_aviso_por_diagnostico_y_continua_hasta_exito
  - descripcion: >-
      AC-13 vaciado a mano: esperar_confirmacion ignora el presupuesto calculado y hace SIEMPRE un
      único intento.
    prueba_que_se_puso_roja: presupuesto_de_confirmacion_se_agota_tras_varias_sondas_de_estado
