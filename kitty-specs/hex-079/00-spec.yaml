task_id: HEX-079
summary: Live scripted instrument to measure composed-cell memory (cgroup v2 RSS) and image sizes, whatsmeow adapter, as reference values. No CI gate.
goal: >
  Deliver a live shell script, following the deploy/verificar_aislamiento.sh pattern, that brings up
  the composed cell (deploy/cell.compose.yml, task 5 of fase-a-6) with the whatsmeow adapter under the
  cgroup limits configured in task 6, reads aggregate RSS memory of both containers from cgroup v2
  (never from host /proc) at rest and while an external load generator drives the cell, and reads the
  size of both container images via docker image inspect. Also add a reference-values section in docs
  where a later manual run records the real measured numbers. This task delivers the measurement
  instrument, not the measured numbers.
invariants:
  - Memory is read from cgroup v2 of the running containers (memory.current or equivalent), never from
    host /proc.
  - The measured cell is the full composed cell of task 5 (core + whatsmeow sidecar), not a single
    container and not the simulated adapter.
  - rss_linea_base is never reused or modified by this task; it continues to measure only the core with
    the simulated adapter.
  - No CI gate on image size or memory is introduced, per the HEX-067 decision.
  - The script never versions *.db, *.db-wal, *.db-shm, or .env* artifacts it may produce while running.
  - Any mechanical assertion the script makes is provable by mutation (a check that has never been seen
    to fail is not yet a check).
acceptance:
  - id: AC-1
    statement: >
      A live script exists that brings up the composed cell of task 5 (deploy/cell.compose.yml) with the
      whatsmeow adapter under the cgroup limits of task 6, following the skeleton of
      deploy/verificar_aislamiento.sh.
    given: the composed cell definition and cgroup limits from tasks 5 and 6 are present in the repo
    when: the script is run manually against a real Docker environment
    then: it starts both containers of the composed cell with the whatsmeow adapter and the configured
      cgroup limits
  - id: AC-2
    statement: >
      The script reads aggregate RSS memory of both containers from cgroup v2 (not from host /proc), at
      rest and under load.
    given: the composed cell is running
    when: the script queries each container's cgroup v2 memory accounting at rest, then again while a
      load generator is driving traffic against the cell
    then: it reports an aggregate RSS figure for both containers combined, sourced from cgroup v2, for
      each of the two conditions (rest, under load)
  - id: AC-3
    statement: >
      Load is generated by reusing the crates/hexcell/tests/carga.rs scenario as an external generator
      against the running cell; if that cannot be done without modifying carga.rs, the script explicitly
      declares the limitation and justifies whatever generator it uses instead.
    given: the composed cell is running and reachable
    when: the script attempts to drive load using the carga.rs scenario as an external, unmodified
      generator
    then: either it succeeds and documents how, or it records an explicit, justified declaration of the
      limitation and the substitute load method actually used
  - id: AC-4
    statement: The script reads and reports the size of both container images via docker image inspect.
    given: both images (core and whatsmeow sidecar) have been built
    when: the script runs
    then: it reports each image's size as read from docker image inspect
  - id: AC-5
    statement: A reference-values section is added to docs to hold the real numbers from a later manual
      run.
    given: the script exists
    when: docs are updated
    then: a documented location (in docs/) exists for recording the reference values, initially without
      real measured numbers
  - id: AC-6
    statement: >
      DEFERRED — no CI gate on size or memory is added, and no real measured numbers are required to
      merge this task; a live run against real containers is a later, separate manual step, matching how
      verificar_aislamiento.sh was handled. This criterion is explicitly deferred and must not be flagged
      as an unmet gap by q-analyze.
    given: this task's script requires live Docker containers to actually run
    when: the task is evaluated for merge
    then: the absence of a completed live run and of real measured numbers does not block acceptance
risk: medium
non_goals:
  - Do not add a size or memory gate to CI (superseded by the HEX-067 decision).
  - Do not modify or reuse rss_linea_base.
  - Do not modify crates/hexcell/tests/carga.rs to make it embeddable; if reuse as an external generator
    is infeasible, declare the limitation instead.
  - Do not perform or record a real measurement run as part of this task's completion; that is deferred
    to a later manual step.
constraints:
  - Follow the skeleton and conventions of deploy/verificar_aislamiento.sh and its sibling scripts in
    deploy/ (verificar_aislamiento_estatica.sh, verificar_limites.sh, verificar_endurecimiento.sh,
    verificar_apagado_ordenado.sh).
  - All script content, comments, and documentation additions are in Spanish, matching the repository
    language rule.
  - Memory must be read via cgroup v2 interfaces of the containers, not via docker stats defaults that
    may proxy through /proc, and not via host-level /proc inspection.
  - Uses deploy/cell.compose.yml (task 5) and the cgroup limits established in task 6, without
    introducing a separate compose topology.
