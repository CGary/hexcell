  - "deploy/medir_memoria_y_imagenes.sh::preparar_entorno_efimero"
  - "deploy/medir_memoria_y_imagenes.sh::localizar_cgroup_v2"
  - "deploy/medir_memoria_y_imagenes.sh::leer_memoria_cgroup"
  - "deploy/medir_memoria_y_imagenes.sh::generar_carga"
  - "deploy/medir_memoria_y_imagenes.sh::medir_tamano_imagen"
