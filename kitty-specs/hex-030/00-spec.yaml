task_id: HEX-030
summary: 'Acta of the e2e restore rehearsal branch 1 (VALID with critical finding: backup set misses identidad.db) plus the 6 new lab findings and 3 pending product decisions.'
goal: 'Document, with nothing lost (explicit human order of 2026-08-20), the second lab block of 2026-08-19/20: (A) the e2e restore rehearsal BRANCH 1 is VALID per the plan criterion - hexcell respaldar produced 4 verified copies (sqlstore-first fail-empty order observed, round id printed, exit 0), the restore onto a clean environment resumed the WhatsApp session from the backup without re-scanning, and the bot reconnected AND replied to a real message - with the critical caveat that the restored cell re-sent its presentation because the backup set is incomplete; BRANCH 2 (device_removed: restore WITHOUT sqlstore + re-pair) remains pending, scheduled next session. (B) Six NEW findings, each traced to its live evidence: (7) hexcell emparejar has the same IPC connection-displacement behavior as respaldar with no documented operational discipline anywhere (found by the HEX-029 architect, left out of that scope); (8) the lab harness default HEXCELL_LAB_DIR=/tmp is volatile - a system reboot on 2026-08-19 destroyed all cell state including the paired session; (9) window/ramp deferrals are INVISIBLE: no log line, in-memory counters (ContadorAplazadasPorHorario/PorRampa) exposed nowhere - cost roughly one hour of live diagnosis; (10) the attention-window default timezone is America/Argentina/Buenos_Aires (configuracion.go VentanaZonaPorOmision), one hour off the real deployment (Santa Cruz, Bolivia = America/La_Paz): a plausible-but-foreign default that fails silently - the proposed fix direction is making the zone REQUIRED per cell (fail-closed at startup when absent); (11) the respaldar mode logs id_celula=sin-configurar (cosmetic: cell id not threaded into the mode); (12) CRITICAL: the backup set covers 4 stores but the live data directory has FIVE - identidad.db (the sidecar Go identity store holding the conversation-id mapping, the circuit breaker state and the STOP list) is NOT backed up, so a restore re-introduces the bot to known contacts (observed live: duplicated presentation) and would REVIVE opted-out STOP contacts, violating the plan rule that a re-pairing must not revive unsubscribed contacts; the plan says "four stores" and the implementation split adapter identity into two files - fix task required with priority. (C) Three product decisions PENDING, not invented: an off-hours away-message (a single immediate auto-reply per contact per closed window, mirroring the official WhatsApp Business ausencia pattern); TTL-bounded re-enqueue of outbound entries at startup (bounds the silent-loss window on restart without reviving stale messages); and documenting the EXISTING anti-24/7 hard guard (16-hour max window, discovered live) as a taken product decision in user-facing docs.'
risk: low
acceptance:
    - id: AC-1
      statement: 'docs/STATUS.md gains a Definido entry (dated 2026-08-20, appended at the END of the Definido section, traced to plan task 18 of A-3) recording the branch-1 rehearsal as VALID with its evidence chain (respaldar 4 copies sqlstore-first, clean-environment restore, session resumed without QR, bot reconnected and replied) and stating explicitly that branch 2 (device_removed path) remains pending for the next lab block.'
    - id: AC-2
      statement: 'docs/STATUS.md registers findings 7-12 from the goal as Pendiente entries per the file conventions (extending existing entries where one already covers the topic instead of duplicating), each with its live evidence and date 2026-08-20; finding 12 (identidad.db missing from the backup set) is explicitly marked as the priority fix because it can revive STOP contacts on restore, and finding 10 carries the proposed fix direction (zone required per cell, fail-closed) as a proposal, not as a taken decision.'
    - id: AC-3
      statement: 'docs/STATUS.md registers the three product decisions from the goal as pending decisions (mensaje de ausencia fuera de horario; reencolado acotado por TTL al arrancar; documentar la guardia anti-24/7 existente), phrased as decisions awaiting the human, with no invented parameters; and docs/runbook-restauracion-de-celula.md gains the branch-1 rehearsal outcome (what was validated, the exact restore steps used, and the honest warning that identidad.db is not yet in the backup set so circuit-breaker/STOP/conversation-mapping state does not survive a restore today).'
    - id: AC-4
      statement: 'Docs-only diff (docs/STATUS.md and docs/runbook-restauracion-de-celula.md are the only touched files; the STATUS header date updates to 2026-08-20 per file convention); the 7 standard verification commands pass.'
constraints:
    - 'Docs-only: nothing is fixed in code; the findings are RECORDED. Each becomes its own task when prioritized.'
    - 'Everything in Spanish, absolute dates (2026-08-19 / 2026-08-20), no mass-sending-provider vocabulary, never text implying Fase B replaces the sidecar.'
    - 'STATUS.md conventions authoritative: Definido appended at end; Pendiente entries phrased as pending work/decisions; existing content preserved, additions only.'
    - 'No invented numbers or parameters (the away-message wording, TTL values, ramp caps stay unset - "a calibrar" where applicable).'
    - 'The timezone finding is recorded with its proposed direction clearly labeled as PROPOSAL; the anti-24/7 guard is recorded as an EXISTING taken decision being documented, not a new one.'
    - 'Consult docs/bitacora-de-descartes.md before writing anything resembling a previously discarded idea (the TTL re-enqueue proposal must reference that "nada se reencola al arrancar" is a deliberate task-12 design being partially reopened as a bounded variant - if the bitacora holds a related discard, cite its D-NN and reopening condition instead of re-arguing).'
    - 'Artifact YAML prose in English; the documentation itself in Spanish.'
invariants:
    - 'Nothing weakens the structural-ban-risk doctrine; the anti-24/7 guard documentation reinforces it.'
    - 'All existing STATUS.md and runbook content preserved; additions only.'
    - 'The 7 standard verification commands pass.'
non_goals:
    - 'Fixing any finding (7-12) - each is its own future task; finding 12 is flagged priority but NOT implemented here.'
    - 'Deciding any of the three product decisions - they are registered, not resolved.'
    - 'Branch 2 of the rehearsal (next lab block).'
    - 'Any code, script or config change.'
