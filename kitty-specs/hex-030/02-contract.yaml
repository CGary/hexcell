task_id: HEX-030
summary: Docs-only append of branch-1 restore rehearsal evidence, six new lab findings (7-12), and
  three pending product decisions to STATUS.md and the restore runbook.
goal: 'Record, with nothing lost, the second lab block of 2026-08-19/20: the branch-1 e2e restore
  rehearsal as VALID with its evidence chain and branch 2 named pending; the six new findings 7-12
  each with live evidence, finding 12 flagged priority and finding 10 labeled proposal; and the three
  pending product decisions with no invented parameters. Review reads the diff to verify doc
  presence and phrasing, since acceptance here is prose content, not a machine-checkable behavior.'
read:
  - .ai/tasks/active/HEX-030-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-030-new-spec/01-blueprint.yaml
  - docs/STATUS.md
  - docs/runbook-restauracion-de-celula.md
  - docs/runbook-canal-whatsmeow.md
  - docs/bitacora-de-descartes.md
  - docs/adr/adr-0020-respaldo-y-restauracion-por-celula.md
  - sidecar/internal/configuracion/configuracion.go
  - sidecar/internal/outbox/disciplina.go
touch:
  - docs/STATUS.md
  - docs/runbook-restauracion-de-celula.md
forbid:
  files:
  - docs/runbook-canal-whatsmeow.md
  - docs/runbook-canal-fase-a.md
  - docs/plan/fase-a-3-adaptador-whatsmeow.md
  - docs/bitacora-de-descartes.md
  - docs/adr/README.md
  - crates/hexcell/src/preparacion.rs
  - crates/hexcell-storage/src/respaldo.rs
  - sidecar/main.go
  - sidecar/internal/configuracion/configuracion.go
  - sidecar/internal/outbox/disciplina.go
  - sidecar/internal/outbox/outbox.go
  - sidecar/internal/identidad/cortacircuitos.go
  - sidecar/go.mod
  - sidecar/go.sum
  - Cargo.toml
  - Cargo.lock
  behaviors:
  - Do NOT modify any source file (crates/**, sidecar/**), any script (scripts/**), any config
    file, or any file other than docs/STATUS.md and docs/runbook-restauracion-de-celula.md. This is
    a docs-only task; findings are recorded, never fixed, and none of the three product decisions
    is resolved.
  - Do NOT delete, rewrite, or reorder any existing docs/STATUS.md content. In the Definido
    section, append exactly one new entry after the current last entry (HEX-029, 2026-08-19) and
    before the "## Pendiente" heading - never insert it earlier in the section.
  - Do NOT duplicate a Pendiente entry for a topic an existing entry already covers; extend the
    existing entry in place instead of creating a second one on the same subject.
  - Do NOT phrase finding 10 (timezone default) as a taken decision; the zone-required-per-cell,
    fail-closed direction is a PROPOSAL only.
  - Do NOT phrase the anti-24/7 guard (16-hour max window) as a new decision; it is an EXISTING
    taken decision being documented for the first time in user-facing docs.
  - Do NOT invent numeric parameters anywhere in the new prose (away-message wording, TTL values,
    ramp caps, thresholds) - leave them explicitly unset ("a calibrar") where the goal requires it.
  - Do NOT cite a bitacora-de-descartes.md D-NN entry for the TTL-bounded re-enqueue proposal unless
    it actually covers that specific discard; D-13 covers queueing outside the 24h service window,
    a different topic - if no dedicated entry exists, reference the HEX-017 STATUS.md Definido entry
    ("sin cola de reenvío ni recuperación al arrancar") directly as the design being partially
    reopened, and do not fabricate or misattribute a D-NN citation.
  - Do NOT use mass-sending-provider vocabulary (jitter, warm-up/calentamiento, proxies, VPN, IP
    rotation) anywhere, and never write or imply that Fase B replaces, retires, or closes the
    sidecar channel.
  - Do NOT write any user-visible content (docs/STATUS.md prose, runbook prose, commit message) in
    English; keep it in Spanish. Only this contract's and the blueprint's own YAML prose stays in
    English.
  - Do NOT use relative dates anywhere; use only 2026-08-19 and 2026-08-20 as absolute dates.
  - Do NOT mark branch 2 (device_removed restore without sqlstore) as validated or exercised; it
    stays explicitly pending for the next lab block.
  - Do NOT soften or omit the identidad.db backup-set gap in docs/runbook-restauracion-de-celula.md;
    state plainly that circuit-breaker/STOP/conversation-mapping state does not survive a restore
    today.
verify:
  commands:
  - cargo fmt --check
  - cargo build --workspace
  - cargo clippy --workspace -- -D warnings
  - cargo test --workspace
  - test "$(cargo tree -p hexcell-core | wc -l)" = "1"
  - cargo test -p hexcell-core --doc 2>&1 | grep -q "compile fail"
  - cd sidecar && test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test ./...
acceptance:
  human_gate: true
limits:
  max_files_changed: 2
  max_diff_lines: 150
  per_class:
  - glob: docs/STATUS.md
    max_diff_lines: 95
  - glob: docs/runbook-restauracion-de-celula.md
    max_diff_lines: 55
execution:
  mode: worktree_edit
  branch: ai/HEX-030
retry_policy:
  max_attempts: 2
  escalate_after: 2
