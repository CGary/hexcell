test_scenarios:
    - covers:
        - AC-1
      statement: Spawning the hexcell binary (CARGO_BIN_EXE_hexcell) with every mandatory variable set and HEXCELL_RUTA_DATOS pointing at an existing temp dir leaves the process alive, and it prints on stdout the resolved health bind address plus a line naming the configured channel, proving both the HTTP server and the engine loop started.
    - covers:
        - AC-2
      statement: 'Spawning the binary with HEXCELL_RUTA_DATOS unset exits non-zero within a couple of seconds, stderr names HEXCELL_RUTA_DATOS and its expected format, stderr contains no panic/RUST_BACKTRACE text, and nothing was bound: a TCP connect to the health address is refused.'
    - covers:
        - AC-2
      statement: Spawning the binary with HEXCELL_RUTA_DATOS set to a path that does not exist on disk exits non-zero naming that variable and that path, rather than deferring the failure to a first write.
    - covers:
        - AC-2
      statement: Spawning the binary with HEXCELL_DIRECCION_SALUD set to a value that is not a socket address, and separately with HEXCELL_CANAL set to an unknown channel name, exits non-zero in each case naming the offending variable and listing its accepted format.
    - covers:
        - AC-3
      statement: Against the spawned binary bound to an OS-chosen port on 127.0.0.1 (port 0, real port read back from stdout), a raw std::net::TcpStream sending `GET /health/live HTTP/1.1` gets a `200` status line, with no SQLite pool and no channel adapter reachable at all.
    - covers:
        - AC-4
      statement: The same raw TCP client sending `GET /health/ready HTTP/1.1` gets a body that names HEX-006 as the owner of the real readiness logic; the response never claims a pool or session check was performed, and salud.rs contains no pool/SQLite/session probe.
    - covers:
        - AC-5
      statement: A unit-level test drives Motor::ejecutar over an AdaptadorSimulado whose window is open, injects one EventoEntrante deterministically, and observes exactly one captured outbound MensajeSaliente::RespuestaLibre echoing the inbound text, paired with the ResultadoEnvio the adapter returned.
    - covers:
        - AC-5
      statement: Motor::ejecutar handles Ok(Aceptado) and each of the four Ok(rejection) values without panicking and without stopping the loop, and handles Err(_) from a forced simulated transport fault the same way; crates/hexcell/src/motor.rs contains no unwrap() or expect() anywhere, so the match is the only path.
    - covers:
        - AC-6
      statement: With RelojDePrueba, a conversation receives an EventoEntrante (window opens), the test clock advances by DURACION_VENTANA_SERVICIO plus one second, and send(conversacion, RespuestaLibre) returns Ok(ResultadoEnvio::FueraDeVentana) while estado_ventana returns Cerrada. The same sequence with the clock advanced by DURACION_VENTANA_SERVICIO minus one second returns Ok(Aceptado) and Abierta.
    - covers:
        - AC-6
      statement: The identical expiry sequence runs to completion in well under a second of wall time and yields the same verdict on repeated runs, proving no dependency on SystemTime::now(); crates/hexcell-canal-simulado/src/adaptador.rs never calls SystemTime::now() and never restates 24h, using DURACION_VENTANA_SERVICIO instead.
    - covers:
        - AC-7
      statement: For four distinct conversations the simulated adapter is told to force FueraDeVentana, PlantillaRequerida, LimiteDeTasa and DestinatarioInvalido respectively; four send() calls return those four values, a match with no wildcard arm separates them, and asserting the four are pairwise distinct passes.
    - covers:
        - AC-7
      statement: 'A forced rejection queued for a single call applies to that call only: the next send() on the same conversation with an open window returns Ok(Aceptado), so forcing is not a sticky global mode that would blur the four cases together.'
    - covers:
        - AC-8
      statement: '`cargo fmt --check`, `cargo clippy --workspace --all-targets -- -D warnings` and `cargo test --workspace` all terminate with no errors or findings on the resulting tree, including the new crate and the new test files.'
    - covers:
        - AC-9
      statement: 'crates/hexcell-core/Cargo.toml''s [dependencies] table is still empty: no tokio, no hyper/hyper-util/http-body-util/bytes, no axum, no hexcell-canal-simulado; and no file under crates/hexcell-core/ is added, removed or modified by this task.'
    - covers:
        - AC-9
      statement: No `impl ChannelAdapter for` exists anywhere under crates/hexcell-core/, and the single implementation in the tree lives in crates/hexcell-canal-simulado/.
    - covers:
        - AC-8
      statement: Cargo.lock is tracked by git after this task (git ls-files lists it), .gitignore no longer carries a Cargo.lock line, and the lock file pins every crate the workspace resolves, so a rebuild on the target hardware is reproducible.
    - covers:
        - AC-10
      statement: docs/adr/adr-0016-convencion-de-entrega-de-eventos.md exists, states the mpsc delivery convention decided outside the ChannelAdapter trait with its rationale and its consequence for A-3, is dated 2026-07-29 in absolute form, and never claims that Fase B replaces, substitutes or closes Fase A nor that the sidecar is retired.
    - covers:
        - AC-10
      statement: 'docs/adr/README.md''s table gains exactly one row for adr-0016 pointing at etapa A-2, and rows 0001 to 0015 keep their numbers, their order and their text unchanged: no number is reused, renumbered or reordered, and adr-0003 stays reserved for the persistencia dual that HEX-006 will write.'
    - covers:
        - AC-10
      statement: docs/STATUS.md gains Definido entries for the event-delivery convention (adr-0016) and for versioning Cargo.lock, both dated 2026-07-29, while no wording anywhere in the file marks etapa A-2 as closed or cerrada, and no bullet already marked Definido is rewritten.
    - covers:
        - AC-10
      statement: The diff contains no reusable port contract battery generic over ChannelAdapter (the new tests name AdaptadorSimulado concretely), no SQLite/rusqlite/sqlx/migration/schema code, no SIGTERM or signal handling, and no readiness logic beyond the fixed skeleton body. docs/STATUS.md is edited, which AC-10 permits, but nothing in it marks etapa A-2 as closed.
    - covers:
        - AC-5
        - AC-10
      statement: crates/hexcell/src/motor.rs and crates/hexcell/src/procesador.rs contain no occurrence of whatsmeow, JID, wa_id, Cloud API or Graph API in code or comments; the engine names only hexcell_core types.
