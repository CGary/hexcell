      notes:
        - 'adr-0016 usa el número 0016 (docs/adr/README.md ya reserva 0001-0015, incluido 0003 para persistencia-dual que HEX-006 escribirá). Contexto/Decisión/Consecuencias/Alternativas descartadas siguiendo la forma de adr-0010: la decisión es un tokio::sync::mpsc acotado creado y poseído por cada adaptador, entregado al motor al construirse, sin añadir un método al trait; alternativas descartadas: método recv/subscribe en ChannelAdapter (reabriría hexcell-core y el trait no es compatible con objetos de trait) y callback/handler (invierte el control). Fechado 2026-07-29, sin afirmar que la Fase B sustituye o cierra la Fase A ni que el sidecar se retira.'
        - docs/adr/README.md gana exactamente una fila al final de la tabla para adr-0016; las filas 0001-0015 y la prosa circundante quedaron intactas.
