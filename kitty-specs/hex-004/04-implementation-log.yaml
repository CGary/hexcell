        - Cargo.lock
      notes:
        - 'Se retiró la línea Cargo.lock de la sección Rust de .gitignore, sin tocar /target ni el resto de secciones. Cargo.lock se generó con cargo (no se editó a mano) al ejecutar cargo build/test contra el árbol real: 273 líneas, 21 paquetes externos nuevos (tokio 1.53.1, hyper 1.11.0, hyper-util 0.1.20, http-body-util 0.1.4, bytes 1.12.1 y su cierre transitivo). git ls-files confirma que queda versionado.'
      verify_pending: false
