  - .ai/tasks/active/HEX-085-a/00-spec.yaml
  - .ai/tasks/active/HEX-085-a/01-blueprint.yaml
  - .ai/tasks/active/HEX-085-new-spec/00-spec.yaml
  - .ai/tasks/active/HEX-085-new-spec/01-blueprint.yaml
