task_id: HEX-019
summary: Implement the whatsmeow adapter channel-behavior discipline (A-3 task 14) as non-disableable, per-cell-configurable measures documented with [documented cause]/[precautionary] marks.
goal: >
  Implement the channel behavior discipline required by A-3 plan task 14 and by
  adr-0015 Layer 1: minimum response latency and business-hours schedule (configurable
  per cell); a "typing" indicator emitted before responding (documented as zero-cost
  hygiene, not a defense, per adr-0015's exact caveat); variation of the presentation/
  greeting message template; exactly one outbound message per turn with no group,
  broadcast, or status primitives available in the adapter; bot identification plus a
  human-handoff offer in the very first turn; a conversational circuit breaker that, on
  detected repetition or frustration, cedes to a human by emitting a single handoff
  message and then stays silent (wired at the documented seam in
  sidecar/internal/outbox/portero.go, ahead of the opt-out/STOP check, without relocating
  that check); and a configurable volume ramp for a cell's first weeks. All parameters are
  configurable per cell through sidecar/internal/configuracion (following the existing
  TTL/retry/opt-out env-var pattern), but disabling the discipline itself must not be a
  configuration option. This task closes the STATUS.md open entry "Política anti-ban no
  desactivable por configuración" (2026-08-08, HEX-015).
invariants:
  - No configuration path (env var or otherwise) can fully disable the channel behavior
    discipline; only calibratable parameters (latency, schedule, ramp values, breaker
    thresholds) are configurable.
  - At most one outbound message is emitted per conversational turn; the adapter exposes
    no group, broadcast, or status-update primitives.
  - The opt-out (STOP) check in sidecar/internal/outbox/portero.go remains the earliest
    gate in the send path; the circuit breaker is wired ahead of it per the existing seam
    comment, without relocating or weakening the STOP check.
  - The circuit breaker's handoff is exactly one message, after which the bot goes silent
    for that conversation until a human or an explicit reset re-engages it.
  - Bot identification and the human-handoff offer are present in the first turn of every
    new conversation.
  - Every discipline measure is documented inline (or in the accompanying doc) with its
    adr-0015 classification mark, [documented cause] or [precautionary]; the typing
    indicator's documentation carries the exact adr-0015 caveat (zero-cost hygiene, not a
    proven defense) alongside its limitations.
  - No mass-sending-provider vocabulary (jitter, warm-up, proxies, IP rotation) is
    introduced; the volume ramp is documented strictly as damage limitation, never as
    throughput management or ban-evasion.
acceptance:
  - id: AC-1
    statement: Minimum response latency and a business-hours schedule are configurable per
      cell via sidecar/internal/configuracion env vars, following the existing
      TTL/retry/opt-out pattern, with documented "a calibrar" defaults.
    given: a cell configured with a minimum latency and a business-hours window
    when: an inbound event arrives outside business hours or before the minimum latency
      has elapsed
    then: the adapter withholds or delays the outbound response accordingly, and the
      applied values are read from the per-cell configuration, not hardcoded
  - id: AC-2
    statement: A "typing" indicator is emitted before every outbound response, documented
      alongside its adr-0015 limitations (zero-cost hygiene, not a proven defense; no
      warm-up/jitter framing).
  - id: AC-3
    statement: The presentation/greeting message template varies across sends rather than
      repeating an identical fixed string.
  - id: AC-4
    statement: The adapter enforces exactly one outbound message per turn and exposes no
      group, broadcast, or status-update send primitives.
    given: a turn that could plausibly produce multiple outbound messages
    when: the adapter processes that turn
    then: only one outbound message is sent, and no code path in the adapter can construct
      a group/broadcast/status send
  - id: AC-5
    statement: The first turn of a new conversation includes bot identification and an
      explicit human-handoff offer.
  - id: AC-6
    statement: A conversational circuit breaker, wired at the documented seam in
      sidecar/internal/outbox/portero.go ahead of the opt-out/STOP check, detects
      repetition or frustration and cedes to a human by emitting exactly one handoff
      message, then suppresses further automated replies for that conversation.
    given: a conversation that trips the circuit breaker's repetition/frustration condition
    when: the next turn would otherwise produce an automated reply
    then: exactly one handoff message is emitted and no further automated messages are sent
      for that conversation, while the pre-existing STOP check continues to run at its
      current point in the send path, unmodified
  - id: AC-7
    statement: A volume ramp for a cell's first weeks is configurable per cell, with a
      documented "a calibrar" default, expressed strictly in the plan's own vocabulary
      (never as mass-sending throughput/evasion framing).
  - id: AC-8
    statement: None of the discipline's parameters can be set to a value that disables the
      discipline; attempting to do so is rejected or has no disabling effect, and this is
      covered by a test.
  - id: AC-9
    statement: The previously hardcoded intervaloDrenajeSalida (2s, sidecar/main.go) becomes
      a documented, per-cell configurable parameter if touched by this task's
      configuration work, or is explicitly logged as remaining debt if left untouched.
  - Each of the seven discipline measures carries its adr-0015 [documented cause] or
    [precautionary] mark in the code/doc comments, matching adr-0015's own classification.
  - The 7 standard verification commands pass (cargo fmt --check, cargo build --workspace,
    cargo clippy --workspace -- -D warnings, cargo test --workspace, hexcell-core tree
    isolation check, doc compile-fail test, cd sidecar && go build ./... && go vet ./...
    && go test ./...).
  - docs/STATUS.md's open entry "Política anti-ban no desactivable por configuración"
    (2026-08-08, HEX-015) is updated to reflect closure once the implementation lands.
risk: medium
non_goals:
  - Lab-number testing against a real WhatsApp number (A-3 plan task 15).
  - Reconnection/pairing runbooks (A-3 plan tasks 16-17).
  - sqlstore backup over IPC (A-3 plan task 18).
  - Fase B / Cloud API channel work.
  - Any new re-subscription (opt-in) flow beyond the existing STOP/opt-out mechanism.
  - Extending the Rust core's knowledge of these measures beyond what the existing IPC
    contract already carries; the discipline lives in the sidecar (Go) unless the plan
    text says otherwise.
  - Fixing the hard portfolio cap or incident-rate threshold (adr-0015 Layer 3); those
    remain pending business decisions.
constraints:
  - No new third-party dependencies, Go or Rust.
  - No schema changes to existing tables; sessions.db, knowledge_live.db, and sqlstore
    rules are unchanged.
  - All discipline parameters are configurable per cell (env vars in
    sidecar/internal/configuracion), but disabling the discipline is never a configuration
    option.
  - >-
    Concrete business numbers and texts are SETTLED, not open. The human ratified them on
    2026-08-11; the rulings are recorded as human_ruling events in this task's 07-trace.json
    (topics defaults_numericos, textos, anti_24x7) and are inherited by every child as given.
    Ratified values are minimum latency 3000 ms; drain interval 2000 ms; attention window
    09:00-19:00, ISO weekdays 1-5, zone America/Argentina/Buenos_Aires; volume ramp 20/day
    initial plus 20/day per week for 4 weeks, then a permanent ceiling; circuit-breaker
    repetition threshold 3; frustration keywords humano, persona, agente, operador;
    identification text "Te atiende un asistente automático. Si preferís hablar con una persona,
    escribí «humano».", handoff text "Te paso con una persona del equipo. En cuanto esté
    disponible te responde por acá.", and three neutral presentation variants selected
    deterministically per contact. No child may re-open these as pending ratification or
    substitute its own values; each ships them as the declared default, still per-cell
    configurable and still marked "a calibrar" in the sense that field calibration may later
    change them.
  - >-
    The anti-24/7 rule is ratified and binding. Reject at startup any attention window whose
    duration exceeds 16 hours, so the schedule measure cannot be disabled through configuration.
  - No mass-sending-provider vocabulary (jitter, warm-up/calentamiento, proxies, IP
    rotation); use the plan's own vocabulary, and frame every measure per adr-0015's
    [documented cause]/[precautionary] classification, never as throughput management or
    evasion.
  - Everything user-visible (identifiers, comments, docs, commit message) is written in
    Spanish; artifact YAML prose stays in English.
  - Dates are written in absolute format (2026-08-11), never relative.
  - Consult docs/bitacora-de-descartes.md before proposing anything resembling a
    previously discarded idea; do not re-litigate a discarded approach without meeting
    its documented reopening condition.
decomposition:
  - child_id: HEX-019-a
    summary: >-
      Outbound gate in internal/outbox: minimum latency floor, attention window, volume ramp,
      composing indicator, and the drain interval absorbed from main.go. Measures 1, 2, 7 (AC-1,
      AC-2, AC-7, AC-9).
    depends_on: []
  - child_id: HEX-019-b
    summary: >-
      Circuit breaker: repetition and frustration detection, persistent trip and single handoff
      claim in identidad, enforced at the portero COSTURA ahead of the untouched opt-out check.
    depends_on:
      - HEX-019-a
  - child_id: HEX-019-c
    summary: >-
      First-turn identification and handoff offer, deterministic template variation, one message
      per turn by fixed precedence, sentinel extension for group/broadcast/status. Measures 3, 4, 5.
    depends_on:
      - HEX-019-b
