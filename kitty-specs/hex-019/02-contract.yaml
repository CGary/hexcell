task_id: HEX-019
summary: >-
  Seven adr-0015 Layer-1 channel-behavior measures in the Go sidecar, per-cell configurable but never
  disableable, wired at three seams with no IPC wire change.
goal: >-
  Implement A-3 plan task 14. Wire the seven channel-behavior discipline measures into the sidecar at
  three seams: the circuit-breaker authority at the documented COSTURA in PorteroDeSalida.Admitir,
  ahead of and without relocating the opt-out check; a latency, attention-window and volume-ramp gate
  plus the composing indicator inside the outbound drain, immediately before Transmitir; and a
  single-message-per-turn decision on the inbound path that composes the first-turn identification,
  the varied presentation template and the single handoff message. Every parameter is per-cell
  configurable through sidecar/internal/configuracion following the existing TTL, retry and opt-out
  pattern, with bounded ranges that make disabling the discipline inexpressible in configuration.
  Every default value is a placeholder pending human ratification. State that must survive a restart
  lives in new SQLite tables with atomic RowsAffected claims, following the HEX-018 precedent.

