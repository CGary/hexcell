  files:
  - docs/protocolo-ipc-nucleo-sidecar.md
  - docs/contrato-ipc-respaldo-del-sqlstore.md
  - sidecar/go.mod
  - sidecar/go.sum
  - sidecar/internal/canal/taxonomia.go
  - sidecar/internal/canal/taxonomia_interno_test.go
  - sidecar/internal/canal/emparejamiento.go
  - sidecar/internal/canal/emparejamiento_test.go
  - sidecar/internal/canal/canal_test.go
  - sidecar/internal/canal/traduccion.go
  - sidecar/internal/servidor/manejo.go
  - sidecar/internal/servidor/servidor.go
  - sidecar/internal/ipc/mensajes.go
  - sidecar/internal/configuracion/configuracion.go
  - docs/runbook-canal-whatsmeow.md
  - docs/runbook-canal-fase-a.md
  - docs/adr/README.md
  - Cargo.toml
  - Cargo.lock
  behaviors:
  - Do NOT modify reintentarConexion, procesarEvento, procesarDesconexion, entrarEnPausaTerminal, enPausa, tomarPolitica,
    soltarPolitica, emitirEstado, esperarBaneoTemporal, intervaloDeRetroceso, intervaloNormal, or intervaloBaneo in reconexion.go.
    Arrancar must call the existing reintentarConexion unchanged; do not inline a second copy of its retry logic and do not
    add any new state field to the Supervisor struct.
  - Do NOT modify clasificarDesconexion or proyectarEstado in taxonomia.go, and do not add any new ipc.Causa* constant or
    any new estado_sesion field. No new whatsmeow event classification logic anywhere.
  - Do NOT touch emparejamiento.go or emparejamiento_test.go. The ErrYaEmparejada / IsConnected guards that keep pairing
    and the new startup connect mutually exclusive are existing code (emparejamiento.go:65-66, 142-143) and stay untouched;
    document the exclusivity, do not add new locking.
  - Do NOT touch sidecar/internal/servidor/*.go. EnviarEstadoSesion is passed to NuevoSupervisor unchanged; no new IPC message
    type, field, or wire-version change (docs/protocolo-ipc-nucleo-sidecar.md v1.3, wire version 4, stays untouched).
  - Do NOT bump, downgrade, or re-pin the whatsmeow commit in sidecar/go.mod, and do NOT add any new module to sidecar/go.mod
    or sidecar/go.sum.
  - Do NOT touch any Rust file (crates/**, Cargo.toml, Cargo.lock). If a genuine Rust-side gap is found during implementation,
    record it as a risk in the implementation notes; do not silently fix it here.
  - Do NOT call Supervisor.Arrancar synchronously (blocking) from main.go; it must run in its own goroutine (go supervisor.Arrancar(...))
    so a failing/retrying connect can never delay srv.Escuchar, srv.Aceptar, or the outbox drain loop from starting.
  - Do NOT gate Arrancar on anything other than the emparejada boolean passed by the caller; do NOT have Supervisor import
    or reference the canal.Sesion type (preserve the existing decoupling where Supervisor only knows the injected conectar
    closure).
  - Do NOT write any user-visible content (Go doc comments, log messages, error text, docs/STATUS.md prose, commit message)
    in English; keep it in Spanish. Only this contract's and the blueprint's own YAML prose stays in English. Use absolute
    dates (2026-08-18), never relative ones.
  - Do NOT introduce mass-sending-provider vocabulary (jitter, warm-up/calentamiento, proxies, VPN, IP rotation) anywhere,
    and never write or imply that Fase B replaces, retires, or closes the sidecar channel.
  - Do NOT delete or rewrite any existing docs/STATUS.md Definido entry, including the adjacent HEX-026 entry; append one
    new Definido entry only, dated 2026-08-18, traced to plan task 15 and task 7 of stage A-3.
  - Do NOT fabricate a green test claiming a real reconnection against a live whatsmeow channel succeeded; the new tests
    prove only the wiring (the emparejada gate and the direct call into the existing tested retry loop), with an injected
    connect function, never a real dial, following the existing sentinel-pattern honesty already used in this package (traducirItemQr,
    HEX-026's connect-failure tests).
  - Do NOT delete, weaken, or silently reinterpret any existing test in reconexion_interno_test.go, canal_test.go, or taxonomia_interno_test.go;
    they must keep passing unchanged.
verify:
  commands:
  - cargo fmt --check
  - cargo build --workspace
  - cargo clippy --workspace -- -D warnings
  - cargo test --workspace
  - test "$(cargo tree -p hexcell-core | wc -l)" = "1"
  - cargo test -p hexcell-core --doc 2>&1 | grep -q "compile fail"
  - cd sidecar && test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test ./...
  - cd sidecar && go test -race -count=1 ./internal/canal/... ./...
