task_id: HEX-027
summary: Add Supervisor.Arrancar(ctx, emparejada) as the missing initial-connect entry point, wired from main.go, so a paired
  device self-connects at startup under the existing tested Retroceso discipline.
goal: 'Fix the lab-found defect: main.go builds the reconnection Supervisor and already wires whatsmeow events into it via
  sesion.RegistrarManejador(supervisor) (existing code, unchanged since 2026-08-13), but nothing ever calls Sesion.Conectar
  for an already-paired device at startup, so no whatsmeow event ever fires and the wired Supervisor stays dormant forever
  - the cell is deaf. Add a new exported Supervisor.Arrancar(ctx, emparejada) that, when emparejada is true, calls the existing
  unmodified reintentarConexion loop directly, reusing its tested backoff/terminal-pause/single-flight logic for the first
  connect attempt too; when emparejada is false it is a no-op, preserving pairing (HEX-026) as the only entry to a first
  connection. main.go launches it in a goroutine right after the existing RegistrarManejador wiring. Go-only: no Rust changes,
  no whatsmeow commit bump, no new dependency, no IPC protocol change.'
read:
- .ai/tasks/active/HEX-027-new-spec/00-spec.yaml
- .ai/tasks/active/HEX-027-new-spec/01-blueprint.yaml
- docs/protocolo-ipc-nucleo-sidecar.md
- docs/STATUS.md
- docs/bitacora-de-descartes.md
- sidecar/internal/canal/taxonomia.go
- sidecar/internal/canal/taxonomia_interno_test.go
- sidecar/internal/canal/emparejamiento.go
- sidecar/internal/configuracion/configuracion.go
- sidecar/internal/ipc/mensajes.go
- kitty-specs/hex-026/02-contract.yaml
- kitty-specs/hex-026/01-blueprint.yaml
