    - "bash -c 'test -f crates/hexcell-storage/src/conocimiento.rs && ! sed \"s|//.*||\" crates/hexcell-storage/src/conocimiento.rs | grep -qE \"\\.unwrap\\(\\)|\\.expect\\(|panic!|unreachable!|todo!\"'"
