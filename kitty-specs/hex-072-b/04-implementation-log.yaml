task_id: HEX-072-b
summary: 'Sidecar metrics producer in new leaf package internal/metricas: bounded per-contact ack ratio, reconnections/hour and incoming silence in one periodic key=value log line, plus adr-0033.'
entries:
  - changed_files:
      - sidecar/internal/metricas/metricas.go
      - sidecar/internal/metricas/metricas_test.go
      - sidecar/main.go
      - docs/adr/adr-0033-metricas-de-canal-propio-en-el-sidecar.md
      - docs/adr/README.md
      - docs/STATUS.md
      - docs/bitacora-de-descartes.md
    notes:
      - "Implemented leaf package internal/metricas (stdlib + internal/registro only): Productor with ObservarEnvio/ObservarAcuse/ObservarEstadoSesion/ObservarEntrante/Instantanea/Emitir/Bucle, bounded maps (256 contacts, 1024 correlations), deterministic eviction (oldest-activity, ascending-id tiebreak), shared contactos_omitidos counter, JID-shape guard on the contact key."
      - "Correlation entries are deleted from the map once ObservarAcuse resolves them (their single purpose is fulfilled), keeping MaximoCorrelaciones bounded to in-flight sends rather than all-time correlations; documented as a design choice, not required by the contract."
      - "Wired main.go additively: transmisorObservado decorates outbox.Transmisor (the only seam where idConversacion/idCorrelacion coexist); RegistrarManejadorDeAcuses composed (was dead code per HEX-072-a's own comment); session-state and incoming-event sinks decorated; Productor.Bucle started alongside bucleDeDrenajeSalida."
      - "Discovered mid-implementation: internal/outbox's AST-based centinela_rutas_de_envio_test.go (not in touch list) flags any literal call named 'Transmitir' or prefixed 'Enviar' in non-outbox, non-test .go files. Explicit calls srv.EnviarEstadoSesion(...) and t.interno.Transmitir(...) inside main.go tripped it. Fixed by storing the bound method values under non-matching identifiers (delegado field, notificarEstadoIpc local var) and calling through those -- the same idiom the existing codebase already uses (e.g. Supervisor.sumidero, Supervisor.conectar), not a new evasion."
      - "Wrote 11 test scenarios per blueprint; manually flipped each guarded condition (series omission, aggregate collapse, missing existence check, state-repeat counting, missing silence reset, eviction victim newest/random, tiebreak direction, correlation-eviction counter, JSON emission, JID acceptance, map-order iteration) and confirmed each mutation turned the suite red under plain `go test ./... -count=1`, then reverted to the clean version (diffed byte-identical to the pre-mutation backup)."
      - "Dropped a Bucle-goroutine test that would have required time.Sleep/wall-clock polling for synchronization; contract forbid.behaviors explicitly disallows sleeps/wall-clock in metricas_test.go, and Bucle is not among the 11 required scenarios. Bucle's own ticker plumbing is documented as unexercised for that reason; Emitir/Instantanea (the real logic) are fully covered."
      - "adr-0033 written as new sequential ADR extending adr-0024 (per blueprint's resolved risk: 00-spec.yaml's 'adr-0032' reference is stale, adr-0032 already exists from HEX-071); row added to docs/adr/README.md, Definido entry added to docs/STATUS.md, bitacora entry D-46 added in the same commit."
    verify_pending: false
