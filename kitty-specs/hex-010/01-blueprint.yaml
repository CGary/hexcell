task_id: HEX-010
test_scenarios:
    - covers:
        - AC-1
      statement: The protocol document declares all four mandatory aspects (message format, Unix domain socket transport, delivery-confirmation semantics, both-endpoint reconnection); a Go test reads the doc and asserts each required section heading and the transport statement are present.
    - covers:
        - AC-1
      statement: The document-structure test fails if any of the four mandatory sections is removed, so AC-1 cannot go green on a stub document.
    - covers:
        - AC-2
        - AC-3
      statement: Encoding an envelope and decoding it back yields the identical message for every declared message type (round-trip over the closed type set).
    - covers:
        - AC-3
      statement: Decoding rejects an envelope whose protocol version differs from ipc.VersionProtocolo, returning a typed version-mismatch error rather than a partially-populated message.
    - covers:
        - AC-3
      statement: Decoding rejects an unknown message type, a malformed line, and an empty line without panicking.
    - covers:
        - AC-3
      statement: The encoded form of every message is a single-line, depth-1 JSON object terminated by a newline, so the Rust core can parse it without a serialization crate.
    - covers:
        - AC-3
      statement: The incoming-event message carries only already-translated internal identifiers; a test asserts the encoded field set is exactly the declared closed set and contains no JID-shaped or raw-transport field.
    - covers:
        - AC-1
        - AC-3
      statement: The sqlstore backup order and its acknowledgement encode exactly the fields the A-2 contract fixes (orden, destino, identificador_de_ronda; identificador_de_ronda, resultado, ruta_de_la_copia, bytes, motivo), so the A-2 contract fits this protocol unchanged.
    - covers:
        - AC-3
      statement: The structured logger emits one JSON object per line with the closed field set of adr-0019, and a test asserts JSON escaping of quotes and backslashes is correct.
    - covers:
        - AC-3
      statement: The waLog adapter satisfies the whatsmeow logger interface and routes Debugf below the configured threshold, so whatsmeow debug output carrying message content never reaches the log.
    - covers:
        - AC-2
        - AC-3
      statement: Building a session with the non-persisting device store returns a client with the event handler registered, without opening any network connection; the test passes with no WhatsApp number and no pairing.
    - covers:
        - AC-3
      statement: Configuration loads the socket path and log level from the environment, applies documented defaults, and rejects an empty socket path.
    - covers:
        - AC-2
      statement: go build ./... and go vet ./... exit clean on the sidecar module after the skeleton is added.
    - covers:
        - AC-4
      statement: cargo fmt --check, cargo clippy --workspace -- -D warnings and cargo test --workspace stay green; no Rust file is modified by this task.
